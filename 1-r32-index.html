function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / W, wh / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  canvas.width  = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  viewScale = s * dpr;
  const rect = canvas.getBoundingClientRect();
  viewOX = rect.left; viewOY = rect.top;
  for (const oid of ['dash', 'codex', 'roster']){
    const ov = document.getElementById(oid);
    if (ov && ov.style){
      ov.style.width = canvas.style.width;
      ov.style.height = canvas.style.height;
      ov.width = canvas.width;
      ov.height = canvas.height;
      ov.style.left = viewOX + 'px';
      ov.style.top = viewOY + 'px';
    }
  }
}
let rhDismissed = false;
function updateRotateHint(){
  const rh = document.getElementById('rotateHint');
  if (!rh || !rh.style) return;
  const show = COARSE && !rhDismissed && window.innerHeight > window.innerWidth && window.innerWidth < 520;
  rh.style.display = show ? 'flex' : 'none';
}
window.addEventListener('resize', resize);

const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function angLerp(a, b, t){
  let d = b - a;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;

}

function synergyHint(t){
  const n = classCounts()[t.cls];
  const tiers = SYNERGY[t.cls].tiers;
  let mergeStar = 0;
  for (const st of [1, 2]){
    if (G.units.filter(u => u.id === t.id && u.star === st).length >= 2){ mergeStar = st; break; }
  }
  const after = mergeStar > 0 ? n - 1 : n + 1;
  const lv = c => c >= tiers[1] ? 2 : c >= tiers[0] ? 1 : 0;
  return { n: n, after: after, lv0: lv(n), lv1: lv(after), merge: mergeStar > 0, tiers: tiers };
}
function unitDmg(u){
  let d = u.dmg * Math.pow(2, u.star - 1);
  if (u.cls === 'sword'){ const l = synergyLevel('sword'); d *= l === 2 ? 1.5 : l === 1 ? 1.2 : 1; }
  if (u.aoe > 0){ const l = synergyLevel('cannon'); d *= l === 2 ? 1.6 : l === 1 ? 1.25 : 1; }
  const cr = [0, 0.12, 0.3][synergyLevel('assassin')];
  if (cr > 0 && Math.random() < cr) d *= perkHas('assassin', 't2_mech') ? 2.5 : 2; // 치명타 (R22: 급소 찌르기)
  d *= 1 + 0.08 * up('discipline'); // 수호단 규율
  d *= perkDmgMul(u.cls); // R22: 클래스 각성
  return d;
}
function clericRegen(){ return [0, 0.6, 1.5][synergyLevel('cleric')]; }
function guardianReduce(){ return [0, 0.20, 0.40][synergyLevel('guardian')] + (perkHas('guardian', 't2_mech') ? 0.06 : 0); } // R22
function warlockSlow(){ return [0, 0.10, 0.22][synergyLevel('warlock')] + (perkHas('warlock', 't2_mech') ? 0.05 : 0); } // R22
function sailorLuck(){ return [0, 0.25, 0.5][synergyLevel('sailor')] + (perkHas('sailor', 't2_mech') ? 0.15 : 0); } // R22
function summonMul(){ const l = synergyLevel('summoner'); return { cd: l === 2 ? 0.5 : l === 1 ? 0.75 : 1, dmg: l === 2 ? 1.5 : 1 }; }
function unitCd(u){
  let c = u.cd;
  if (u.cls === 'archer'){ const l = synergyLevel('archer'); c /= l === 2 ? 1.6 : l === 1 ? 1.25 : 1; }
  c /= 1 + 0.06 * up('swift'); // 신속한 항해

  return c;
}
function unitAoe(u){

}

// ---------- 진형 오프셋 ----------
function formationOffsets(){
  const n = G.units.length;
  const offs = new Array(n);
  const order = G.units.map((u, i) => i).sort((a, b) => (G.units[a].melee === G.units[b].melee) ? a - b : (G.units[a].melee ? -1 : 1));
  if (G.formation === 'circle'){
    order.forEach((ui, k) => {
      const ring = Math.floor(k / 6), j = k % 6;
      const a = j / 6 * TAU + ring * 0.5;
      offs[ui] = { x: Math.cos(a) * (50 + 40 * ring), y: Math.sin(a) * (50 + 40 * ring) };
    });
  } else if (G.formation === 'line'){
    const meleeIdx = order.filter(ui => G.units[ui].melee);
    const rangedIdx = order.filter(ui => !G.units[ui].melee);
    meleeIdx.forEach((ui, k) => { offs[ui] = { x: (k - (meleeIdx.length - 1) / 2) * 38, y: -56 }; });
    rangedIdx.forEach((ui, k) => { offs[ui] = { x: (k - (rangedIdx.length - 1) / 2) * 36, y: -14 + Math.floor(k / 5) * 34 }; });
  } else if (G.formation === 'wedge'){
    order.forEach((ui, k) => {
      const row = Math.floor((Math.sqrt(8 * k + 1) - 1) / 2);
      const j = k - row * (row + 1) / 2;
      offs[ui] = { x: (j - row / 2) * 36, y: -row * 38 - 10 };
    });
  } else {
    order.forEach((ui, k) => {
      const cols = 3, r = Math.floor(k / cols), c = k % cols;
      offs[ui] = { x: (c - 1) * 62 + ((r % 2) ? 31 : 0), y: (r - 1) * 62 };
    });
  }
  return offs;
}

function rollEnemyKind(n){
  const pool = [['mob', 10]];
  if (n >= 2) pool.push(['fast', 2.5]);
  if (n >= 4) pool.push(['splitter', 2], ['tank', 1.2]);
  if (n >= 5) pool.push(['spitter', 3]);
  if (n >= 6) pool.push(['bomber', 2.5]);
  if (n >= 7) pool.push(['charger', 2.5]);
  if (n >= 8) pool.push(['shield', 2.5], ['cultist', 1]);
  let tw = 0; for (const p of pool) tw += p[1];
  let r = Math.random() * tw;
  for (const p of pool){ r -= p[1]; if (r <= 0) return p[0]; }
  return 'mob';
}
function startWave(){

    charger: 1 + Math.floor(n/5), bomber: 1 + Math.floor(n/4), shield: 1 + Math.floor(n/5),
    splitter: 1 + Math.floor(n/4), tank: 1 + Math.floor(n/4) };

    let kind = rollEnemyKind(n), g2 = 0;

    counts[kind] = (counts[kind] || 0) + 1;

      rand(-30, 30), rand(-90, -30), rand(1.2, 2.6), i % 2 ? '#ff9a5a' : '#ffd24a', rand(2, 4)));
}

// ---------- 이동/조종 ----------
function nearestEnemy(x, y, maxD){
  let t = null, best = maxD || 1e9;
  for (const e of G.enemies){
    const d = dist(x, y, e.x, e.y);
    if (d < best){ best = d; t = e; }
  }
  return t;
}
function nearestOrb(){
  let t = null, best = 1e9;
  for (const o of G.orbs){
    const d = dist(G.leader.x, G.leader.y, o.x, o.y);
    if (d < best){ best = d; t = o; }
  }
  return t;
}
function updateLeader(dt){
  const L = G.leader;
  let tx = 0, ty = 0; // 목표 속도
  if (G.control === 'manual'){
    const k = G.keys;
    let dx = (k['d'] || k['arrowright'] ? 1 : 0) - (k['a'] || k['arrowleft'] ? 1 : 0);
    let dy = (k['s'] || k['arrowdown'] ? 1 : 0) - (k['w'] || k['arrowup'] ? 1 : 0);
    if (dx || dy){
      const m = Math.hypot(dx, dy);
      tx = dx / m * 175; ty = dy / m * 175;
      G.lastManual = G.time;
    } else if (G.mouse.down){
      const d = dist(L.x, L.y, G.mouse.x, G.mouse.y);
      if (d > 8){
        tx = (G.mouse.x - L.x) / d * 175;
        ty = (G.mouse.y - L.y) / d * 175;
        G.lastManual = G.time;
      }
    }
    if (G.time - G.lastManual > 2.5){
      G.control = 'delegate';
      flashMsg('위임 모드로 복귀 (' + BEHAVIORS.find(b => b.id === G.behavior).name + ')');
    }
  }
  if (G.control === 'delegate' && G.phase === 'combat'){
    const e = nearestEnemy(L.x, L.y);
    if (G.behavior === 'attack'){
      if (e && dist(L.x, L.y, e.x, e.y) > 130){
        const a = Math.atan2(e.y - L.y, e.x - L.x);
        tx = Math.cos(a) * 130; ty = Math.sin(a) * 130;
      }
    } else if (G.behavior === 'defend'){
      const d = dist(L.x, L.y, W/2, 300);
      if (d > 24){ tx = (W/2 - L.x) / d * 120; ty = (300 - L.y) / d * 120; }
    } else if (G.behavior === 'kite'){
      if (e && dist(L.x, L.y, e.x, e.y) < 230){
        const a = Math.atan2(L.y - e.y, L.x - e.x);
        tx = Math.cos(a) * 150; ty = Math.sin(a) * 150;
      }
    } else if (G.behavior === 'gather'){
      const o = nearestOrb();
      if (o){
        const d = dist(L.x, L.y, o.x, o.y);
        if (d > 10){ tx = (o.x - L.x) / d * 160; ty = (o.y - L.y) / d * 160; }
      } else if (e && dist(L.x, L.y, e.x, e.y) < 200){
        const a = Math.atan2(L.y - e.y, L.x - e.x);
        tx = Math.cos(a) * 120; ty = Math.sin(a) * 120;
      }
    }
  }
  // 부드러운 가감속
  const acc = 7;
  L.vx = lerp(L.vx, tx, Math.min(1, acc * dt));
  L.vy = lerp(L.vy, ty, Math.min(1, acc * dt));
  L.x = clamp(L.x + L.vx * dt, 40, W - 40);
  L.y = clamp(L.y + L.vy * dt, 50, H - 60);
  const spd = Math.hypot(L.vx, L.vy);
  if (spd > 20) L.rot = angLerp(L.rot, Math.atan2(L.vy, L.vx), 0.12);
  // 잔상
  if (spd > 60){
    L.trail.push({ x: L.x, y: L.y, rot: L.rot, life: 0.35 });
    if (L.trail.length > 10) L.trail.shift();
  }
  for (let i = L.trail.length - 1; i >= 0; i--){
    L.trail[i].life -= dt;
    if (L.trail[i].life <= 0) L.trail.splice(i, 1);
  }
}

function updateUnits(dt){
  const offs = formationOffsets();
  // 진형 방향: 가장 가까운 적, 없으면 리더 이동 방향
  const e0 = nearestEnemy(G.leader.x, G.leader.y);
  if (e0) G.facing = angLerp(G.facing, Math.atan2(e0.y - G.leader.y, e0.x - G.leader.x), 0.05);
  else if (Math.hypot(G.leader.vx, G.leader.vy) > 30) G.facing = angLerp(G.facing, G.leader.rot, 0.05);
  const cf = Math.cos(G.facing + Math.PI/2), sf = Math.sin(G.facing + Math.PI/2);
  for (let i = 0; i < G.units.length; i++){
    const u = G.units[i];
    if (hasRelic('mist') && !u.mote && u.hp < u.maxhp) u.hp = Math.min(u.maxhp, u.hp + u.maxhp * 0.02 * dt);
    if (u.flash > 0) u.flash -= dt;
    if (u.hp !== undefined && u.hp <= 0){
      burst(u.x, u.y, CLASSES[u.cls].color, 20, 2.5);
      G.deathRings.push({ x: u.x, y: u.y, r: 8, r1: 60, life: 0.4, maxlife: 0.4, color: CLASSES[u.cls].color });
      addDmgNum(u.x, u.y - 26, u.name + ' 격파', '#ff9a9a', 1.0);
      G.trauma = Math.min(G.trauma + 0.15, 0.6);
      G.waveUnitLoss++;
      G.units.splice(i, 1);
      i--;
      continue;
    }
    if (u.mote){
      u.life -= dt;
      if (u.life <= 0){ burst(u.x, u.y, '#06d6a0', 6, 1.5); G.units.splice(i, 1); i--; continue; }
    }
    let ax = G.leader.x + offs[i].x * cf - offs[i].y * sf;
    let ay = G.leader.y + offs[i].x * sf + offs[i].y * cf;
    // 돌격/근접 접근
    const leash = u.act === 'charge' ? 420 : u.melee && u.act !== 'hold' ? 170 : 0;
    if (leash > 0 && G.phase === 'combat'){
      const e = nearestEnemy(ax, ay, leash);
      if (e){ ax = e.x; ay = e.y; }
    }
    const k = 9, damp = Math.pow(0.0025, dt);
    u.vx = (u.vx + (ax - u.x) * k * dt) * damp;
    u.vy = (u.vy + (ay - u.y) * k * dt) * damp;
    if (u.slowT > 0) u.slowT -= dt;
    const _sf = u.slowT > 0 ? 0.4 : 1;
    u.x += u.vx * dt * _sf; u.y += u.vy * dt * _sf;
    const uspd = Math.hypot(u.vx, u.vy);
    if (uspd > 24) u.rot = angLerp(u.rot, Math.atan2(u.vy, u.vx), 0.15);
    else u.rot += Math.sin(G.time * 2.5 + i * 1.7) * 0.003; // 대기 시 미세한 흔들림
    // 잔상
    if (uspd > 90){
      u.trail.push({ x: u.x, y: u.y, rot: u.rot, life: 0.28 });
      if (u.trail.length > 7) u.trail.shift();
    }
    for (let j = u.trail.length - 1; j >= 0; j--){
      u.trail[j].life -= dt;
      if (u.trail[j].life <= 0) u.trail.splice(j, 1);
    }
    // 스쿼시 스프링 복원
    u.sxV += (1 - u.sx) * 180 * dt;
    u.sxV *= Math.pow(0.0001, dt);
    u.sx += u.sxV * dt;
  }
}

// ---------- 적 AI (패턴별) ----------
function updateEnemyAI(e, dt){
  const L = G.leader;
  e.tgtT -= dt;
  if (!e.tgt || e.tgtT <= 0 || (e.tgt !== L && (e.tgt.hp === undefined || e.tgt.hp <= 0))){
    e.tgt = pickTarget(e);
    e.tgtT = 2;
  }
  const tp = e.tgt === L ? { x: L.x, y: L.y, core: true } : { x: e.tgt.x, y: e.tgt.y, core: false };
  const d = dist(e.x, e.y, tp.x, tp.y);
  const touchR = (tp.core ? 26 : 10) + e.r + 4;
  let spMul = 1 - warlockSlow();
  for (const f of G.slowFields){ if (dist(e.x, e.y, f.x, f.y) < f.r + e.r){ spMul *= 0.45; break; } }
  const moveToward = (spd, face) => {
    const a = Math.atan2(tp.y - e.y, tp.x - e.x);
    if (face) e.rot = angLerp(e.rot, a, 0.25);
    e.x += Math.cos(a) * spd * spMul * dt;
    e.y += Math.sin(a) * spd * spMul * dt;
  };
  const contactAttack = () => {
    e.atkT -= dt;
    if (e.atkT <= 0){
      e.atkT = 1.0;
      e.sx = 1.3; e.sxV = -2;
      if (tp.core) coreDamage(e.dmg);
      else hurtUnit(e.tgt, e.dmg, e.x, e.y);
    }
  };
  if (e.kind === 'spitter'){
    // 원거리: 사거리 밖에서 접근, 전조(조준선) 후 탄 발사
    if (d > 215) moveToward(e.spd, true);
    else {
      e.rot = angLerp(e.rot, Math.atan2(tp.y - e.y, tp.x - e.x), 0.25);
      e.atkT -= dt;
      if (e.atkT <= 0){
        e.atkT = 2.9;
        const a = Math.atan2(tp.y - e.y, tp.x - e.x);
        if (G.eproj.length < 150)
          G.eproj.push({ x: e.x, y: e.y, vx: Math.cos(a) * 155, vy: Math.sin(a) * 155, dmg: e.dmg, life: 3.2, color: '#7af0d0' });
        e.sx = 1.3; e.sxV = -2;
        burst(e.x, e.y, '#7af0d0', 4, 1.4);
      }
    }
  } else if (e.kind === 'charger'){
    // 돌진: 추적 조준(전조선) 후 직선 돌진
    if (e.mode === 'dash'){
      e.dashT -= dt;
      e.x += Math.cos(e.dashA) * 345 * dt;
      e.y += Math.sin(e.dashA) * 345 * dt;
      for (const u of G.units){
        if (!e.dashHit.has(u) && dist(e.x, e.y, u.x, u.y) < e.r + 12){
          e.dashHit.add(u);
          hurtUnit(u, e.dmg, e.x - Math.cos(e.dashA) * 10, e.y - Math.sin(e.dashA) * 10);
          u.vx += Math.cos(e.dashA) * 160; u.vy += Math.sin(e.dashA) * 160;
        }
      }
      if (!e.dashHit.has(L) && dist(e.x, e.y, L.x, L.y) < e.r + 26){
        e.dashHit.add(L);
        coreDamage(e.dmg);
        if (G.phase !== 'combat') return;
      }
      if (e.dashT <= 0 || e.x < -40 || e.x > W + 40 || e.y < -40 || e.y > H + 40){ e.mode = 'stalk'; e.chT = 4.2; }
    } else if (e.mode === 'aim'){
      e.aimT -= dt;
      e.aimX = tp.x; e.aimY = tp.y; // 추적 조준
      e.rot = angLerp(e.rot, Math.atan2(e.aimY - e.y, e.aimX - e.x), 0.35);
      if (e.aimT <= 0){
        e.mode = 'dash'; e.dashT = 0.75;
        e.dashA = Math.atan2(e.aimY - e.y, e.aimX - e.x);
        e.rot = e.dashA;
        e.dashHit = new Set();
        e.sx = 1.4; e.sxV = -3;
      }
    } else {
      if (d > touchR) moveToward(e.spd, true);
      else contactAttack();
      if (e.chT > 0) e.chT -= dt;
      if (e.chT <= 0 && d < 330 && d > 80){ e.mode = 'aim'; e.aimT = 0.8; }
    }
  } else if (e.kind === 'bomber'){
    // 자폭: 접촉 시 0.6초 퓨즈(범위 표시) 후 폭발
    if (e.fuse > 0){
      e.fuse -= dt;
      if (e.fuse <= 0) explodeBomber(e);
    } else if (d > touchR - 8) moveToward(e.spd, true);
    else { e.fuse = 0.6; e.sx = 1.2; }
  } else if (e.kind === 'cultist'){
    // 소환: 거리 유지하며 주기적으로 잡졸 소환
    if (d > 260) moveToward(e.spd, false);
    else if (d < 170){
      const a = Math.atan2(e.y - tp.y, e.x - tp.x);
      e.x += Math.cos(a) * e.spd * 0.6 * spMul * dt;
      e.y += Math.sin(a) * e.spd * 0.6 * spMul * dt;
    }
    e.sumT -= dt;
    if (e.sumT <= 0){
      e.sumT = 6.5;
      if (G.enemies.length < 95 && G.spawnTels.length < 12){
        for (let k = 0; k < 2; k++){
          const a = rand(0, TAU);
          G.spawnTels.push({ x: clamp(e.x + Math.cos(a) * rand(40, 90), 10, W - 10),
            y: clamp(e.y + Math.sin(a) * rand(40, 90), 46, 470), t: 0.7, kind: 'mob' });
        }
        ringFx(e.x, e.y, 50, '#b04ff0');
      }
    }
  } else {
    // mob/fast/tank/mini/shield: 접촉형
    if (d > touchR) moveToward(e.spd, e.kind === 'shield');
    else contactAttack();
  }
}
function explodeBomber(e){
  e.hp = 0;
  G.trauma = Math.min(G.trauma + 0.4, 1);
  G.abAmt = Math.max(G.abAmt, 0.5);
  G.hitstop = Math.max(G.hitstop, 0.04);
  ringFx(e.x, e.y, 80, '#ffb02e');
  burst(e.x, e.y, '#ffb02e', 30, 3);
  burst(e.x, e.y, '#ff5a3c', 16, 2);
  for (const u of G.units){ if (dist(e.x, e.y, u.x, u.y) < 80 + 10) hurtUnit(u, e.dmg, e.x, e.y); }
  if (dist(e.x, e.y, G.leader.x, G.leader.y) < 80 + 26) coreDamage(e.dmg);
}

  } else if (def.id === 'sailor'){

    else if (i === 1){ if (G.gold >= 8){ G.gold -= 8; const h = Math.min(20, G.coreMax - G.coreHp); G.coreHp += h; flashMsg('따뜻한 식사 - 코어 +' + Math.round(h)); } else { flashMsg('골드가 부족합니다'); return; } }
    else flashMsg('선원과 작별한다');
  } else if (def.id === 'oracle'){ // R30
    if (i === 0){ G.coreMax += 10; G.coreHp = Math.min(G.coreMax, G.coreHp + 10); flashMsg('별의 축복 - 코어 최대치 +10'); addDmgNum(W/2, 300, '+10 최대 코어', '#8ecbff', 1.3); }
    else if (i === 1){ if (G.gold >= 10){ G.gold -= 10; const h = G.coreMax - G.coreHp; G.coreHp = G.coreMax; flashMsg('별의 치유 - 코어 +' + Math.round(h)); addDmgNum(W/2, 300, '+' + Math.round(h) + ' 코어', '#8ecbff', 1.3); } else { flashMsg('골드가 부족합니다'); return; } }
    else flashMsg('점성사와 헤어진다');
  } else if (def.id === 'ghost'){ // R30
    if (i === 0){
      let got = 0, paid = 0;
      for (let k = 0; k < 2; k++){
        if (rosterSize() < unitCap()){ grantCostUnit(1); got++; }
        else { G.gold += 12; G.stats.earned += 12; paid += 12; }
      }
      flashMsg(got > 0 ? '유령 선원 ' + got + '기 합류' + (paid > 0 ? ' · 남은 몫 +' + paid + 'G' : '') : '편대가 가득 - 유령이 ' + paid + 'G를 남긴다');
    }
    else if (i === 1){
      if (!G.units.length){ flashMsg('바칠 유닛이 없다'); return; }
      const weak = G.units.slice().sort((x, y) => (x.cost - y.cost) || (x.star - y.star))[0];
      G.units.splice(G.units.indexOf(weak), 1);
      G.gold += 25; G.stats.earned += 25;
      flashMsg(weak.name + josaEul(weak.name) + ' 바쳤다 - +25G');
      burst(weak.x, weak.y, '#a8ffe0', 16, 2);
    }
    else flashMsg('유령 함대가 물러난다');
  }
  G.event = null;
}

              t2: [{ id:'t2_mech', name:'심연 육신', desc:'소환수 피해 +25%, 체력 +6' }, { id:'t2_dmg', name:'강화 결속', desc:'피해 +22%' }] },

              t2: [{ id:'t2_mech', name:'철벽 서약', desc:'코어 피해감소 +6%' }, { id:'t2_dmg', name:'수호의 맹세', desc:'피해 +22%' }] },
  warlock:  { t1: [{ id:'t1_dmg', name:'저주 집중', desc:'피해 +18%' }, { id:'t1_spd', name:'신속 주술', desc:'공격속도 +15%' }],
              t2: [{ id:'t2_mech', name:'깊은 저주', desc:'둔화 +5%' }, { id:'t2_dmg', name:'파멸의 주술', desc:'피해 +22%' }] },
  sailor:   { t1: [{ id:'t1_dmg', name:'선원의 힘', desc:'피해 +18%' }, { id:'t1_spd', name:'빠른 손놀림', desc:'공격속도 +15%' }],
              t2: [{ id:'t2_mech', name:'풍운의 돛', desc:'골드 행운 +15%' }, { id:'t2_dmg', name:'해적의 검', desc:'피해 +22%' }] },
};
function perkHas(cls, id){ return (G.classPerks[cls] || []).indexOf(id) >= 0; }
function perkDmgMul(cls){ let m = 1; if (perkHas(cls, 't1_dmg')) m *= 1.18; if (perkHas(cls, 't2_dmg')) m *= 1.22; return m; }
function perkSpdMul(cls){ let m = 1; if (perkHas(cls, 't1_spd')) m *= 1.15; if (perkHas(cls, 't2_spd')) m *= 1.2; return m; }
function perkRngMul(cls){ return perkHas(cls, 't2_mech') && (cls === 'sword' || cls === 'archer') ? 1.25 : 1; }
function perkAoeMul(cls){ return perkHas(cls, 't2_mech') && (cls === 'mage' || cls === 'cannon') ? 1.3 : 1; }
function queuedAwaken(cls, tier){ return G.classChoiceQueue.some(q => q.cls === cls && q.tier === tier); }
function checkClassAwakening(){
  for (const k in CLASSES){
    const lv = synergyLevel(k);
    const perks = G.classPerks[k] || [];
    const t1done = perks.indexOf('t1_dmg') >= 0 || perks.indexOf('t1_spd') >= 0;
    const t2done = perks.indexOf('t2_mech') >= 0 || perks.indexOf('t2_dmg') >= 0;
    if (lv >= 1 && !t1done && !queuedAwaken(k, 1) && !(G.classChoice && G.classChoice.cls === k && G.classChoice.tier === 1)) G.classChoiceQueue.push({ cls: k, tier: 1 });
    else if (lv >= 2 && t1done && !t2done && !queuedAwaken(k, 2) && !(G.classChoice && G.classChoice.cls === k && G.classChoice.tier === 2)) G.classChoiceQueue.push({ cls: k, tier: 2 });
  }
  if (!G.classChoice && G.classChoiceQueue.length) G.classChoice = G.classChoiceQueue[0];
}
function pickClassPerk(i){
  const c = G.classChoice;
  if (!c) return;
  const opt = CLASS_PERKS[c.cls]['t' + c.tier][i];
  if (!opt) return;
  (G.classPerks[c.cls] = G.classPerks[c.cls] || []).push(opt.id);
  flashMsg(CLASSES[c.cls].name + ' 각성 - ' + opt.name + '!');
  sfx('syn');
  for (const u of G.units){
    if (u.cls === c.cls && !u.mote){ ringFx(u.x, u.y, 26, CLASSES[c.cls].light); u.flash = Math.max(u.flash || 0, 0.3); }
  }
  G.classChoiceQueue.shift();
  G.classChoice = G.classChoiceQueue.length ? G.classChoiceQueue[0] : null;
  saveRun();
}


// ---------- R23: 구역별 적 행동 패턴 (판마다 구역 2~5에 무작위 배정) ----------
const ZONE_PATTERNS = {
  lunge:  { name: '돌진 무리', warn: '적들이 주기적으로 등불을 향해 돌진한다', color: '#ffb36a' },
  split:  { name: '분열 군집', warn: '쓰러뜨린 적이 파편으로 갈라진다', color: '#e07ad0' },
  volley: { name: '쇄도 포대', warn: '적들이 원거리 탄을 쏟아낸다', color: '#8fe2ff' },
  regen:  { name: '재생 군락', warn: '적들이 서서히 상처를 회복한다', color: '#7aff8a' },
};
function shuffledZonePatterns(){
  const a = ['lunge', 'split', 'volley', 'regen'];
  for (let i = a.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function zonePattern(){
  const z = depthOf(G.wave);
  if (z < 2 || !G.zonePatterns || !G.zonePatterns.length) return null;
  return G.zonePatterns[(z - 2) % G.zonePatterns.length];
}

// ---------- 전투 ----------
function updateCombat(dt){
  if (G.bossSpawnT > 0){
    G.bossSpawnT -= dt;
    if (G.bossSpawnT <= 0){ G.bossSpawnT = -1; spawnBoss(); }
  }
  if (G.bossWarnT > 0) G.bossWarnT -= dt;
  if (G.champSpawnT > 0){ // R21: 정예 등장 타이머
    G.champSpawnT -= dt;
    if (G.champSpawnT <= 0) spawnChampion();
  }
  if (G.spawnQueue.length > 0){
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0){
      spawnEnemy(G.spawnQueue.shift());
      G.spawnTimer = clamp(1.1 - G.wave * 0.04, 0.35, 1.1);
    }
  } else if (G.enemies.length === 0 && G.waveActive && G.champSpawnT <= 0){ // R21: 정예 대기 중엔 종료 보류
    endWave();
    return;
  }
  G.zonePatCur = zonePattern(); // R23
  const L = G.leader;

  // 성직자 시너지: 등불 재생
  const regen = clericRegen();
  if (regen > 0 && G.coreHp < G.coreMax) G.coreHp = Math.min(G.coreMax, G.coreHp + regen * dt);

  // 위임 모드: 액티브 스킬 자동 발동
  if (G.control === 'delegate') autoCast();

  // 유닛 공격
  for (const u of G.units){
    u.cool -= dt;
    if (u.cool > 0) continue;
    const tgt = nearestEnemy(u.x, u.y, u.rng * relicRngMul() * perkRngMul(u.cls)); // R22
    if (!tgt) continue;
    u.cool = unitCd(u);
    u.sx = 1.35; u.sxV = -2; // 발사 스쿼시
    if (u.melee){
      let hitAny = false, hitN = 0;
      for (const e of G.enemies){
        if (dist(u.x, u.y, e.x, e.y) <= u.rng * relicRngMul() * perkRngMul(u.cls) + e.r){ // R22
          hurtEnemy(e, unitDmg(u), u.x, u.y, u.cls);
          hitAny = true; hitN++;
        }
      }
      if (hitN && hasRelic('leech') && !u.mote) u.hp = Math.min(u.maxhp, u.hp + unitDmg(u) * leechPct() * Math.min(hitN, 3)); // R20: 흡혈
      if (hitAny){
        slashFx(u.x, u.y, Math.atan2(tgt.y - u.y, tgt.x - u.x), CLASSES[u.cls].color, u.cls);
        G.trauma = Math.min(G.trauma + 0.06, 0.5);
      }
    } else {
      const a = Math.atan2(tgt.y - u.y, tgt.x - u.x);
      u.rot = a;
      const spd = relicProjSpd(); // R20: 신속 조준 조합
      G.projectiles.push({
        x: u.x, y: u.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        tgt, dmg: unitDmg(u), aoe: unitAoe(u), cls: u.cls,
        color: CLASSES[u.cls].light,
        mage: (u.aoe || 0) > 0, life: 2.2, src: u, spd: spd,
      });
      if (G.particles.length < pCap()){ // R19: 총구 섬광
        const nMz = G.settings.quality ? 3 : 1;
        for (let i = 0; i < nMz; i++){
          const ma = a + rand(-0.5, 0.5), mv = rand(40, 90);
          G.particles.push(mkP(u.x, u.y, Math.cos(ma) * mv, Math.sin(ma) * mv, 0.14, CLASSES[u.cls].light, 2));
        }
      }
    }
    // 성직자: 공격 시 등불 회복
    if (u.heal){
      G.coreHp = Math.min(G.coreMax, G.coreHp + u.heal * u.star * (perkHas('cleric', 't2_mech') ? 1.4 : 1)); // R22
      burst(L.x + rand(-10, 10), L.y - rand(10, 24), '#f5f0e1', 4, 1.2);
    }
  }

  // 소환사: 소환수 생성
  for (const u of G.units){
    if (!u.summon || u.mote) continue;
    if (u.summonT == null) u.summonT = rand(2, u.summon.cd);
    u.summonT -= dt;
    if (u.summonT <= 0){
      const sm = summonMul();
      u.summonT = u.summon.cd * sm.cd;
      const mote = { ...MOTE, star: 1, dmg: Math.round(u.summon.dmg * sm.dmg * u.star * (hasRelic('grimoire') ? 1.25 : 1) * (perkHas('summoner', 't2_mech') ? 1.25 : 1)), cool: 0, // R22
        x: u.x + rand(-24, 24), y: u.y + rand(-24, 24), vx: 0, vy: 0, rot: rand(0, TAU),
        sx: 1, sxV: 0, act: 'charge', trail: [], life: u.summon.life * (hasRelic('grimoire') ? 1.5 : 1), flash: 0, hp: perkHas('summoner', 't2_mech') ? 20 : 14, maxhp: perkHas('summoner', 't2_mech') ? 20 : 14 }; // R20: 그림자 교본
      G.units.push(mote);
      burst(mote.x, mote.y, '#06d6a0', 12, 2);
    }
  }

  // 투사체
  for (let i = G.projectiles.length - 1; i >= 0; i--){
    const p = G.projectiles[i];
    p.life -= dt;
    if (p.tgt && p.tgt.hp > 0){
      const a = Math.atan2(p.tgt.y - p.y, p.tgt.x - p.x);
      p.vx = p.vx * 0.85 + Math.cos(a) * (p.spd || 430) * 0.15;
      p.vy = p.vy * 0.85 + Math.sin(a) * (p.spd || 430) * 0.15;
    }
    const px = p.x, py = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (Math.random() < 0.5 && G.particles.length < pCap()) G.particles.push(mkP(p.x, p.y, 0, 0, 0.18, p.color, 2));
    let hit = null;
    for (const e of G.enemies){
      const dx = p.x - px, dy = p.y - py;
      const len2 = dx*dx + dy*dy || 1e-9;
      let t = ((e.x - px) * dx + (e.y - py) * dy) / len2;
      t = clamp(t, 0, 1);
      if (dist(px + dx * t, py + dy * t, e.x, e.y) < e.r + 4){ hit = e; break; }
    }
    if (hit || p.life <= 0){
      if (hit){
        if (p.aoe > 0){
          burst(p.x, p.y, '#ff9a5a', 18, 2.2);
          ringFx(p.x, p.y, p.aoe, '#ff9a5a');
          for (const e of G.enemies){
            if (dist(p.x, p.y, e.x, e.y) <= p.aoe + e.r) hurtEnemy(e, p.dmg, p.x, p.y, p.cls);
          }
          if (hasRelic('leech') && p.src && p.src.hp > 0 && !p.src.mote) p.src.hp = Math.min(p.src.maxhp, p.src.hp + p.dmg * leechPct()); // R20: 흡혈 (발당 1회)
          G.trauma = Math.min(G.trauma + 0.12, 0.6);
        } else {
          hurtEnemy(hit, p.dmg, p.x, p.y, p.cls);
          if (hasRelic('leech') && p.src && p.src.hp > 0 && !p.src.mote){ // R20: 흡혈
            p.src.hp = Math.min(p.src.maxhp, p.src.hp + p.dmg * leechPct());
            if (G.particles.length < pCap()) G.particles.push(mkP(p.src.x, p.src.y - 8, 0, -30, 0.3, '#ff7a8a', 2));
          }
          if (hasRelic('chain')){ // R20: 연쇄 뇌전
            let cb = null, cbd = 95;
            for (const o of G.enemies){ if (o === hit || o.hp <= 0) continue; const dd = dist(p.x, p.y, o.x, o.y); if (dd < cbd){ cbd = dd; cb = o; } }
            if (cb){
              hurtEnemy(cb, p.dmg * chainPct(), p.x, p.y, p.cls);
              if (G.particles.length < pCap()) for (let k = 1; k <= 5; k++){ // 번개 연출
                const tt = k / 6;
                G.particles.push(mkP(p.x + (cb.x - p.x) * tt, p.y + (cb.y - p.y) * tt, 0, 0, 0.14, '#a8c8ff', 2.2));
              }
            }
          }
        }
      }
      G.projectiles.splice(i, 1);
    }
  }

  // 적
  for (let i = G.enemies.length - 1; i >= 0; i--){
    const e = G.enemies[i];
    if (e.flash > 0) e.flash -= dt;
    if (e.champ && e.champ.id === 'regen' && e.hp < e.maxhp) e.hp = Math.min(e.maxhp, e.hp + e.maxhp * 0.025 * dt); // R21
    // R23: 구역 패턴 행동
    const _zc = G.zonePatCur;
    if (_zc === 'lunge' && e.lungeT != null && !e.boss){
      e.lungeT -= dt;
      if (e.lungeT <= 0){
        e.lungeT = rand(2.5, 4.2);
        const _la = Math.atan2(L.y - e.y, L.x - e.x);
        e.kbx += Math.cos(_la) * 95; e.kby += Math.sin(_la) * 95;
        if (G.particles.length < pCap()) for (let k = 0; k < 3; k++) G.particles.push(mkP(e.x, e.y, -Math.cos(_la) * rand(30, 70), -Math.sin(_la) * rand(30, 70), 0.25, '#ffb36a', 2));
      }
    } else if (_zc === 'volley' && e.volley && !e.boss){
      e.volleyT -= dt;
      if (e.volleyT <= 0){
        e.volleyT = rand(3.2, 4.8);
        const _va = Math.atan2(L.y - e.y, L.x - e.x);
        G.eproj.push({ x: e.x, y: e.y, vx: Math.cos(_va) * 130, vy: Math.sin(_va) * 130, dmg: 4, life: 3.4, color: '#8fe2ff' });
        burst(e.x, e.y, '#8fe2ff', 4, 1.4);
      }
    } else if (_zc === 'regen' && !e.boss && e.kind !== 'mini' && e.hp < e.maxhp){
      e.hp = Math.min(e.maxhp, e.hp + e.maxhp * 0.012 * dt);
    }
    e.rot += e.spin * dt;
    e.x += e.kbx * dt * 8; e.y += e.kby * dt * 8;
    e.kbx *= Math.pow(0.001, dt); e.kby *= Math.pow(0.001, dt);
    e.sxV += (1 - e.sx) * 160 * dt;
    e.sxV *= Math.pow(0.0001, dt);
    e.sx += e.sxV * dt;
    if (e.boss){
      // 보스: 구역별 고유 패턴 (R18) + 느리게 접근, 쿨다운 강타(전조 후 발동)
      const def = e.bossDef || BOSS_TYPES[BOSS_TYPES.length - 1];
      if (e.shieldT > 0) e.shieldT -= dt;
      if (def.pattern === 'charge' && !e.enraged && e.hp < e.maxhp * 0.3){
        e.enraged = true; e.atkCd = 2.4; e.spd *= 1.3;
        flashMsg(def.name + josaGa(def.name) + ' 격노합니다!');
        ringFx(e.x, e.y, 130, def.ring);
      }
      if (def.pattern === 'lord' && !e.enraged && e.hp < e.maxhp * 0.5){
        e.enraged = true;
        for (let k = 0; k < 8; k++){ const a = k / 8 * TAU; G.eproj.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, dmg: 5, life: 3.0, color: def.ring }); }
        ringFx(e.x, e.y, 160, def.ring);
        flashMsg(def.name + '의 분노가 폭발합니다!');
      }
      if (e.chargeState === 'tel'){
        e.chargeT -= dt;
        if (e.chargeT <= 0){ e.chargeState = 'dash'; e.chargeT = 0.55; e.chargeHit = []; sfx('bosspat'); }
      }
      if (e.chargeState === 'dash'){
        e.chargeT -= dt;
        e.x += Math.cos(e.chargeA) * 340 * dt;
        e.y += Math.sin(e.chargeA) * 340 * dt;
        for (const u of G.units){
          if (u.hp > 0 && e.chargeHit.indexOf(u) < 0 && dist(e.x, e.y, u.x, u.y) < e.r + 12){
            e.chargeHit.push(u);
            hurtUnit(u, 5, e.x - Math.cos(e.chargeA) * 20, e.y - Math.sin(e.chargeA) * 20);
            u.vx += Math.cos(e.chargeA) * 200; u.vy += Math.sin(e.chargeA) * 200;
          }
        }
        if (e.chargeT <= 0){ e.chargeState = null; ringFx(e.x, e.y, 90, def.ring); G.trauma = Math.min(G.trauma + 0.3, 1); }
        if (e.hp <= 0) killEnemy(i);
        continue;
      }
      e.patT -= dt;
      if (e.patT <= 0 && !e.chargeState){ e.patT = def.patCd; fireBossPattern(e, def); }
      const d = dist(e.x, e.y, L.x, L.y);
      const spMul = 1 - warlockSlow();
      if (d > 70 + e.r){
        const a = Math.atan2(L.y - e.y, L.x - e.x);
        e.x += Math.cos(a) * e.spd * spMul * dt;
        e.y += Math.sin(a) * e.spd * spMul * dt;
      } else {
        e.atkT -= dt;
        if (e.atkT <= 0){
          e.atkT = e.atkCd;
          e.sx = 1.5; e.sxV = -3;
          coreDamage(e.dmg);
          G.coreFlash = 0.3;
          G.trauma = 1;
          G.abAmt = 1;
          G.hitstop = Math.max(G.hitstop, 0.06);
          ringFx(L.x, L.y, 110, '#ff4a6a');
          for (const u of G.units){ // 수호단 밀려남 + 피해
            const a2 = Math.atan2(u.y - L.y, u.x - L.x);
            u.vx += Math.cos(a2) * 190; u.vy += Math.sin(a2) * 190;
            hurtUnit(u, 3, L.x, L.y);
          }
          if (G.phase !== 'combat') return;
        }
      }
    } else {
      updateEnemyAI(e, dt);
      if (G.phase !== 'combat') return;
    }
    if (e.hp <= 0) killEnemy(i);
  }

  // 소환 전조
  for (let i = G.spawnTels.length - 1; i >= 0; i--){
    const t = G.spawnTels[i];
    t.t -= dt;
    if (t.t <= 0){
      G.spawnTels.splice(i, 1);
      spawnEnemyAt(t.kind, t.x, t.y);
    }
  }

  // 적 투사체
  for (let i = G.eproj.length - 1; i >= 0; i--){
    const p = G.eproj[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (Math.random() < 0.3 && G.particles.length < pCap()) G.particles.push(mkP(p.x, p.y, 0, 0, 0.15, p.color, 1.6));
    let hit = false;
    for (const u of G.units){
      if (u.hp > 0 && dist(p.x, p.y, u.x, u.y) < 11){ hurtUnit(u, p.dmg, p.x - p.vx * 0.05, p.y - p.vy * 0.05); hit = true; break; }
    }
    if (!hit && dist(p.x, p.y, L.x, L.y) < 26){
      coreDamage(p.dmg);
      hit = true;
    }
    if (hit || p.life <= 0) G.eproj.splice(i, 1);
    if (G.phase !== 'combat') return;
  }

  // 보스 충격파 링 (R18)
  for (let i = G.bossRings.length - 1; i >= 0; i--){
    const rg = G.bossRings[i];
    const prevR = rg.r;
    rg.r += rg.spd * dt;
    for (const u of G.units){
      if (u.hp > 0 && rg.hit.indexOf(u) < 0){
        const du = dist(rg.x, rg.y, u.x, u.y);
        if (du >= prevR - 6 && du <= rg.r + 13){ // 프레임 사이 통과분까지 판정
          rg.hit.push(u);
          hurtUnit(u, rg.dmg, rg.x, rg.y);
        }
      }
    }
    if (rg.r > rg.max) G.bossRings.splice(i, 1);
  }

  // 골드 오브
  for (let i = G.orbs.length - 1; i >= 0; i--){
    const o = G.orbs[i];
    o.life -= dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    o.vx *= Math.pow(0.01, dt); o.vy *= Math.pow(0.01, dt);
    const d = dist(o.x, o.y, L.x, L.y);
    if (d < (hasRelic('magnet') ? 145 : 90)){ // R20: 심연 자석
      const a = Math.atan2(L.y - o.y, L.x - o.x);
      o.vx += Math.cos(a) * 700 * dt;
      o.vy += Math.sin(a) * 700 * dt;
    }
    if (d < 24){
      let v = o.value;
      if (Math.random() < sailorLuck()){ v += 1; addDmgNum(o.x, o.y - 10, '+1', '#48cae4', 0.9); }
      v = Math.max(1, Math.round(v * relicOrbMul()));
      G.gold += v; G.waveGold += v;
      G.stats.earned += v;
      burst(o.x, o.y, '#ffd24a', 6, 1.5);
      G.orbs.splice(i, 1);
      continue;
    }
    if (o.life <= 0) G.orbs.splice(i, 1);
  }
}
function hurtEnemy(e, dmg, sx, sy, cls){
  sfx('hit');
  if (e.kind === 'shield' && sx !== undefined){
    // 정면 100도 부채괄 피해 70% 감소
    const hitA = Math.atan2(e.y - sy, e.x - sx);
    let dd = Math.abs(hitA - e.rot) % TAU;
    if (dd > Math.PI) dd = TAU - dd;
    if (dd < 0.75){
      dmg *= 0.45;
      addDmgNum(e.x, e.y - e.r - 14, '방어', '#9ab8d8', 0.8);
    }
  }
  if (e.boss && e.shieldT > 0){ // 침묵의 수호자 방벽 (R18)
    dmg *= 0.45;
    addDmgNum(e.x, e.y - e.r - 14, '방벽', '#c9a8ff', 0.8);
  }
  if (e.champ && e.champ.id === 'ward' && e.shieldHp > 0){ // R32: 장막 보호막 흡수 (잔량만 체력에)
    const absorbed = Math.min(e.shieldHp, dmg);
    e.shieldHp -= absorbed; dmg -= absorbed;
    addDmgNum(e.x, e.y - e.r - 14, '장막', '#8ab8ff', 0.8);
    if (e.shieldHp <= 0){ e.shieldHp = 0; ringFx(e.x, e.y, e.r + 16, '#8ab8ff'); sfx('shatter'); }
  }
  if (hasRelic('execute') && e.hp > 0 && e.hp < e.maxhp * 0.3) dmg *= 1.25; // R20: 처형의 낫
  G.dmgByCls[cls || 'skill'] = (G.dmgByCls[cls || 'skill'] || 0) + dmg;
  G.dmgAcc += dmg;
  e.hp -= dmg;
  e.flash = e.boss ? 0.13 : 0.16; // 피격 흰색 플래시 강화
  e.sx = e.boss ? 0.85 : 0.68; e.sxV = 2.5; // 피격 스쿼시
  const a = Math.atan2(e.y - sy, e.x - sx);
  const kb = e.boss ? 0.5 : 4; // 보스 넉백 저항
  e.kbx += Math.cos(a) * kb; e.kby += Math.sin(a) * kb;
  burst(e.x, e.y, (cls && CLASSES[cls]) ? CLASSES[cls].light : '#ffe9a8', e.boss ? 5 : 4, 1.8); // 충돌 스파크 (R19: 클래스 색)
  addDmgNum(e.x + rand(-6, 6), e.y - e.r - 4, Math.round(dmg), dmg >= 20 ? '#ffd24a' : '#ffffff', dmg >= 20 ? 1.3 : 0.9);
}
function killEnemy(i){

  const e = G.enemies[i];
  G.enemies.splice(i, 1);
  G.stats.kills++;
  G.waveKills++;
  const big = e.kind === 'tank' || e.boss || e.champ;
  burst(e.x, e.y, e.color, e.boss ? 70 : big ? 26 : 12, e.boss ? 4 : big ? 3 : 2);
  // 사망 확장 링 + 파편
  G.deathRings.push({ x: e.x, y: e.y, r: e.r * 0.8, r1: e.boss ? 260 : e.r * 5, life: e.boss ? 0.7 : 0.4, maxlife: e.boss ? 0.7 : 0.4, color: e.color });
  const nDeb = e.boss ? 16 : big ? 8 : G.settings.quality ? 5 : 2;
  for (let k = 0; k < nDeb; k++){
    const a = rand(0, TAU), v = rand(60, e.boss ? 320 : 200);
    G.debris.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40,
      rot: rand(0, TAU), vr: rand(-9, 9), life: rand(0.4, e.boss ? 1.1 : 0.7), maxlife: 1,
      size: rand(2.5, e.boss ? 8 : 5.5), color: e.color });
  }
  if (e.boss){
    G.meta.bossKills = (G.meta.bossKills || 0) + 1;
    G.boss = null;
    G.slowmo = Math.max(G.slowmo, 1.3); // 보스 처치 슬로모션
    G.abAmt = 1;
    G.trauma = 1;
    G.hitstop = Math.max(G.hitstop, 0.12);
    G.gold += 10; G.stats.earned += 10; G.waveGold += 10;
    addDmgNum(e.x, e.y - 50, '+10G 처치 보너스', '#ffd24a', 1.6);
    const _kd = e.bossDef || BOSS_TYPES[BOSS_TYPES.length - 1];
    flashMsg(_kd.name + josaEul(_kd.name) + ' 물리쳤습니다!');
  sfx('bossdie');
  offerRelicChoice();
  } else if (big){ G.trauma = Math.min(G.trauma + 0.3, 1); G.hitstop = Math.max(G.hitstop, 0.05); }
  if (e.champ){ // R21: 정예 처치 보너스
    const bonus = 10 + Math.floor(G.wave / 2);
    G.gold += bonus; G.stats.earned += bonus; G.waveGold += bonus;
    addDmgNum(e.x, e.y - e.r - 30, '정예 처치! +' + bonus + 'G', '#ffd24a', 1.8);
    burst(e.x, e.y, e.champ.color, 30, 3.2);
    ringFx(e.x, e.y, e.r * 2.2, e.champ.color);
    G.trauma = Math.min(G.trauma + 0.35, 1);
    G.hitstop = Math.max(G.hitstop, 0.07);
    sfx('bossdie');
  }
  if (e.champ && e.champ.id === 'split'){ // R32: 분열 정예 - 사망 시 파편 2개
    for (let k = 0; k < 2; k++){
      const a = rand(0, TAU);
      spawnEnemyAt('mini', e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14);
    }
  }
  if (e.willSplit){ spawnEnemyAt('mini', e.x + rand(-12, 12), e.y + rand(-12, 12)); } // R23: 분열 구역 패턴
  // 분열형: 사망 시 파편 3개
  if (e.kind === 'splitter'){
    for (let k = 0; k < 3; k++){
      const a = k / 3 * TAU + rand(-0.4, 0.4);
      spawnEnemyAt('mini', e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14);
    }
  }
  // 골드 오브 드롭
  for (let k = 0; k < e.gold; k++){
    const a = rand(0, TAU);
    G.orbs.push({ x: e.x, y: e.y, vx: Math.cos(a) * rand(30, 90), vy: Math.sin(a) * rand(30, 90), value: 1, life: 12 });
  }
}

// ---------- 이펙트 ----------
function mkP(x, y, vx, vy, life, color, size){
  return { x, y, vx, vy, life, maxlife: life, color, size };
}
function burst(x, y, color, n, spd){
  if (!G.settings.quality) n = Math.ceil(n * 0.4);
  for (let i = 0; i < n; i++){
    if (G.particles.length > pCap()) break;
    const a = rand(0, TAU), v = rand(20, 60) * spd;
    G.particles.push(mkP(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.25, 0.6), color, rand(1.5, 3.5)));
  }
}
function ringFx(x, y, r, color){
  if (G.particles.length > pCap()) return;
  for (let i = 0; i < 14; i++){
    const a = i / 14 * TAU;
    G.particles.push(mkP(x, y, Math.cos(a) * r * 2.2, Math.sin(a) * r * 2.2, 0.3, color, 2));
  }
}
function slashFx(x, y, ang, color, cls){ // R19: 클래스별 참격 연출
  if (G.particles.length > pCap()) return;
  const hiQ = G.settings.quality === 1;
  if (cls === 'assassin'){ // 암살자: X자 교차 참격
    for (const off of [0.5, -0.5]){
      const n = hiQ ? 5 : 3;
      for (let i = 0; i < n; i++){
        const d = 8 + i * 7;
        G.particles.push(mkP(x + Math.cos(ang + off) * d, y + Math.sin(ang + off) * d,
          Math.cos(ang + off) * 60, Math.sin(ang + off) * 60, rand(0.1, 0.2), color, rand(2, 3.5)));
      }
    }
    return;
  }
  if (cls === 'guardian'){ // 수호자: 방패 강타 - 좁은 부채 + 충격파
    const n = hiQ ? 8 : 4;
    for (let i = 0; i < n; i++){
      const a = ang + rand(-0.35, 0.35), v = rand(60, 130);
      G.particles.push(mkP(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.12, 0.22), color, rand(2.5, 4)));
    }
    if (hiQ) ringFx(x + Math.cos(ang) * 26, y + Math.sin(ang) * 26, 18, color);
    return;
  }
  // 검성 등: 초승달 참격
  const n = hiQ ? 8 : 4;
  for (let i = 0; i < n; i++){
    const a = ang + rand(-0.7, 0.7), v = rand(80, 160);
    G.particles.push(mkP(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.12, 0.25), color, rand(2, 4)));
  }
  if (hiQ) for (let i = -2; i <= 2; i++){ // 초승달 아크
    const a = ang + i * 0.28;
    G.particles.push(mkP(x + Math.cos(a) * 30, y + Math.sin(a) * 30, Math.cos(a) * 40, Math.sin(a) * 40, 0.16, '#ffffff', 2));
  }
}
function addDmgNum(x, y, val, color, scale){
  G.dmgNums.push({ x, y, val: String(val), color, scale, life: 0.8 });
}

// ---------- 메타 저장 (환생/잔광) ----------

function loadMeta(){

  } catch (e){}

  const legacyBest = parseInt(localStorage.getItem('abyss_lantern_best') || '0', 10);

    units: G.units.filter(u => !u.mote).map(u => ({ id: u.id, star: u.star, act: u.act })),
    formation: G.formation, behavior: G.behavior, stats: G.stats, savedAt: Date.now(),
    relics: G.relics, phoenixUsed: G.phoenixUsed,
    classPerks: G.classPerks, // R22
    zonePatterns: G.zonePatterns, // R23
  };
  localStorage.setItem('abyss_lantern_run', JSON.stringify(run));
}
function loadSavedRun(){
  try {
    const r = JSON.parse(localStorage.getItem('abyss_lantern_run') || 'null');
    return r && r.v === 5 && r.units ? r : null;
  } catch (e){ return null; }
}
function clearRun(){ localStorage.removeItem('abyss_lantern_run'); }
function restoreRun(r){
  newRun();

  G.relics = r.relics || []; G.phoenixUsed = !!r.phoenixUsed; G.relicChoice = null; G.relicChoiceRects = [];
  G.event = null; G.eventRects = []; G.champSpawnT = 0; // R21
  G.classPerks = r.classPerks || {}; G.classChoice = null; G.classChoiceQueue = []; G.classChoiceRects = []; // R22
  G.zonePatterns = r.zonePatterns || ['split', 'lunge', 'regen', 'volley']; G.zonePatCur = null; // R23
  if (G.relics.indexOf('aegis') >= 0) G.coreMax += 25;
  G.coreHp = Math.min(r.coreHp, G.coreMax);
  G.units = [];
  for (const su of r.units){
    const t = UNIT_TYPES.find(x => x.id === su.id);
    if (!t) continue;
    const u = { ...t, star: su.star, cool: 0,
      x: G.leader.x + rand(-30, 30), y: G.leader.y + rand(-30, 30),
      vx: 0, vy: 0, rot: rand(0, TAU), sx: 1, sxV: 0, act: su.act || 'form', trail: [], flash: 0 };
    u.maxhp = unitMaxHp(u); u.hp = u.maxhp;
    G.units.push(u);
  }
  G.formation = r.formation || 'circle';
  G.behavior = r.behavior || 'attack';
  G.stats = r.stats || { kills: 0, earned: 0 };

}
function buyUpgrade(i){
  const u = REBIRTH_UPGRADES[i];
  const t = up(u.id);
  if (t >= u.max){ flashMsg('최대 단계입니다'); return; }
  const c = u.costs[t];
  if (G.meta.glimmer < c){ flashMsg('잔광이 부족합니다'); return; }
  G.meta.glimmer -= c;
  G.meta.upgrades[u.id] = t + 1;
  saveMeta();
  G.trauma = Math.min(G.trauma + 0.2, 0.6);
  flashMsg(u.name + ' ' + (t + 1) + '단계 - ' + u.desc);

function castSkill(i, tx, ty){
  const s = G.skills[i];
  if (!s || s.t > 0 || G.phase !== 'combat') return false;
  tx = clamp(tx, 10, W - 10); ty = clamp(ty, 46, SHOP_Y - 40);
  s.t = s.cd;
  sfx('skill' + i);
  const L = G.leader;
  if (s.id === 'nova'){
    const R = s.radius, dmg = 45 + G.wave * 6;
    burst(tx, ty, '#ff9a5a', 42, 3.6);
    burst(tx, ty, '#ffd24a', 18, 2.2);
    ringFx(tx, ty, R, '#ff9a5a');
    ringFx(tx, ty, R * 0.55, '#ffe9a8');
    for (const e of G.enemies){
      if (dist(tx, ty, e.x, e.y) <= R + e.r){
        hurtEnemy(e, dmg, tx, ty, 'skill');
        e.kbx *= 3; e.kby *= 3; // 폭발 넉백 강화
      }
    }
    G.skillFx.push({ kind: 'ring', x: tx, y: ty, r: R, color: '#ff9a5a', life: 0.35, maxlife: 0.35 });
    G.skillFx.push({ kind: 'flash', x: tx, y: ty, r: R * 0.55, color: '#fff6da', life: 0.22, maxlife: 0.22 }); // R19
    if (G.settings.quality && G.particles.length < pCap()) for (let i = 0; i < 10; i++){ // R19: 잔여 불씨
      const ea = rand(0, TAU), ed = rand(10, R * 0.7);
      G.particles.push(mkP(tx + Math.cos(ea) * ed, ty + Math.sin(ea) * ed, Math.cos(ea) * 14, -rand(20, 60), rand(0.5, 0.9), i % 2 ? '#ffb44a' : '#ffd24a', rand(2, 3)));
    }
    G.trauma = Math.min(G.trauma + 0.55, 1);
    G.hitstop = Math.max(G.hitstop, 0.09);
  } else if (s.id === 'beam'){
    const dmg = 70 + G.wave * 8, LEN = 760, HALF_W = 24;
    const a = Math.atan2(ty - L.y, tx - L.x);
    const x2 = L.x + Math.cos(a) * LEN, y2 = L.y + Math.sin(a) * LEN;
    for (const e of G.enemies){
      const dx = x2 - L.x, dy = y2 - L.y, len2 = dx * dx + dy * dy;
      let tt = ((e.x - L.x) * dx + (e.y - L.y) * dy) / len2;
      tt = clamp(tt, 0, 1);
      if (dist(L.x + dx * tt, L.y + dy * tt, e.x, e.y) < e.r + HALF_W) hurtEnemy(e, dmg, L.x, L.y, 'skill');
    }
    for (let k = 0; k < 26; k++){
      const d = rand(40, LEN * 0.9);
      G.particles.push(mkP(L.x + Math.cos(a) * d + rand(-10, 10), L.y + Math.sin(a) * d + rand(-10, 10),
        Math.cos(a + Math.PI/2) * rand(-70, 70), Math.sin(a + Math.PI/2) * rand(-70, 70), rand(0.2, 0.45), '#ffe9a8', rand(2, 4)));
    }
    G.skillFx.push({ kind: 'beam', x1: L.x, y1: L.y, x2, y2, life: 0.3, maxlife: 0.3 });
    G.skillFx.push({ kind: 'flash', x: L.x, y: L.y, r: 34, color: '#fff6da', life: 0.2, maxlife: 0.2 }); // R19: 발사 섬광
    G.skillFx.push({ kind: 'flash', x: tx, y: ty, r: 46, color: '#ffe9a8', life: 0.25, maxlife: 0.25 }); // R19: 조준점 섬광
    G.trauma = Math.min(G.trauma + 0.6, 1);
    G.hitstop = Math.max(G.hitstop, 0.1);
  } else if (s.id === 'slow'){
    const R = s.radius;
    G.slowFields.push({ x: tx, y: ty, r: R, life: 5, maxlife: 5 });
    ringFx(tx, ty, R, '#8fe2ff');

  }

  return true;
}
function bestCluster(){
  let best = null, bestN = 0;
  for (const e of G.enemies){
    if (e.hp <= 0) continue;
    let n = 0, cx = 0, cy = 0;
    for (const o of G.enemies){
      if (o.hp > 0 && dist(e.x, e.y, o.x, o.y) < 120){ n++; cx += o.x; cy += o.y; }
    }
    if (n > bestN){ bestN = n; best = { x: cx / n, y: cy / n }; }
  }
  return best ? { x: best.x, y: best.y, n: bestN } : null;
}
function autoCast(){
  if (G.enemies.length < 2) return;
  const c = bestCluster();
  if (!c) return;
  if (G.skills[0].t <= 0 && c.n >= 2) castSkill(0, c.x, c.y);
  else if (G.skills[1].t <= 0 && c.n >= 3) castSkill(1, c.x, c.y);
  else if (G.skills[2].t <= 0 && c.n >= 4) castSkill(2, c.x, c.y);
}

}

const AUDIO = {

function initAudio(){
  if (AUDIO.unlocked){ if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume(); return; }
  const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
  if (!AC) return;
  AUDIO.ctx = new AC();
  AUDIO.master = AUDIO.ctx.createGain();
  AUDIO.master.connect(AUDIO.ctx.destination);
  AUDIO.sfxBus = AUDIO.ctx.createGain(); AUDIO.sfxBus.connect(AUDIO.master);
  AUDIO.bgmBus = AUDIO.ctx.createGain(); AUDIO.bgmBus.connect(AUDIO.master);
  AUDIO.unlocked = true;

function applySoundSettings(fade){
  if (!AUDIO.unlocked) return;
  const t = AUDIO.ctx.currentTime;
  const sv = G.settings.sfx ? (G.settings.sfxVol == null ? 0.6 : G.settings.sfxVol) : 0;
  const bv = G.settings.bgm ? (G.settings.bgmVol == null ? 0.35 : G.settings.bgmVol) : 0;
  AUDIO.sfxBus.gain.cancelScheduledValues(t);
  AUDIO.bgmBus.gain.cancelScheduledValues(t);
  if (fade){ AUDIO.sfxBus.gain.setTargetAtTime(sv, t, 0.05); AUDIO.bgmBus.gain.setTargetAtTime(bv * 0.9, t, 0.8); }
  else { AUDIO.sfxBus.gain.value = sv; AUDIO.bgmBus.gain.value = bv * 0.9; }
}
function tone(freq, dur, type, vol, t0, slideTo){
  const c = AUDIO.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AUDIO.sfxBus);
  o.start(t0); o.stop(t0 + dur + 0.02);

  o.onended = () => { AUDIO.voices--; };
}
function noiseHit(dur, vol, t0, filterFreq){
  const c = AUDIO.ctx;
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AUDIO.sfxBus);
  src.start(t0);
  AUDIO.voices++;
  src.onended = () => { AUDIO.voices--; };

const BGM_THEMES = [
  { root: 130.8, scale: [0, 2, 4, 7, 9],  bpm: 72, type: 'sine' },     // 물결의 틈
  { root: 110.0, scale: [0, 3, 5, 7, 10], bpm: 76, type: 'sine' },     // 가라앉은 숲
  { root: 146.8, scale: [0, 2, 3, 7, 8],  bpm: 68, type: 'triangle' }, // 침묵의 폐허

function bgmZoneIdx(){
  const w = zoneWeights();
  let bi = 0, bw = -1;
  for (let i = 0; i < w.length; i++) if (w[i] > bw){ bw = w[i]; bi = i; }
  return bi;
}
function bgmNote(freq, dur, type, vol, t0){
  const c = AUDIO.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + dur * 0.3);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(AUDIO.bgmBus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function bgmTick(){
  if (!AUDIO.unlocked) return;
  const c = AUDIO.ctx;
  const zi = bgmZoneIdx();
  const th = BGM_THEMES[zi];
  if (AUDIO.curZone !== zi){ AUDIO.curZone = zi; AUDIO.bgmStep = 0; }
  const spb = 60 / th.bpm / 2;
  while (AUDIO.nextNoteT < c.currentTime + 0.6){
    const t0 = Math.max(AUDIO.nextNoteT, c.currentTime + 0.05);
    const st = AUDIO.bgmStep % 16;
    if (st === 0){
      bgmNote(th.root, spb * 14, th.type, 0.10, t0);
      bgmNote(th.root * 1.5, spb * 14, 'sine', 0.05, t0);
    }
    if (st % 4 === 2 && Math.random() < 0.7){
      const n = th.scale[Math.floor(Math.random() * th.scale.length)];
      bgmNote(th.root * 2 * Math.pow(2, n / 12), spb * 3, th.type, 0.05, t0);
    }
    if (st === 8 && Math.random() < 0.35){
      const n = th.scale[Math.floor(Math.random() * th.scale.length)];
      bgmNote(th.root * 4 * Math.pow(2, n / 12), spb * 6, 'sine', 0.03, t0);
    }
    AUDIO.bgmStep++;
    AUDIO.nextNoteT = t0 + spb;
  }
}
function startBgm(){
  if (AUDIO.bgmTimer || !AUDIO.unlocked) return;
  AUDIO.nextNoteT = AUDIO.ctx.currentTime + 0.3;
  AUDIO.bgmTimer = setInterval(bgmTick, 200);
}

      }
    }
    if (G.event){ // R21: 사건 선택
      for (const er of (G.eventRects || [])){
        if (inRect(p, er)){ pickEvent(er.i); return; }
      }
    }
    if (G.classChoice && !G.event && !G.relicChoice){ // R22: 각성 선택
      for (const cr of (G.classChoiceRects || [])){
        if (inRect(p, cr)){ pickClassPerk(cr.i); return; }
      }
    }
    for (const rr of (G.relicRects || [])){
      if (inRect(p, rr)){ const rel = RELICS.find(x => x.id === rr.id); if (rel) flashMsg(relicTip(rel)); return; } // R20
    }
    if (inRect(p, REROLL_BTN)){
      const rc = rerollCost();
      if (G.gold >= rc){ G.gold -= rc; rollShop(); sfx('reroll'); } else flashMsg('골드가 부족합니다');
      return;
    }
    if (inRect(p, START_BTN)){ startWave(); return; }
    if (inRect(p, AUTO_BTN)){
      G.autoNext = !G.autoNext;
      localStorage.setItem('abyss_lantern_autonext', G.autoNext ? '1' : '0');
      G.autoTimer = (G.autoNext && G.phase === 'shop') ? 10 : 0;
      flashMsg(G.autoNext ? '자동 진행 켜짐 - 파도가 자동으로 시작됩니다' : '자동 진행 꺼짐 - 버튼/스페이스로 시작');
      return;
    }
    if (inRect(p, ROSTER_OPEN_BTN)){ setRoster(true); return; }
    for (const f of FORM_BTNS){
      if (inRect(p, f)){ G.formation = f.id; flashMsg('진형: ' + f.name); return; }
    }
    for (let i = 0; i < 5; i++){
      if (inRect(p, cardRect(i))){ buyCard(i); return; }
    }
    // 유닛 명단: 클릭으로 개별 행동 순환
    for (const r of rosterRects()){
      if (inRect(p, r)){
        const u = G.units[r.i];
        const idx = UNIT_ACTS.findIndex(a => a.id === u.act);
        u.act = UNIT_ACTS[(idx + 1) % UNIT_ACTS.length].id;
        flashMsg(u.name + ' 행동: ' + UNIT_ACTS[(idx + 1) % UNIT_ACTS.length].name);
        return;
      }
    }
    return;
  }
  if (G.phase === 'combat'){
    for (const rr of (G.relicRects || [])){
      if (inRect(p, rr)){ const rel = RELICS.find(x => x.id === rr.id); if (rel) flashMsg(relicTip(rel)); return; } // R20
    }
    // 스킬 버튼 (모바일 탭 지원)
    for (let i = 0; i < 3; i++){
      if (inRect(p, SKILL_BTNS[i])){ tryAim(i); return; }
    }
    // 조준 중 클릭/탭 = 발동
    if (G.aiming >= 0){
      castSkill(G.aiming, p.x, p.y);
      G.aiming = -1;
      return;
    }
    // 아레나 클릭/드래그 = 수동 조종
    if (p.y < SHOP_Y - 30){
      G.mouse.down = true;
      G.control = 'manual';
      G.lastManual = G.time;
    }
  }
});

codexCanvas.addEventListener('pointerdown', e => {
  const rect = codexCanvas.getBoundingClientRect();
  const sc = rect.width / W;
  const p = { x: (e.clientX - rect.left) / sc, y: (e.clientY - rect.top) / sc };
  if (inRect(p, DASH_CLOSE)){ setCodex(false); return; }
  if (G.codexDetail){ G.codexDetail = null; drawCodex(); return; } // R27: 상세 닫기
  for (let i = 0; i < CODEX_TABS.length; i++){
    if (inRect(p, CODEX_TABS[i])){ G.codex.tab = i; G.codexDetail = null; G.dashDrawT = 0; drawCodex(); return; } // R27
  }
  if (G.codex.tab === 0){ // R27: 영웅 카드 → 합성 도감
    for (const r of G.codexUnitRects){
      if (inRect(p, r)){ G.codexDetail = r.unitId; drawCodex(); return; }
    }
  }
  if (G.codex.tab === 2){
    for (const r of G.codexRects){

      }

    for (const r of G.codexRects){
      if (inRect(p, r)){
        if (equipSkin(r.skinType, r.skinId)) drawCodex();

      }

});

function drawBoss(e){
  const L = G.leader;
  const def = e.bossDef || BOSS_TYPES[BOSS_TYPES.length - 1];
  // 강타 전조 라인 (쿨다운 막바지 1초)
  const inRange = dist(e.x, e.y, L.x, L.y) <= 70 + e.r;
  if (inRange && e.atkT < 1.0){
    const a = 1 - e.atkT;
    ctx.globalAlpha = 0.25 + a * 0.6;
    ctx.strokeStyle = '#ff4a5a';
    ctx.lineWidth = 2 + a * 4;
    ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(L.x, L.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(L.x, L.y, 40 + Math.sin(G.time * 12) * 6, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  // 쿨다운 아크 (보스 머리 위)
  if (inRange){
    const cdr = clamp(1 - e.atkT / e.atkCd, 0, 1);
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = cdr > 0.7 ? '#ff4a5a' : 'rgba(255,154,90,0.8)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(e.x, e.y - e.r - 14, 9, -Math.PI/2, -Math.PI/2 + cdr * TAU); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  // 패턴 전조 (R18)
  if (def.pattern === 'ring' && e.patT < 0.9 && !e.chargeState){
    const a = 1 - e.patT / 0.9;
    ctx.globalAlpha = 0.15 + a * 0.35;
    ctx.strokeStyle = def.ring;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8 + a * 40, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  if (def.pattern === 'root' && e.patT < 0.9){
    const a = 1 - e.patT / 0.9;
    ctx.globalAlpha = 0.10 + a * 0.25;
    ctx.strokeStyle = def.ring;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 10]);
    ctx.beginPath(); ctx.arc(e.x, e.y, 175, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  if (e.chargeState === 'tel'){
    const a = 0.3 + 0.4 * Math.abs(Math.sin(G.time * 14));
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ff4a5a';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x + Math.cos(e.chargeA) * 560, e.y + Math.sin(e.chargeA) * 560);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  if (e.shieldT > 0){ // 수호자 방벽
    ctx.globalAlpha = 0.35 + 0.2 * Math.sin(G.time * 8);
    ctx.strokeStyle = def.ring;
    ctx.lineWidth = 3;
    shapePath(e.x, e.y, e.r + 14, G.time * 0.8, 6);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.sx, 2 - e.sx > 0.7 ? 2 - e.sx : 1);
  ctx.translate(-e.x, -e.y);
  const flash = e.flash > 0;
  if (def.pattern === 'ring'){ // 격랑의 군주: 회전 지느러미 3개 + 물결 코어
    for (let k = 0; k < 3; k++){
      const a = G.time * 1.1 + k / 3 * TAU;
      shapePath(e.x + Math.cos(a) * (e.r + 10), e.y + Math.sin(a) * (e.r + 10), 11, a + Math.PI/2, 3);
      ctx.fillStyle = flash ? '#fff' : def.ring;
      ctx.fill();
    }
    shapePath(e.x, e.y, e.r * 1.1, e.rot, 6);
    ctx.fillStyle = flash ? '#fff' : def.dark;
    ctx.shadowColor = def.color; ctx.shadowBlur = 24;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = flash ? '#fff' : def.color; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    for (let k = 0; k < 2; k++){
      const rr = e.r * (0.42 + k * 0.24) + Math.sin(G.time * 3 + k * 2) * 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, TAU);
      ctx.strokeStyle = flash ? '#fff' : def.ring; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    }
  } else if (def.pattern === 'root'){ // 가라앉은 포식자: 톱니 별 + 떠다니는 잎
    ctx.beginPath();
    for (let k = 0; k < 10; k++){
      const a = e.rot * 0.6 + k / 10 * TAU;
      const rr = k % 2 === 0 ? e.r * 1.2 : e.r * 0.62;
      k === 0 ? ctx.moveTo(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr) : ctx.lineTo(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = flash ? '#fff' : def.dark;
    ctx.shadowColor = def.color; ctx.shadowBlur = 24;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = flash ? '#fff' : def.color; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    for (let k = 0; k < 5; k++){
      const a = G.time * 0.9 + k / 5 * TAU;
      ctx.beginPath();
      ctx.ellipse(e.x + Math.cos(a) * (e.r + 14), e.y + Math.sin(a) * (e.r + 14) * 0.8, 6, 3, a, 0, TAU);
      ctx.fillStyle = flash ? '#fff' : def.ring;
      ctx.fill();
    }
    shapePath(e.x, e.y, e.r * 0.4, -e.rot, 6);
    ctx.fillStyle = flash ? '#fff' : def.color;
    ctx.fill();
  } else if (def.pattern === 'guard'){ // 침묵의 수호자: 육각 코어 + 방벽 판 4개
    for (let k = 0; k < 4; k++){
      const a = G.time * (e.shieldT > 0 ? 2.2 : 0.9) + k / 4 * TAU;
      const px = e.x + Math.cos(a) * (e.r + 13), py = e.y + Math.sin(a) * (e.r + 13);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.fillStyle = flash ? '#fff' : (e.shieldT > 0 ? def.ring : def.color);
      ctx.fillRect(-6, -9, 12, 18);
      ctx.restore();
    }
    shapePath(e.x, e.y, e.r * 1.12, e.rot, 6);
    ctx.fillStyle = flash ? '#fff' : def.dark;
    ctx.shadowColor = def.color; ctx.shadowBlur = 24;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = flash ? '#fff' : def.color; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    shapePath(e.x, e.y, e.r * 0.55, -e.rot * 1.3, 6);
    ctx.fillStyle = flash ? '#fff' : '#160b38';
    ctx.fill();
  } else if (def.pattern === 'charge'){ // 무저갱의 폭군: 뿔 달린 다이아 + 턱
    for (let k = 0; k < 8; k++){
      const a = e.rot + k / 8 * TAU;
      const r1 = e.r * 0.9, r2 = e.r * 1.35;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(a - 0.18) * r1, e.y + Math.sin(a - 0.18) * r1);
      ctx.lineTo(e.x + Math.cos(a) * r2, e.y + Math.sin(a) * r2);
      ctx.lineTo(e.x + Math.cos(a + 0.18) * r1, e.y + Math.sin(a + 0.18) * r1);
      ctx.closePath();
      ctx.fillStyle = flash ? '#fff' : (e.enraged ? '#ff3c1e' : def.color);
      ctx.fill();
    }
    shapePath(e.x, e.y, e.r * 1.05, e.rot, 4);
    ctx.fillStyle = flash ? '#fff' : def.dark;
    ctx.shadowColor = def.color; ctx.shadowBlur = 24;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = flash ? '#fff' : def.color; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    const jaw = 0.5 + 0.3 * Math.sin(G.time * (e.enraged ? 10 : 5));
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.55, e.rot - jaw, e.rot + jaw);
    ctx.lineTo(e.x, e.y); ctx.closePath();
    ctx.fillStyle = flash ? '#fff' : '#2a0e04';
    ctx.fill();
  } else { // 심연 군주 (기존 디자인 유지)
    for (let k = 0; k < 8; k++){
      const a = G.time * 1.2 + k / 8 * TAU;
      const px = e.x + Math.cos(a) * (e.r + 12), py = e.y + Math.sin(a) * (e.r + 12);
      ctx.save();
      ctx.translate(px, py); ctx.rotate(a + G.time * 3);
      ctx.fillStyle = flash ? '#fff' : '#5a1fa0';
      ctx.fillRect(-4, -4, 8, 8);
      ctx.restore();
    }
    shapePath(e.x, e.y, e.r * 1.15, e.rot, 6);
    ctx.fillStyle = flash ? '#ffffff' : '#3d1470';
    ctx.shadowColor = '#8a2be2';
    ctx.shadowBlur = 26;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = flash ? '#fff' : '#b45aff';
    ctx.lineWidth = 3;
    ctx.stroke();
    shapePath(e.x, e.y, e.r * 0.62, -e.rot * 1.4, 6);
    ctx.fillStyle = flash ? '#fff' : '#24084a';
    ctx.fill();
    ctx.fillStyle = flash ? '#222' : '#ff2a5a';
    ctx.shadowColor = '#ff2a5a'; ctx.shadowBlur = 10;
    for (const off of [-0.38, 0, 0.38]){
      ctx.beginPath();
      ctx.arc(e.x + off * e.r, e.y - e.r * 0.12 + Math.sin(G.time * 3 + off * 8) * 2, 3.6, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  ctx.lineWidth = 1;
}

// ---------- 도형 그리기 ----------
function shapePathOn(c, x, y, r, rot, sides){
  c.beginPath();
  if (sides === 4){ // 다이아
    c.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r);
    c.lineTo(x + Math.cos(rot + Math.PI/2) * r * 0.8, y + Math.sin(rot + Math.PI/2) * r * 0.8);
    c.lineTo(x + Math.cos(rot + Math.PI) * r, y + Math.sin(rot + Math.PI) * r);
    c.lineTo(x + Math.cos(rot - Math.PI/2) * r * 0.8, y + Math.sin(rot - Math.PI/2) * r * 0.8);
  } else if (sides === 3){
    for (let i = 0; i < 3; i++){
      const a = rot + i * TAU / 3;
      const rr = i === 0 ? r * 1.15 : r * 0.85;
      i === 0 ? c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  } else {
    for (let i = 0; i < 6; i++){
      const a = rot + i * TAU / 6;
      i === 0 ? c.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
  }
  c.closePath();
}
function shapePath(x, y, r, rot, sides){ shapePathOn(ctx, x, y, r, rot, sides); }
function unitShapePath(x, y, r, rot, cls){
  ctx.beginPath();
  if (cls === 'cleric'){ // 십자
    const w = r * 0.38;
    ctx.moveTo(x - w, y - r); ctx.lineTo(x + w, y - r); ctx.lineTo(x + w, y - w);
    ctx.lineTo(x + r, y - w); ctx.lineTo(x + r, y + w); ctx.lineTo(x + w, y + w);
    ctx.lineTo(x + w, y + r); ctx.lineTo(x - w, y + r); ctx.lineTo(x - w, y + w);
    ctx.lineTo(x - r, y + w); ctx.lineTo(x - r, y - w); ctx.lineTo(x - w, y - w);
  } else if (cls === 'assassin'){ // 길쭉한 연꼴
    ctx.moveTo(x + Math.cos(rot) * r * 1.4, y + Math.sin(rot) * r * 1.4);
    ctx.lineTo(x + Math.cos(rot + Math.PI/2) * r * 0.5, y + Math.sin(rot + Math.PI/2) * r * 0.5);
    ctx.lineTo(x + Math.cos(rot + Math.PI) * r * 0.85, y + Math.sin(rot + Math.PI) * r * 0.85);
    ctx.lineTo(x + Math.cos(rot - Math.PI/2) * r * 0.5, y + Math.sin(rot - Math.PI/2) * r * 0.5);
  } else if (cls === 'summoner' || cls === 'sailor'){ // 별 (5각/4각)
    const pts = cls === 'summoner' ? 5 : 4;
    for (let i = 0; i < pts * 2; i++){
      const a = rot + i * Math.PI / pts;
      const rr = i % 2 === 0 ? r : r * 0.48;
      i === 0 ? ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  } else {
    const sides = cls === 'sword' ? 4 : cls === 'archer' || cls === 'warlock' ? 3 : cls === 'cannon' ? 5 : 6;
    const base = cls === 'guardian' ? r * 1.2 : r;
    const rot2 = cls === 'warlock' ? rot + Math.PI : rot;
    for (let i = 0; i < sides; i++){
      const a = rot2 + i * TAU / sides;
      const rr = sides === 3 ? (i === 0 ? base * 1.15 : base * 0.85) : base;
      i === 0 ? ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  }
  ctx.closePath();
}
function drawUnitShape(u, x, y, rot, sx, alpha){

function drawStarPips(x, y, star){

// ---------- 사망 링/파편 ----------
function drawDeathFx(){
  for (const r of G.deathRings){
    const a = clamp(r.life / r.maxlife, 0, 1);
    const rr = lerp(r.r1, r.r, a); // 감속하며 확장
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 1 + a * 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a * 0.35;
    ctx.beginPath(); ctx.arc(r.x, r.y, rr * 0.6, 0, TAU); ctx.stroke();
  }
  for (const rg of G.bossRings){ // 보스 충격파 링 (R18)
    const a = clamp(1 - rg.r / rg.max, 0, 1);
    ctx.globalAlpha = 0.25 + a * 0.6;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (0.25 + a * 0.6) * 0.5;
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r - 7, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 1;
  for (const d of G.debris){
    const a = clamp(d.life / 0.5, 0, 1);
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size * 0.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- 후처리 (품질 높음) ----------
function drawPost(){
  if (!G.settings.quality) return;
  // 색수차 가장자리 프린지
  if (G.abAmt > 0.02){
    const a = G.abAmt;
    const w = 26 + a * 60;
    let g = ctx.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, 'rgba(255,40,70,' + (0.22 * a) + ')');
    g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, w, H + 40);
    g = ctx.createLinearGradient(W, 0, W - w, 0);
    g.addColorStop(0, 'rgba(60,200,255,' + (0.22 * a) + ')');
    g.addColorStop(1, 'rgba(60,200,255,0)');
    ctx.fillStyle = g; ctx.fillRect(W - w, -20, w + 20, H + 40);
  }
  // 보스 경고: 화면 암전 펄스
  if (G.bossWarnT > 0){
    const a = Math.min(0.4, G.bossWarnT * 0.3) * (0.7 + 0.3 * Math.sin(G.time * 9));
    ctx.fillStyle = 'rgba(40,4,60,' + a + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  // 등불 위기: 붉은 맥동 비네트 (R31: R29 이중 비네트를 이 한 곳으로 통합 - 심각도 비례 강도 + 심박 동기 맥동)
  if ((G.phase === 'combat' || G.phase === 'shop') && G.coreHp > 0 && G.coreHp / G.coreMax < 0.3){
    const ratio = G.coreHp / G.coreMax;
    const sev = 1 - ratio / 0.3;
    const pulse = Math.pow(0.5 + 0.5 * Math.sin(G.time * (ratio <= 0.15 ? 7.4 : 5.2)), 2);
    const a = (0.07 + 0.13 * pulse) * (0.5 + 0.5 * sev);
    const g = ctx.createRadialGradient(W/2, H/2, 200, W/2, H/2, 620);
    g.addColorStop(0, 'rgba(255,30,40,0)');
    g.addColorStop(1, 'rgba(255,30,40,' + a.toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
}

// ---------- 보스 HP/쿨다운 바 ----------
function drawBossBar(){
  const b = G.boss;
  if (!b) return;
  const bw = 460, bx = W/2 - bw/2, by = 90;
  ctx.fillStyle = 'rgba(4,8,18,0.8)';
  ctx.beginPath(); ctx.roundRect(bx - 10, by - 24, bw + 20, 52, 8); ctx.fill();

  const bdz = depthOf(G.wave);
  ctx.textAlign = 'center';
  ctx.fillStyle = bdef.ring;
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.fillText(bdef.name + (bdz > 1 ? ' · 심화 ' + bdz + '단계' : ''), W/2, by - 8);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';

  ctx.textAlign = 'left';
  ctx.fillText(inRange ? (cdr >= 1 ? '강타!' : '강타 대기') : '접근 중', bx + bw + 8, by + 17);
}

// ---------- 환경/구역 연출 (R11) ----------
const ZONES = [
  { name: '물결의 틈',  at: 1,  top: [12,20,48],   bot: [2,3,10],  ring: [60,90,160],   fogA: 0.05, vig: 0.55, mote: { c: [190,215,255], n: 50, spd: 8,  r: 1.4, up: 0.2  }, sil: 'none'  },
  { name: '가라앉은 숲', at: 6,  top: [10,26,42],  bot: [2,8,6],   ring: [50,140,120],  fogA: 0.07, vig: 0.58, mote: { c: [150,230,200], n: 60, spd: 12, r: 1.6, up: 1.0  }, sil: 'kelp'  },
  { name: '침묵의 폐허', at: 11, top: [22,18,38],  bot: [5,3,8],   ring: [110,90,170],  fogA: 0.09, vig: 0.63, mote: { c: [200,190,230], n: 70, spd: 10, r: 1.3, up: 0.1  }, sil: 'ruin'  },
  { name: '무저갱',     at: 16, top: [18,10,28],  bot: [4,1,4],   ring: [150,60,90],   fogA: 0.11, vig: 0.70, mote: { c: [255,150,110], n: 60, spd: 14, r: 1.5, up: -0.3 }, sil: 'spire' },
  { name: '심연의 심장', at: 21, top: [26,7,18],   bot: [5,0,5],   ring: [190,40,80],   fogA: 0.13, vig: 0.75, mote: { c: [255,90,120],  n: 80, spd: 16, r: 1.7, up: -0.5 }, sil: 'heart' },
];
function _sstep(a, b, x){ const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
// ---------- 무한 모드: 심화(뎁스) 순환 (R15) ----------
function depthOf(w){ return Math.floor(Math.max(0, w - 1) / 25) + 1; }   // 1-25파=1단계, 26-50=2단계, ...
function zoneWave(w){ return w < 26 ? w : 1 + ((w - 1) % 25); }          // 26파부터 구역 순환
function zoneWeights(){
  const x = zoneWave(Math.max(0, G.wave)), w = [];
  for (let i = 0; i < ZONES.length; i++){
    const enter = i === 0 ? 1 : _sstep(ZONES[i].at - 1, ZONES[i].at + 1, x);
    const exit = i + 1 < ZONES.length ? _sstep(ZONES[i + 1].at - 1, ZONES[i + 1].at + 1, x) : 0;
    w.push(Math.max(0, enter - exit));
  }
  return w;
}
function zoneLerp(key){
  const w = zoneWeights(), out = [0, 0, 0];
  for (let i = 0; i < ZONES.length; i++){ const c = ZONES[i][key]; out[0] += c[0] * w[i]; out[1] += c[1] * w[i]; out[2] += c[2] * w[i]; }
  return out;
}
function zoneLerpF(key){
  const w = zoneWeights(); let v = 0;
  for (let i = 0; i < ZONES.length; i++) v += ZONES[i][key] * w[i];
  return v;
}
function zoneLerpMote(key){
  const w = zoneWeights(); let v = 0;
  for (let i = 0; i < ZONES.length; i++) v += ZONES[i].mote[key] * w[i];
  return v;
}
function dominantZone(){
  const w = zoneWeights(); let bi = 0, bv = 0;
  for (let i = 0; i < w.length; i++) if (w[i] > bv){ bv = w[i]; bi = i; }
  return bi;
}
const _rgb = c => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';

function ensureEnv(){
  if (G.env) return;
  G.env = { motes: [], fog: [], silZone: -1, silCv: null, fogCv: null, bannerT: 0, bannerName: '', zoneShown: -1, silOK: typeof document.createElement === 'function' };
  for (let i = 0; i < 90; i++) G.env.motes.push({ x: rand(0, W), y: rand(0, H), ph: rand(0, TAU), tw: rand(0.6, 1.8), sp: rand(0.5, 1.5) });
  for (let i = 0; i < 3; i++) G.env.fog.push({ ph: rand(0, TAU), sp: rand(0.7, 1.3), sc: rand(3.5, 6) });
}
function updateEnv(dt){
  ensureEnv();
  const spd = zoneLerpMote('spd'), up = zoneLerpMote('up');
  for (const m of G.env.motes){
    m.x += Math.sin(G.time * 0.3 + m.ph) * spd * 0.35 * dt * m.sp;
    m.y -= up * spd * dt * m.sp;
    if (m.y < -8) m.y = H + 8; if (m.y > H + 8) m.y = -8;
    if (m.x < -8) m.x = W + 8; if (m.x > W + 8) m.x = -8;
  }
  if (G.env.bannerT > 0) G.env.bannerT -= dt;
  if (G.phase === 'combat' || G.phase === 'shop'){
    const zi = dominantZone();
    const dz = depthOf(G.wave), zkey = zi + dz * 10;
    if (zkey > G.env.zoneShown && zoneWave(G.wave) >= ZONES[zi].at){
      G.env.zoneShown = zkey;
      G.env.bannerName = ZONES[zi].name + (dz > 1 ? ' · 심화 ' + dz + '단계' : '');
      G.env.bannerT = 3.2;
    }
  }
}
function envSilhouette(zi){
  const E = G.env;
  if (E.silZone === zi && E.silCv) return E.silCv;
  E.silZone = zi; E.silCv = null;
  if (!E.silOK) return null;
  const kind = ZONES[zi].sil;
  if (kind === 'none') return null;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c2 = cv.getContext('2d');
  if (kind === 'kelp'){
    c2.strokeStyle = 'rgba(8,38,32,0.85)'; c2.lineCap = 'round';
    for (let i = 0; i < 9; i++){
      const bx = 40 + i * 118 + rand(-30, 30), h = rand(90, 230), lw = rand(5, 11);
      c2.lineWidth = lw; c2.beginPath(); c2.moveTo(bx, H + 10);
      for (let y = 0; y <= h; y += 14) c2.lineTo(bx + Math.sin(y * 0.05 + i) * 14, H - y);
      c2.stroke();
    }
  } else if (kind === 'ruin'){
    c2.fillStyle = 'rgba(24,18,40,0.9)';
    for (let i = 0; i < 6; i++){
      const bx = 60 + i * 170 + rand(-40, 40), bw = rand(34, 60), bh = rand(80, 200), tl = rand(-0.08, 0.08);
      c2.save(); c2.translate(bx, H); c2.rotate(tl);
      c2.fillRect(-bw/2, -bh, bw, bh);
      c2.clearRect(-bw/2, -bh, bw, rand(6, 20)); // 부서진 상단
      c2.restore();
    }
  } else if (kind === 'spire'){
    c2.fillStyle = 'rgba(30,8,16,0.9)';
    for (let i = 0; i < 12; i++){
      const bx = i * 92 + rand(-20, 20), bw = rand(30, 70), bh = rand(60, 190);
      c2.beginPath(); c2.moveTo(bx - bw/2, H); c2.lineTo(bx, H - bh); c2.lineTo(bx + bw/2, H); c2.fill();
      if (i % 3 === 0){ const th = rand(50, 130); c2.beginPath(); c2.moveTo(bx - bw/3, 0); c2.lineTo(bx, th); c2.lineTo(bx + bw/3, 0); c2.fill(); }
    }
  } else if (kind === 'heart'){
    c2.strokeStyle = 'rgba(60,8,24,0.8)'; c2.lineCap = 'round';
    for (let i = 0; i < 5; i++){
      const rr = 180 + i * 90; c2.lineWidth = rand(10, 22);
      c2.beginPath(); c2.arc(W/2, H + rr * 0.55, rr, Math.PI * 1.15, Math.PI * 1.85); c2.stroke();
    }
  }
  E.silCv = cv; return cv;
}
function envFogCanvas(){
  const E = G.env;
  if (E.fogCv || !E.silOK) return E.fogCv;
  const cv = document.createElement('canvas'); cv.width = 200; cv.height = 200;
  const c2 = cv.getContext('2d');
  const g = c2.createRadialGradient(100, 100, 8, 100, 100, 100);
  g.addColorStop(0, 'rgba(150,180,220,0.55)'); g.addColorStop(1, 'rgba(150,180,220,0)');
  c2.fillStyle = g; c2.fillRect(0, 0, 200, 200);
  E.fogCv = cv; return cv;
}
function drawBackground(){
  ensureEnv();
  const top = zoneLerp('top'), bot = zoneLerp('bot'), ring = zoneLerp('ring');
  const g = ctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 620);
  g.addColorStop(0, _rgb(top));
  g.addColorStop(1, _rgb(bot));
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  const hiQ = G.settings.quality === 1;
  // 구역 실루엣 (하단/가장자리, 전투 요소 아래)
  if (hiQ){
    const sc = envSilhouette(dominantZone());
    if (sc){ ctx.globalAlpha = 0.55; ctx.drawImage(sc, Math.sin(G.time * 0.05) * 8, 0); ctx.globalAlpha = 1; }
  }
  // 안개 블롭 3개
  if (hiQ){
    const fc = envFogCanvas(), fa = zoneLerpF('fogA');
    if (fc && fa > 0.01){
      for (const f of G.env.fog){
        const fx = W/2 + Math.sin(G.time * 0.07 * f.sp + f.ph) * W * 0.38;
        const fy = H/2 + Math.cos(G.time * 0.05 * f.sp + f.ph * 1.7) * H * 0.32;
        const fs = 200 * f.sc;
        ctx.globalAlpha = fa * (0.65 + 0.35 * Math.sin(G.time * 0.22 * f.sp + f.ph));
        ctx.drawImage(fc, fx - fs/2, fy - fs/2, fs, fs);
      }
      ctx.globalAlpha = 1;
    }
  }
  // 등불 파동 링
  ctx.strokeStyle = 'rgba(' + Math.round(ring[0]) + ',' + Math.round(ring[1]) + ',' + Math.round(ring[2]) + ',0.07)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++){
    ctx.beginPath();
    ctx.arc(G.leader.x, G.leader.y, 120 + i * 90 + Math.sin(G.time * 0.5 + i) * 6, 0, TAU);
    ctx.stroke();
  }
  // 부유 입자 (구역별 색/밀도/흐름)
  const mn = Math.round(zoneLerpMote('n') * (hiQ ? 1 : 0.3));
  const mc = zoneLerpMoteColor();
  const mr = zoneLerpMote('r');
  ctx.fillStyle = _rgb(mc);
  for (let i = 0; i < mn && i < G.env.motes.length; i++){
    const m = G.env.motes[i];
    ctx.globalAlpha = 0.18 + 0.16 * Math.sin(G.time * m.tw + m.ph);
    ctx.beginPath(); ctx.arc(m.x, m.y, mr, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function zoneLerpMoteColor(){
  const w = zoneWeights(), out = [0, 0, 0];
  for (let i = 0; i < ZONES.length; i++){ const c = ZONES[i].mote.c; out[0] += c[0] * w[i]; out[1] += c[1] * w[i]; out[2] += c[2] * w[i]; }
  return out;
}

function drawBeams(){

function drawLantern(){

  // 잔상
  for (const t of L.trail){
    ctx.globalAlpha = t.life / 0.35 * 0.25;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 20, 0, TAU);
    ctx.fillStyle = sk.trail;

  }

  const pulse = 1 + Math.sin(G.time * 2.4) * 0.06;
  const g = ctx.createRadialGradient(L.x, L.y, 4, L.x, L.y, 85 * pulse);
  g.addColorStop(0, 'rgba(' + sk.glow + ',0.45)');
