  ctx.fill();
  // 등불 본체: 프레임 + 코어 (R24: 스킨 반영)
  if (sk.sides > 0) shapePath(L.x, L.y, 24, sk.rot + G.time * sk.spin, sk.sides);
  else { ctx.beginPath(); ctx.arc(L.x, L.y, 24, 0, TAU); }
  ctx.strokeStyle = G.coreFlash > 0 ? '#fff' : sk.frameCol;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(L.x, L.y, 14 * (G.coreFlash > 0 ? 1.2 : 1), 0, TAU);
  ctx.fillStyle = G.coreFlash > 0 ? '#fff2d8' : sk.core;
  ctx.shadowColor = sk.shadow;
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.shadowBlur = 0;
  if (G.coreFlash <= 0){ // R24: 스킨별 추가 연출
    if (sk.id === 'abyss_eye'){
      // 홍채 + 동공 + 눈빛
      ctx.beginPath(); ctx.arc(L.x, L.y, 8, 0, TAU);
      ctx.fillStyle = '#9b5de5'; ctx.fill();
      ctx.beginPath(); ctx.arc(L.x, L.y, 3.5, 0, TAU);
      ctx.fillStyle = '#0a0618'; ctx.fill();
      ctx.beginPath(); ctx.arc(L.x - 3, L.y - 3, 1.6, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
    } else if (sk.id === 'frost'){
      // 주위를 도는 얼음 결정
      for (let i = 0; i < 6; i++){
        const a = G.time * 0.6 + i * Math.PI / 3;
        const d = 31 + Math.sin(G.time * 3 + i) * 2;
        shapePath(L.x + Math.cos(a) * d, L.y + Math.sin(a) * d, 3, a, 4);
        ctx.fillStyle = 'rgba(191,239,255,0.85)';
        ctx.fill();
      }
    } else if (sk.id === 'golden'){
      // 회전 광선
      ctx.strokeStyle = 'rgba(255,240,190,0.5)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++){
        const a = G.time * 0.8 + i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(L.x + Math.cos(a) * 30, L.y + Math.sin(a) * 30);
        ctx.lineTo(L.x + Math.cos(a) * 39, L.y + Math.sin(a) * 39);
        ctx.stroke();
      }
    }
  }
  if (G.coreFlash > 0) G.coreFlash -= 0.016;
}

function drawUnits(){
  for (const u of G.units){
    for (const t of u.trail) drawUnitShape(u, t.x, t.y, t.rot, 0.9, t.life / 0.28 * 0.3);
  }
  for (const u of G.units){
    drawUnitShape(u, u.x, u.y, u.rot, u.sx, 1);
    drawStarPips(u.x, u.y - 21, u.star);
    if (u.maxhp && u.hp < u.maxhp){
      const w2 = 22;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(u.x - w2/2, u.y + 17, w2, 3);
      ctx.fillStyle = u.hp / u.maxhp > 0.35 ? '#6ae28f' : '#ff7a6a';
      ctx.fillRect(u.x - w2/2, u.y + 17, w2 * clamp(u.hp / u.maxhp, 0, 1), 3);
    }
    // 행동 표시 (기본 진형 외)
    if (u.act !== 'form'){
      ctx.fillStyle = 'rgba(200,220,255,0.75)';
      ctx.font = '9px "Noto Sans KR",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(u.act === 'charge' ? '돌격' : '고정', u.x, u.y + 26);
    }
  }
}

function drawEnemies(){
  // 전조 (적 아래 레이어)
  for (const e of G.enemies){
    if (e.kind === 'spitter' && e.atkT < 0.7 && e.tgt){
      const tp = e.tgt === G.leader ? G.leader : e.tgt;
      const a = 1 - Math.max(0, e.atkT) / 0.7;
      ctx.globalAlpha = 0.2 + a * 0.5;
      ctx.strokeStyle = '#7af0d0';
      ctx.lineWidth = 1.5 + a;
      ctx.setLineDash([7, 6]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } else if (e.kind === 'charger' && e.mode === 'aim'){
      const a = 1 - Math.max(0, e.aimT) / 0.8;
      const dx = e.aimX - e.x, dy = e.aimY - e.y;
      const m = Math.hypot(dx, dy) || 1;
      ctx.globalAlpha = 0.25 + a * 0.55;
      ctx.strokeStyle = '#ff7a3c';
      ctx.lineWidth = 4 + a * 5;
      ctx.setLineDash([14, 10]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + dx / m * (m + 130), e.y + dy / m * (m + 130)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } else if (e.kind === 'bomber' && e.fuse > 0){
      const a = 1 - e.fuse / 0.6;
      ctx.globalAlpha = 0.18 + a * 0.3 + Math.sin(G.time * 24) * 0.08;
      ctx.fillStyle = '#ff9a2e';
      ctx.beginPath(); ctx.arc(e.x, e.y, 80, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#ff5a3c';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, 80 * (1 - a * 0.35), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
  }
  // 소환 전조
  for (const t of G.spawnTels){
    const a = 1 - t.t / 0.7;
    ctx.globalAlpha = 0.35 + a * 0.4;
    ctx.strokeStyle = '#b04ff0';
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, 18 + (1 - a) * 16, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  for (const e of G.enemies){
    if (e.boss){ drawBoss(e); continue; }
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(e.sx, 2 - e.sx > 0.7 ? 2 - e.sx : 1);
    ctx.translate(-e.x, -e.y);
    const fill = e.flash > 0 ? '#ffffff' : e.color;
    const glow = e.champ ? e.champ.color : e.elite ? '#ffd24a' : e.color; // R21
    ctx.shadowColor = glow;
    ctx.shadowBlur = e.champ ? 18 : e.elite ? 14 : e.kind === 'tank' ? 14 : 7;
    ctx.fillStyle = fill;
    ctx.strokeStyle = 'rgba(8,6,20,0.8)';
    ctx.lineWidth = 2;
    if (e.kind === 'charger'){
      // 날카로운 삼각형 (진행 방향)
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.translate(-e.x, -e.y);
      shapePath(e.x, e.y, e.r * 1.35, 0, 3);
      ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
      ctx.restore();
    } else if (e.kind === 'spitter'){
      shapePath(e.x, e.y, e.r * 1.15, e.rot, 5);
      ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.42, 0, TAU);
      ctx.fillStyle = e.flash > 0 ? '#fff' : '#0d3a30';
      ctx.fill();
    } else if (e.kind === 'splitter'){
      for (let k = 0; k < 3; k++){
        const a = e.rot + k / 3 * TAU;
        shapePath(e.x + Math.cos(a) * e.r * 0.42, e.y + Math.sin(a) * e.r * 0.42, e.r * 0.62, a * 1.4, 4);
        ctx.fill(); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    } else if (e.kind === 'shield'){
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.translate(-e.x, -e.y);
      shapePath(e.x, e.y, e.r * 1.1, 0, 6);
      ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
      // 정면 방패 바
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 1.45, -0.7, 0.7);
      ctx.strokeStyle = e.flash > 0 ? '#fff' : '#9ab8d8';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.restore();
    } else if (e.kind === 'bomber'){
      // 불규칙 가시 원
      ctx.beginPath();
      for (let k = 0; k < 16; k++){
        const a = k / 16 * TAU + e.rot;
        const rr = k % 2 === 0 ? e.r * 1.3 : e.r * 0.75;
        k === 0 ? ctx.moveTo(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr) : ctx.lineTo(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
      const pulse = e.fuse > 0 ? 1 + Math.sin(G.time * 30) * 0.5 : 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.4 * pulse, 0, TAU);
      ctx.fillStyle = e.fuse > 0 ? '#fff' : '#ff5a3c';
      ctx.fill();
    } else if (e.kind === 'cultist'){
      // 4각 별 (교주)
      ctx.beginPath();
      for (let k = 0; k < 8; k++){
        const a = e.rot * 0.6 + k * Math.PI / 4;
        const rr = k % 2 === 0 ? e.r * 1.35 : e.r * 0.5;
        k === 0 ? ctx.moveTo(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr) : ctx.lineTo(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.35, 0, TAU);
      ctx.fillStyle = e.flash > 0 ? '#fff' : '#2a0a40';
      ctx.fill();
    } else if (e.kind === 'mini'){
      shapePath(e.x, e.y, e.r, e.rot, 4);
      ctx.fill(); ctx.shadowBlur = 0;
    } else {
      // mob / fast / tank
      const w = e.r * 1.7;
      ctx.beginPath();
      if (e.kind === 'fast'){
        shapePath(e.x, e.y, e.r * 1.25, e.rot, 4);
      } else if (e.kind === 'tank'){
        shapePath(e.x, e.y, e.r * 1.15, e.rot, 6);
      } else {
        ctx.roundRect(e.x - w/2, e.y - w/2, w, w, 4);
      }
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    // 눈 (미니 제외)
    if (e.kind !== 'mini'){
      ctx.fillStyle = e.flash > 0 ? '#222' : '#ff4a6a';
      ctx.shadowColor = '#ff4a6a';
      ctx.shadowBlur = 5;
      const eyeY = e.kind === 'charger' || e.kind === 'shield' ? 0 : -e.r * 0.18;
      ctx.beginPath();
      ctx.arc(e.x - e.r * 0.32, e.y + eyeY, 2, 0, TAU);
      ctx.arc(e.x + e.r * 0.32, e.y + eyeY, 2, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
    // 엘리트 표시: 금색 외곽 링
    if (e.elite){
      ctx.globalAlpha = 0.75 + Math.sin(G.time * 5) * 0.2;
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
    if (e.champ){ // R21: 정예 오라 링 + 이름표
      const cmod = e.champ, t = G.time;
      ctx.globalAlpha = 0.55 + Math.sin(t * 4.5) * 0.2;
      ctx.strokeStyle = cmod.color; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7, t * 1.6, t * 1.6 + TAU * 0.72); ctx.stroke();
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12, -t * 1.1, -t * 1.1 + TAU * 0.72); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
      ctx.font = 'bold 10px "Noto Sans KR",sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = cmod.color;
      ctx.fillText('정예 ' + cmod.name + ' ' + ENEMY_TYPES[e.kind].name, e.x, e.y - e.r - 22);
      ctx.textAlign = 'left';
    }
    if (e.champ && e.champ.id === 'ward' && e.shieldHp > 0){ // R32: 장막 육각 링
      ctx.globalAlpha = 0.65; ctx.strokeStyle = '#8ab8ff'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 6; k++){
        const a = G.time * 1.4 + k / 6 * TAU;
        const px = e.x + Math.cos(a) * (e.r + 16), py = e.y + Math.sin(a) * (e.r + 16);
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
    if (e.volley){ // R23: 쇄도 포대 표시 (궤도 소구)
      ctx.fillStyle = '#8fe2ff';
      ctx.beginPath(); ctx.arc(e.x + Math.cos(G.time * 3 + e.rot) * (e.r + 4), e.y + Math.sin(G.time * 3 + e.rot) * (e.r + 4), 2.2, 0, TAU); ctx.fill();
    }
    if (e.willSplit || (e.champ && e.champ.id === 'split')){ // R23: 분열 예정 표시 (+R32 분열 정예)
      ctx.fillStyle = 'rgba(224,122,208,0.85)';
      ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(2, e.r * 0.25), 0, TAU); ctx.fill();
    }
    if (e.hp < e.maxhp){
      const w2 = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - w2/2, e.y - e.r - 9, w2, 3);
      ctx.fillStyle = e.champ ? e.champ.color : e.elite ? '#ffd24a' : '#ff5a6a'; // R21
      ctx.fillRect(e.x - w2/2, e.y - e.r - 9, w2 * (e.hp / e.maxhp), 3);
    }
  }
}

function drawOrbs(){
  for (const o of G.orbs){
    const blink = o.life < 3 ? (Math.sin(G.time * 14) > 0 ? 1 : 0.35) : 1;
    ctx.globalAlpha = blink;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 5, 0, TAU);
    ctx.fillStyle = '#ffd24a';
    ctx.shadowColor = '#ffd24a';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 2, 0, TAU);
    ctx.fillStyle = '#fff2c8';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawProjectiles(){ // R19: 클래스별 투사체 실루엣
  const hiQ = G.settings.quality === 1;
  for (const p of G.projectiles){
    const a = Math.atan2(p.vy, p.vx);
    ctx.save();
    ctx.translate(p.x, p.y);
    if (hiQ){ ctx.shadowColor = p.color; ctx.shadowBlur = 8; }
    switch (p.cls){
      case 'archer': { // 화살: 몸통+촉+깃
        ctx.rotate(a);
        ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(5, 0); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(0, -2.6); ctx.lineTo(0, 2.6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-12.5, -2.2); ctx.lineTo(-12.5, 2.2); ctx.closePath(); ctx.fill();
        ctx.lineWidth = 1;
        break;
      }
      case 'mage': { // 마법탄: 외곽+코어
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
        break;
      }
      case 'cleric': { // 성직자: 회전하는 빛 십자
        ctx.rotate(G.time * 5);
        ctx.fillStyle = '#fff8dc';
        ctx.fillRect(-1.4, -6, 2.8, 12);
        ctx.fillRect(-6, -1.4, 12, 2.8);
        break;
      }
      case 'cannon': { // 포탄: 철구+테두리+신관 불꽃
        ctx.fillStyle = '#2a3242';
        ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, TAU); ctx.fill();
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.arc(-Math.cos(a) * 6.5, -Math.sin(a) * 6.5, 1.6, 0, TAU); ctx.fill();
        ctx.lineWidth = 1;
        break;
      }
      case 'warlock': { // 저주탄: 회전 다이아몬드
        ctx.rotate(G.time * 6);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4, 0); ctx.lineTo(0, 6); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e9d5ff';
        ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, TAU); ctx.fill();
        break;
      }
      case 'sailor': { // 물방울: 머리+꼬리
        ctx.rotate(a);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(1.5, 0, 3.4, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-0.5, -2.2); ctx.lineTo(-8, 0); ctx.lineTo(-0.5, 2.2); ctx.closePath(); ctx.fill();
        break;
      }
      case 'summoner': { // 소환탄: 녹색 위습
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#d8ffe8';
        ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, TAU); ctx.fill();
        break;
      }
      default: {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, p.mage ? 5 : 3, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawEProjectiles(){
  for (const p of G.eproj){
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4.5, 0, TAU);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8, 0, TAU);
    ctx.fillStyle = '#0a1420';
    ctx.fill();
  }
}

function drawParticles(){
  for (const p of G.particles){
    ctx.globalAlpha = clamp(p.life / p.maxlife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawDmgNums(){
  ctx.textAlign = 'center';
  for (const d of G.dmgNums){
    ctx.globalAlpha = clamp(d.life / 0.8, 0, 1);
    ctx.fillStyle = d.color;
    ctx.font = 'bold ' + Math.round(13 * d.scale) + 'px "Noto Sans KR",sans-serif';
    ctx.fillText(d.val, d.x, d.y);
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  // 등불 중심 조명 + 가장자리 어둠 (가벼운 후처리)
  const L = G.leader;
  const vig = zoneLerpF('vig') + (dominantZone() === 4 ? Math.sin(G.time * 1.6) * 0.03 : 0);
  const g = ctx.createRadialGradient(L.x, L.y, 180, L.x, L.y, 640);
  g.addColorStop(0, 'rgba(2,3,10,0)');
  g.addColorStop(1, 'rgba(2,3,10,' + clamp(vig, 0.4, 0.85).toFixed(3) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
}

function drawSkillFx(){
  for (const f of G.skillFx){
    const a = clamp(f.life / f.maxlife, 0, 1);
    if (f.kind === 'beam'){
      ctx.globalAlpha = a * 0.12; // R19: 최외곽 광휘
      ctx.strokeStyle = '#ffb44a';
      ctx.lineWidth = 52;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.globalAlpha = a * 0.35;
      ctx.strokeStyle = '#ffb44a';
      ctx.lineWidth = 30;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = '#fff6da';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } else if (f.kind === 'ring'){
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.15 - a * 0.15), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } else if (f.kind === 'flash'){ // R19: 중심 섬광
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.3 - a * 0.3), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  for (const f of G.slowFields){
    const a = clamp(f.life / f.maxlife, 0, 1);
    ctx.globalAlpha = 0.14 * a + 0.05;
    ctx.fillStyle = '#8fe2ff';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.6 * a;
    ctx.strokeStyle = '#8fe2ff';
    ctx.setLineDash([8, 8]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, G.time * 0.8, G.time * 0.8 + TAU); ctx.stroke();
    ctx.globalAlpha = 0.35 * a; // R19: 내부 역회전 고리
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.65, -G.time * 1.3, -G.time * 1.3 + TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
}
function drawAim(){
  if (G.aiming < 0) return;
  const s = G.skills[G.aiming];
  const m = G.mouse, L = G.leader;
  ctx.fillStyle = 'rgba(2,4,12,0.35)';
  ctx.fillRect(0, 40, W, SHOP_Y - 70);
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  if (s.id === 'beam'){
    const a = Math.atan2(m.y - L.y, m.x - L.x);
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(L.x + Math.cos(a) * 760, L.y + Math.sin(a) * 760); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1; ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.15;
    ctx.beginPath(); ctx.arc(m.x, m.y, s.radius, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(m.x, m.y, s.radius, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1; ctx.globalAlpha = 1;
  }
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(s.name + ' - 클릭/탭으로 발동 (ESC 취소)', W/2, SHOP_Y - 46);
}
function drawSkillBar(){
  for (let i = 0; i < 3; i++){
    const r = SKILL_BTNS[i], s = G.skills[i];
    const ready = s.t <= 0, aiming = G.aiming === i;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = aiming ? 'rgba(255,210,74,0.3)' : ready ? 'rgba(40,56,96,0.75)' : 'rgba(20,28,50,0.75)';
    ctx.fill();
    ctx.strokeStyle = aiming ? '#ffd24a' : ready ? s.color : 'rgba(90,110,150,0.5)';
    ctx.lineWidth = aiming ? 2 : 1.2;
    ctx.stroke();
    ctx.lineWidth = 1;
    // 아이콘
    ctx.fillStyle = ready || aiming ? s.color : 'rgba(110,125,155,0.7)';
    const cx = r.x + r.w/2, cy = r.y + r.h * 0.34;
    if (s.id === 'nova'){ ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy, 11, 0, TAU); ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); }
    else if (s.id === 'beam'){ ctx.fillRect(cx - 10, cy - 2.5, 20, 5); }
    else { ctx.beginPath(); ctx.arc(cx, cy, 8, 0, TAU); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2.5; ctx.stroke(); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill(); }
    // 이름 + 키
    ctx.font = (COARSE ? 11 : 10) + 'px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(200,214,240,0.9)';
    ctx.fillText('[' + s.key + '] ' + s.name, cx, r.y + r.h * 0.78);
    // 쿨다운 오버레이
    if (!ready){
      const ratio = s.t / s.cd;
      ctx.fillStyle = 'rgba(4,8,18,0.72)';
      ctx.beginPath();
      ctx.roundRect(r.x, r.y, r.w, r.h * ratio, 8);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px "Noto Sans KR",sans-serif';
      ctx.fillText(Math.ceil(s.t) + '', cx, r.y + r.h * 0.48);
    }
  }
}

// 유물 아이콘: 12종 고유 실루엣 (어느 캔버스 ctx에나 그릴 수 있음)
function drawRelicGlyph(c, r, x, y, rad){
  c.save();
  c.strokeStyle = r.color; c.fillStyle = r.color; c.lineWidth = 1.6;
  c.shadowColor = r.color; c.shadowBlur = 6;
  const g = rad;
  switch (r.shape){
    case 'orb':
      c.beginPath(); c.arc(x, y, g * 0.8, 0, TAU); c.stroke();
      c.beginPath(); c.arc(x, y, g * 0.35, 0, TAU); c.fill();
      break;
    case 'banner':
      c.beginPath(); c.moveTo(x - g * 0.5, y + g * 0.9); c.lineTo(x - g * 0.5, y - g * 0.9); c.stroke();
      c.beginPath(); c.moveTo(x - g * 0.5, y - g * 0.9); c.lineTo(x + g * 0.8, y - g * 0.45); c.lineTo(x - g * 0.5, y); c.closePath(); c.fill();
      break;
    case 'diamond':
      c.beginPath(); c.moveTo(x, y - g); c.lineTo(x + g * 0.7, y); c.lineTo(x, y + g); c.lineTo(x - g * 0.7, y); c.closePath(); c.fill();
      break;
    case 'heart':
      c.beginPath(); c.arc(x - g * 0.35, y - g * 0.25, g * 0.42, 0, TAU); c.arc(x + g * 0.35, y - g * 0.25, g * 0.42, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(x - g * 0.72, y - g * 0.05); c.lineTo(x, y + g * 0.9); c.lineTo(x + g * 0.72, y - g * 0.05); c.closePath(); c.fill();
      break;
    case 'scope':
      c.beginPath(); c.arc(x, y, g * 0.7, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(x - g, y); c.lineTo(x + g, y); c.moveTo(x, y - g); c.lineTo(x, y + g); c.stroke();
      break;
    case 'coin':
      c.beginPath(); c.arc(x, y, g * 0.85, 0, TAU); c.fill();
      c.shadowBlur = 0; c.strokeStyle = 'rgba(10,14,28,0.85)';
      c.beginPath(); c.arc(x, y, g * 0.5, 0, TAU); c.stroke();
      break;
    case 'dice':
      c.beginPath(); c.roundRect(x - g * 0.75, y - g * 0.75, g * 1.5, g * 1.5, g * 0.25); c.fill();
      c.shadowBlur = 0; c.fillStyle = 'rgba(10,14,28,0.9)';
      for (const d of [[-0.35, -0.35], [0, 0], [0.35, 0.35]]){ c.beginPath(); c.arc(x + d[0] * g * 1.2, y + d[1] * g * 1.2, g * 0.14, 0, TAU); c.fill(); }
      break;
    case 'shield':
      c.beginPath(); c.moveTo(x, y - g); c.lineTo(x + g * 0.75, y - g * 0.5); c.lineTo(x + g * 0.6, y + g * 0.35); c.lineTo(x, y + g); c.lineTo(x - g * 0.6, y + g * 0.35); c.lineTo(x - g * 0.75, y - g * 0.5); c.closePath(); c.fill();
      break;
    case 'horn':
      c.beginPath(); c.moveTo(x - g * 0.8, y + g * 0.3); c.quadraticCurveTo(x, y + g * 0.1, x + g * 0.85, y - g * 0.8); c.lineTo(x + g * 0.85, y + g * 0.35); c.quadraticCurveTo(x, y + g * 0.75, x - g * 0.8, y + g * 0.3); c.closePath(); c.fill();
      break;
    case 'bolt': // R20
      c.beginPath(); c.moveTo(x + g * 0.25, y - g); c.lineTo(x - g * 0.45, y + g * 0.15); c.lineTo(x - g * 0.02, y + g * 0.15); c.lineTo(x - g * 0.25, y + g); c.lineTo(x + g * 0.5, y - g * 0.12); c.lineTo(x + g * 0.05, y - g * 0.12); c.closePath(); c.fill();
      break;
    case 'fang': // R20
      c.beginPath(); c.moveTo(x - g * 0.55, y - g * 0.8); c.quadraticCurveTo(x + g * 0.75, y - g * 0.5, x + g * 0.3, y + g * 0.85); c.quadraticCurveTo(x - g * 0.05, y + g * 0.2, x - g * 0.55, y - g * 0.8); c.closePath(); c.fill();
      break;
    case 'sickle': // R20
      c.beginPath(); c.arc(x, y, g * 0.75, -2.4, 0.9); c.stroke();
      c.beginPath(); c.moveTo(x + g * 0.35, y + g * 0.66); c.lineTo(x + g * 0.7, y + g * 0.95); c.stroke();
      c.beginPath(); c.arc(x, y, g * 0.4, -2.4, 0.9); c.stroke();
      break;
    case 'book': // R20
      c.beginPath(); c.roundRect(x - g * 0.7, y - g * 0.85, g * 1.4, g * 1.7, g * 0.15); c.fill();
      c.shadowBlur = 0; c.strokeStyle = 'rgba(10,14,28,0.85)';
      c.beginPath(); c.moveTo(x - g * 0.25, y - g * 0.85); c.lineTo(x - g * 0.25, y + g * 0.85); c.stroke();
      break;
    case 'magnet': // R20
      c.beginPath(); c.arc(x, y - g * 0.1, g * 0.68, Math.PI, TAU); c.lineTo(x + g * 0.68, y + g * 0.6); c.lineTo(x + g * 0.28, y + g * 0.6); c.lineTo(x + g * 0.28, y - g * 0.1);
      c.arc(x, y - g * 0.1, g * 0.28, 0, Math.PI, true); c.lineTo(x - g * 0.68, y + g * 0.6); c.lineTo(x - g * 0.28, y + g * 0.6); c.closePath(); c.fill();
      break;
    case 'mist':
      for (const d of [[-0.55, 0.15, 0.4], [0, -0.25, 0.5], [0.55, 0.15, 0.4]]){ c.beginPath(); c.arc(x + d[0] * g * 1.4, y + d[1] * g * 1.4, g * d[2], 0, TAU); c.fill(); }
      break;
    case 'flame':
      c.beginPath(); c.moveTo(x, y - g); c.quadraticCurveTo(x + g * 0.8, y - g * 0.1, x + g * 0.45, y + g * 0.55); c.quadraticCurveTo(x + g * 0.2, y + g, x, y + g * 0.85); c.quadraticCurveTo(x - g * 0.2, y + g, x - g * 0.45, y + g * 0.55); c.quadraticCurveTo(x - g * 0.8, y - g * 0.1, x, y - g); c.closePath(); c.fill();
      break;
    case 'anvil':
      c.beginPath(); c.moveTo(x - g * 0.9, y - g * 0.55); c.lineTo(x + g * 0.9, y - g * 0.55); c.lineTo(x + g * 0.35, y); c.lineTo(x - g * 0.35, y); c.closePath(); c.fill();
      c.fillRect(x - g * 0.5, y + g * 0.45, g, g * 0.3);
      break;
    default:
      c.beginPath(); c.arc(x, y, g * 0.7, 0, TAU); c.fill();
  }
  c.restore();
}
function drawRelicBar(){
  G.relicRects = [];
  if (!G.relics || !G.relics.length) return;
  const y0 = 62 + G.units.length * 26;
  for (let i = 0; i < G.relics.length; i++){
    const r = RELICS.find(x => x.id === G.relics[i]);
    if (!r) continue;
    const x = 22 + (i % 7) * 27, y = y0 + Math.floor(i / 7) * 27;

    ctx.fillStyle = 'rgba(12,20,42,0.92)'; ctx.fill();

  }
}

function drawHUD(){
  ctx.fillStyle = 'rgba(4,8,18,0.75)';
  ctx.fillRect(0, 0, W, 40);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 16px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('골드 ' + G.gold, 16, 26);
  ctx.fillStyle = '#cfe0ff';
  const _zpHud = zonePattern(); // R23
  const waveTxt = '파도 ' + G.wave + (depthOf(G.wave) > 1 ? ' · 심화 ' + depthOf(G.wave) : '') + (_zpHud ? ' · ' + ZONE_PATTERNS[_zpHud].name : '');
  ctx.fillText(waveTxt, 110, 26);
  const waveW = ctx.measureText(waveTxt).width; // R17: 파도 텍스트가 길어져도 등불 바와 겹치지 않게
  const barX = Math.max(190, 110 + waveW + 12), barW = Math.max(120, 424 - barX);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(barX, 12, barW, 16);
  const hpr = G.coreHp / G.coreMax;
  ctx.fillStyle = hpr > 0.5 ? '#ffd27a' : hpr > 0.25 ? '#ff9a4a' : '#ff5a5a';
  ctx.fillRect(barX, 12, barW * hpr, 16);
  ctx.fillStyle = '#081020';
  ctx.font = 'bold 11px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('등불 ' + Math.ceil(G.coreHp) + ' / ' + G.coreMax, barX + barW/2, 24);
  // 시너지 칩 (R16): 클래스명 + 등급 핍 + 다음 단계 진행
  const cc = classCounts();
  ctx.textAlign = 'left';
  ctx.font = '11px "Noto Sans KR",sans-serif';
  let sx = barX + barW + 12;
  for (const k in CLASSES){
    if (cc[k] === 0) continue;
    const lv = synergyLevel(k), tr = SYNERGY[k].tiers;
    const prog = lv >= 2 ? 'MAX' : cc[k] + '/' + (cc[k] >= tr[0] ? tr[1] : tr[0]);
    const pips = lv === 0 ? '○○' : lv === 1 ? '●○' : '●●';
    const pk = (G.classPerks[k] || []).length; // R22
    const label = CLASSES[k].name + ' ' + pips + ' ' + prog + (pk ? ' ✦' + pk : '');
    const cw = ctx.measureText(label).width + 14;
    if (sx + cw > W - 60){ ctx.fillStyle = 'rgba(140,160,200,0.6)'; ctx.fillText('…', sx, 25); break; }
    const col = CLASSES[k].color;
    ctx.beginPath(); ctx.roundRect(sx, 9, cw, 22, 6);
    ctx.fillStyle = lv > 0 ? 'rgba(12,18,36,0.9)' : 'rgba(10,14,28,0.55)';
    ctx.fill();
    if (lv > 0){ ctx.shadowColor = col; ctx.shadowBlur = 4 + lv * 3; }
    ctx.strokeStyle = lv > 0 ? col : 'rgba(120,140,180,0.35)';
    ctx.lineWidth = lv > 0 ? 1.4 : 1;
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = 1;
    ctx.fillStyle = lv > 0 ? CLASSES[k].light : 'rgba(150,168,205,0.7)';
    ctx.fillText(label, sx + 7, 24);
    sx += cw + 6;
  }
  ctx.fillStyle = 'rgba(140,170,220,0.7)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(G.fps.toFixed(0) + ' FPS', W - 12, 16);
  // 설정 버튼
  ctx.beginPath();
  ctx.roundRect(GEAR_BTN.x, GEAR_BTN.y, GEAR_BTN.w, GEAR_BTN.h, 6);
  ctx.fillStyle = G.settingsOpen ? 'rgba(255,210,74,0.3)' : 'rgba(40,56,96,0.55)';
  ctx.fill();
  ctx.fillStyle = G.settingsOpen ? '#ffd24a' : 'rgba(190,205,235,0.85)';
  ctx.font = '15px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚙', GEAR_BTN.x + GEAR_BTN.w/2, GEAR_BTN.y + 18);
  // 기록판 토글 버튼 (막대 그래프 아이콘)
  ctx.beginPath();
  ctx.roundRect(DASH_BTN.x, DASH_BTN.y, DASH_BTN.w, DASH_BTN.h, 6);
  ctx.fillStyle = G.dash.open ? 'rgba(255,210,74,0.3)' : 'rgba(40,56,96,0.55)';
  ctx.fill();
  ctx.fillStyle = G.dash.open ? '#ffd24a' : 'rgba(190,205,235,0.85)';
  {
    const bx = DASH_BTN.x + DASH_BTN.w/2 - 7, by = DASH_BTN.y + DASH_BTN.h - 7;
    ctx.fillRect(bx, by - 7, 4, 7);
    ctx.fillRect(bx + 5.5, by - 12, 4, 12);
    ctx.fillRect(bx + 11, by - 4.5, 4, 4.5);
  }
  // 위임 모드 버튼
  for (const b of BEHAVE_BTNS){
    const active = G.behavior === b.id && G.control === 'delegate';
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fillStyle = active ? 'rgba(255,210,74,0.25)' : 'rgba(40,56,96,0.55)';
    ctx.fill();
    if (active){
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = active ? '#ffd24a' : 'rgba(190,205,235,0.8)';
    ctx.font = '12px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.name, b.x + b.w/2, b.y + 17);
  }
  // 조종 상태
  if (G.phase === 'combat'){
    ctx.fillStyle = G.control === 'manual' ? '#8fe2ff' : 'rgba(140,170,220,0.7)';
    ctx.font = '11px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(G.control === 'manual' ? '[수동 조종] 스페이스: 위임 복귀' : '[위임 중] 스페이스/드래그: 직접 조종', 16, 60);
  }
  if (G.msgT > 0 && G.phase !== 'over'){
    ctx.globalAlpha = clamp(G.msgT / 0.4, 0, 1);
    ctx.fillStyle = '#ffe9b0';
    ctx.font = 'bold 15px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(G.msg, W/2, G.boss ? 132 : 92);
    ctx.globalAlpha = 1;
  }
  if (G.phase === 'shop'){
    ctx.fillStyle = 'rgba(207,224,255,0.8)';
    ctx.font = '13px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    if (G.autoNext && G.autoTimer > 0)
      ctx.fillText('다음 파도까지 ' + Math.ceil(G.autoTimer) + '초 (스페이스 = 바로 시작)', W/2, SHOP_Y - 46);

      ctx.fillText('준비되면 파도 시작 버튼 또는 스페이스를 누르세요', W/2, SHOP_Y - 46);
  }
  drawRelicBar();
}

function drawShop(){
  ctx.fillStyle = 'rgba(4,8,18,0.85)';
  ctx.fillRect(0, SHOP_Y, W, H - SHOP_Y);
  ctx.strokeStyle = 'rgba(90,130,200,0.3)';
  ctx.beginPath(); ctx.moveTo(0, SHOP_Y); ctx.lineTo(W, SHOP_Y); ctx.stroke();
  // 진형 프리셋 버튼
  for (const f of FORM_BTNS){
    const active = G.formation === f.id;
    ctx.beginPath();
    ctx.roundRect(f.x, f.y, f.w, f.h, 6);
    ctx.fillStyle = active ? 'rgba(255,210,74,0.25)' : 'rgba(40,56,96,0.55)';
    ctx.fill();
    if (active){ ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.fillStyle = active ? '#ffd24a' : 'rgba(190,205,235,0.8)';
    ctx.font = '13px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.name, f.x + f.w/2, f.y + 19);
  }
  ctx.fillStyle = 'rgba(140,160,200,0.6)';
  ctx.font = '11px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('진형', 372, SHOP_Y - 17);
  // 유닛 명단 (개별 행동 지정)
  ctx.textAlign = 'left';
  ctx.font = 'bold 11px "Noto Sans KR",sans-serif';
  ctx.fillStyle = 'rgba(190,205,235,0.8)';
  if (G.units.length > 0) ctx.fillText('수호단 ' + rosterSize() + '/' + unitCap() + ' (클릭: 행동 변경)', 10, 50);
  { // 영웅 관리 열기 (R12)
    ctx.beginPath(); ctx.roundRect(ROSTER_OPEN_BTN.x, ROSTER_OPEN_BTN.y, ROSTER_OPEN_BTN.w, ROSTER_OPEN_BTN.h, 6);
    ctx.fillStyle = 'rgba(44,62,108,0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(120,150,220,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#dfe8ff'; ctx.font = '12px "Noto Sans KR",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('관리', ROSTER_OPEN_BTN.x + ROSTER_OPEN_BTN.w/2, ROSTER_OPEN_BTN.y + ROSTER_OPEN_BTN.h/2 + 4);
    ctx.textAlign = 'left';
  }
  for (const r of rosterRects()){
    const u = G.units[r.i];
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 5);
    ctx.fillStyle = 'rgba(30,42,72,0.85)';
    ctx.fill();
    drawUnitShape(u, r.x + 12, r.y + 11.5, G.time * 0.5, 0.75, 1);
    ctx.fillStyle = '#e8f0ff';
    ctx.font = '11px "Noto Sans KR",sans-serif';
    ctx.fillText(u.name + ' ' + '★'.repeat(u.star), r.x + 24, r.y + 15);
    const actName = UNIT_ACTS.find(a => a.id === u.act).name;
    ctx.fillStyle = u.act === 'form' ? 'rgba(150,170,210,0.7)' : '#8fe2ff';
    ctx.textAlign = 'right';
    ctx.fillText(actName, r.x + r.w - 6, r.y + 15);
    ctx.textAlign = 'left';
  }
  // 카드
  for (let i = 0; i < 5; i++){
    const r = cardRect(i);
    const t = G.shop[i];
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = t ? (G.hoverCard === i ? 'rgba(50,70,120,0.9)' : 'rgba(28,40,70,0.9)') : 'rgba(16,22,40,0.6)';
    ctx.fill();
    if (!t) continue;
    const col = CLASSES[t.cls].color;
    ctx.strokeStyle = col;
    ctx.lineWidth = G.hoverCard === i ? 2.5 : 1.2;
    ctx.stroke();
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 14px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(t.cost + 'G', r.x + 8, r.y + 18);
    ctx.fillStyle = col;
    ctx.textAlign = 'right';
    ctx.font = 'bold 11px "Noto Sans KR",sans-serif';
    ctx.fillText(CLASSES[t.cls].name, r.x + r.w - 8, r.y + 17);
    // 클래스 도형 아이콘
    drawUnitShape({ cls: t.cls }, r.x + r.w/2, r.y + 40, G.time * 0.8, 0.8, 1);
    ctx.fillStyle = '#f0f5ff';
    ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.name, r.x + r.w/2, r.y + 68);
    ctx.fillStyle = 'rgba(190,205,235,0.85)';
    ctx.font = (COARSE ? 11 : 10) + 'px "Noto Sans KR",sans-serif';
    if (t.summon){
      ctx.fillText('소환 ' + t.summon.cd + 's · 피해 ' + t.dmg, r.x + r.w/2, r.y + 83);
    } else if (t.heal){
      ctx.fillText('피해 ' + t.dmg + ' · 회복 ' + t.heal, r.x + r.w/2, r.y + 83);
    } else {
      ctx.fillText('피해 ' + t.dmg + ' · 간격 ' + t.cd + 's', r.x + r.w/2, r.y + 83);
    }
    ctx.fillText('사거리 ' + t.rng + (t.melee ? ' (근접)' : ''), r.x + r.w/2, r.y + 96);
    // 시너지 힌트 (R16): 이 카드를 사면 벌어지는 일
    const hint = synergyHint(t), hc = CLASSES[t.cls];
    let htxt, hcol;
    if (hint.lv1 > hint.lv0){ htxt = '▲ ' + hc.name + (hint.lv1 === 2 ? ' 2단계 발동!' : ' 시너지 발동!'); hcol = hc.light; }
    else if (hint.lv1 < hint.lv0){ htxt = '▼ 합체로 ' + hc.name + ' 해제'; hcol = '#ff9a4a'; }
    else if (hint.merge){ htxt = '합체: ' + hc.name + ' ' + hint.n + '→' + hint.after + '기'; hcol = 'rgba(190,205,235,0.75)'; }
    else if (hint.lv0 >= 2){ htxt = hc.name + ' 시너지 MAX'; hcol = hc.light; }
    else { htxt = hc.name + ' ' + hint.after + '/' + (hint.after < hint.tiers[0] ? hint.tiers[0] : hint.tiers[1]) + (hint.lv0 > 0 ? ' (발동 중)' : ''); hcol = hint.lv0 > 0 ? hc.color : 'rgba(150,170,210,0.7)'; }
    if (hint.lv1 > hint.lv0){ ctx.shadowColor = hc.color; ctx.shadowBlur = 6; }
    ctx.fillStyle = hcol;
    ctx.font = (hint.lv1 > hint.lv0 ? 'bold ' : '') + '10px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(htxt, r.x + r.w/2, r.y + r.h - 6);
    ctx.shadowBlur = 0;
  }
  drawButton(REROLL_BTN, rerollCost() === 0 ? '리롤 무료' : '리롤 ' + rerollCost() + 'G', false);
  drawRelicChoice();
  drawEventChoice(); // R21
  if (!G.relicChoice && !G.event) drawClassChoice(); // R22
  drawButton(START_BTN, '파도 시작 ▶', true);
  drawButton(AUTO_BTN, '자동 진행 ' + (G.autoNext ? 'ON' : 'OFF'), G.autoNext);
}

            '2기와 4기를 채울 때마다 그 클래스의 각성 특성을 하나 고릅니다.'] },
  { icon: '❋', color: '#ffd24a', head: '잔광과 영구 성장',
    lines: ['항해가 끝나도 잔광은 남습니다. 결과 화면에서 영구 업그레이드를 사두면',
            '다음 항해가 더 멀리 갑니다. 업적 보상도 잔광입니다.'] },
  { icon: '◆', color: '#06d6a0', head: '유물과 사건',
    lines: ['보스를 물리치면 유물 3개 중 하나를 고릅니다. 유물끼리 조합 효과도 있습니다.',
            '5·15·25… 정예 파도를 클리어하면 심연의 사건(6종)이 열립니다.'] },
];
function drawHelp(){
  if (!G.helpOpen) return;
  const F = '"Noto Sans KR",sans-serif';
  ctx.fillStyle = 'rgba(2,4,10,0.84)';
  ctx.fillRect(0, 0, W, H);
  const r = { x: W/2 - 330, y: 58, w: 660, h: 524 };
  ctx.beginPath();
  ctx.roundRect(r.x, r.y, r.w, r.h, 14);
  ctx.fillStyle = 'rgba(10,16,34,0.98)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,120,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.lineWidth = 1;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd88a';
  ctx.font = 'bold 20px ' + F;
  ctx.fillText('항해 안내', W/2, r.y + 38);
  let y = r.y + 74;
  for (const s of HELP_SECTIONS){
    ctx.textAlign = 'left';
    ctx.fillStyle = s.color;
    ctx.font = 'bold 14px ' + F;
    ctx.fillText(s.icon + ' ' + s.head, r.x + 26, y);
    ctx.fillStyle = 'rgba(200,214,240,0.88)';
    ctx.font = '12px ' + F;
    y += 19;
    for (const ln of s.lines){
      ctx.fillText(ln, r.x + 26, y);
      y += 17;
    }
    y += 10;
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(120,140,180,0.6)';
  ctx.font = '11px ' + F;
  ctx.fillText('아무 곳이나 누르거나 ESC로 닫기', W/2, r.y + r.h - 16);
}

// ---------- 심연 기록판 (R9 대시보드) ----------
function drawDash(){
  if (!G.dash.open) return;
  dctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  dctx.clearRect(0, 0, W, H);
  const F = '"Noto Sans KR",sans-serif';
  // 배경 + 프레임
  dctx.fillStyle = 'rgba(3,6,16,0.985)'; // R17: HUD 비침 방지
  dctx.fillRect(0, 0, W, H);
  const bg = dctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 640);
  bg.addColorStop(0, 'rgba(40,56,100,0.22)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = bg;
  dctx.fillRect(0, 0, W, H);
  dctx.strokeStyle = 'rgba(255,210,120,0.4)';
  dctx.lineWidth = 1.5;
  dctx.beginPath(); dctx.roundRect(18, 12, W - 36, H - 24, 14); dctx.stroke();
  dctx.lineWidth = 1;
  const panel = (x, y, w, h, title) => {
    dctx.fillStyle = 'rgba(10,16,34,0.88)';
    dctx.beginPath(); dctx.roundRect(x, y, w, h, 10); dctx.fill();
    dctx.strokeStyle = 'rgba(90,120,180,0.35)';
    dctx.stroke();
    dctx.fillStyle = 'rgba(165,185,225,0.85)';
    dctx.font = 'bold 12px ' + F;
    dctx.textAlign = 'left';
    dctx.fillText(title, x + 12, y + 20);
  };
  const empty = (x, y, w, h, msg) => {
    dctx.fillStyle = 'rgba(140,160,200,0.55)';
    dctx.font = '11px ' + F;
    dctx.textAlign = 'center';
    dctx.fillText(msg, x + w/2, y + h/2 + 4);
  };
  const lineGraph = (x, y, w, h, data, color, maxV) => {
    // 격자
    dctx.strokeStyle = 'rgba(90,120,180,0.18)';
    for (let i = 1; i <= 3; i++){
      dctx.beginPath(); dctx.moveTo(x, y + h * i / 4); dctx.lineTo(x + w, y + h * i / 4); dctx.stroke();
    }
    if (data.length < 2){ empty(x, y, w, h, '기록 수집 중…'); return; }
    const mx = maxV || Math.max(1, ...data);
    dctx.beginPath();
    for (let i = 0; i < data.length; i++){
      const px = x + w * i / (119), py = y + h - (data[i] / mx) * (h - 4) - 2;
      i === 0 ? dctx.moveTo(px, py) : dctx.lineTo(px, py);
    }
    dctx.strokeStyle = color;
    dctx.lineWidth = 2;
    dctx.stroke();
    dctx.lineWidth = 1;
    dctx.lineTo(x + w * (data.length - 1) / 119, y + h);
    dctx.lineTo(x, y + h);
    dctx.closePath();
    dctx.globalAlpha = 0.16;
    dctx.fillStyle = color;
    dctx.fill();
    dctx.globalAlpha = 1;
  };
  // 헤더: 탭 + 제목 + 닫기
  for (const [btn, label, idx] of [[DASH_TAB0, '실시간', 0], [DASH_TAB1, '정산', 1], [DASH_TAB2, '기록', 2]]){ // R26
    const on = G.dash.tab === idx;
    dctx.beginPath(); dctx.roundRect(btn.x, btn.y, btn.w, btn.h, 8); 
    dctx.fillStyle = on ? 'rgba(255,210,120,0.22)' : 'rgba(30,42,74,0.7)';
    dctx.fill();
    dctx.strokeStyle = on ? '#ffd88a' : 'rgba(90,120,180,0.4)';
    dctx.stroke();
    dctx.fillStyle = on ? '#ffd88a' : 'rgba(160,180,220,0.75)';
    dctx.font = 'bold 13px ' + F;
    dctx.textAlign = 'center';
    dctx.fillText(label, btn.x + btn.w/2, btn.y + 21);
  }
  dctx.fillStyle = '#ffd88a';
  dctx.font = 'bold 20px ' + F;
  dctx.textAlign = 'left';
  dctx.fillText('심연 기록판', 340, 41);
  dctx.fillStyle = 'rgba(140,160,200,0.6)';
  dctx.font = '11px ' + F;
  dctx.fillText('파도 ' + Math.max(1, G.wave) + ' · 처치 ' + G.stats.kills, 500, 41);
  dctx.beginPath(); dctx.roundRect(DASH_CLOSE.x, DASH_CLOSE.y, DASH_CLOSE.w, DASH_CLOSE.h, 8);
  dctx.fillStyle = 'rgba(90,40,50,0.6)';
  dctx.fill();
  dctx.fillStyle = '#ffb0b0';
  dctx.font = 'bold 15px ' + F;
  dctx.textAlign = 'center';
  dctx.fillText('✕', DASH_CLOSE.x + 20, DASH_CLOSE.y + 22);

  const dmgEntries = Object.entries(G.dmgByCls).filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]);
  const dmgTotal = dmgEntries.reduce((t, [, v]) => t + v, 0);
  const clsName = k => k === 'skill' ? '스킬' : (CLASSES[k] ? CLASSES[k].name : k);
  const clsColor = k => k === 'skill' ? '#c9d6ff' : (CLASSES[k] ? CLASSES[k].color : '#888');

  if (G.dash.tab === 0){
    // ---- 실시간 ----
    // DPS 패널
    panel(40, 64, 360, 252, '초당 피해 (최근 60초)');
    const curDps = G.dpsHist.length ? G.dpsHist[G.dpsHist.length - 1] : 0;
    dctx.fillStyle = '#ffd24a';
    dctx.font = 'bold 34px ' + F;
    dctx.textAlign = 'left';
    dctx.fillText(Math.round(curDps).toLocaleString(), 56, 122);
    dctx.fillStyle = 'rgba(160,180,220,0.7)';
    dctx.font = '11px ' + F;
    dctx.fillText('DPS', 58 + dctx.measureText(Math.round(curDps).toLocaleString()).width + 8, 122);
    lineGraph(56, 140, 328, 156, G.dpsHist, '#ffd24a');
    // 등불 내구 패널
    panel(40, 332, 360, 264, '등불 내구 추이 (최근 60초)');
    dctx.fillStyle = G.coreHp / G.coreMax > 0.35 ? '#6ae28f' : '#ff7a6a';
    dctx.font = 'bold 26px ' + F;
    dctx.fillText(Math.ceil(G.coreHp) + ' / ' + G.coreMax, 56, 386);
    lineGraph(56, 404, 328, 172, G.coreHist, '#6ae28f', G.coreMax);
    // 클래스별 피해량 도넛
    panel(424, 64, 280, 532, '클래스별 피해량 (이번 런)');
    if (dmgTotal <= 0){ empty(424, 64, 280, 532, '아직 가한 피해가 없습니다'); }
    else {
      const cx = 564, cy = 224, R = 88, r2 = 54;
      let a0 = -Math.PI / 2;
      const shown = dmgEntries.slice(0, 6);
      const restV = dmgEntries.slice(6).reduce((t, [, v]) => t + v, 0);
      if (restV > 0) shown.push(['기타', restV]);
      for (const [k, v] of shown){
        const a1 = a0 + TAU * (v / dmgTotal);
        dctx.beginPath();
        dctx.arc(cx, cy, R, a0 + 0.02, a1 - 0.02);
        dctx.arc(cx, cy, r2, a1 - 0.02, a0 + 0.02, true);
        dctx.closePath();
        dctx.fillStyle = k === '기타' ? 'rgba(120,135,165,0.7)' : clsColor(k);
        dctx.fill();
        a0 = a1;
      }
      dctx.fillStyle = '#f0f5ff';
      dctx.font = 'bold 15px ' + F;
      dctx.textAlign = 'center';
      dctx.fillText(Math.round(dmgTotal).toLocaleString(), cx, cy - 2);
      dctx.fillStyle = 'rgba(160,180,220,0.7)';
      dctx.font = '10px ' + F;
      dctx.fillText('총 피해', cx, cy + 14);
      let ly = 348;
      dctx.textAlign = 'left';
      for (const [k, v] of shown){
        dctx.fillStyle = k === '기타' ? 'rgba(120,135,165,0.9)' : clsColor(k);
        dctx.beginPath(); dctx.roundRect(446, ly - 9, 10, 10, 2); dctx.fill();
        dctx.fillStyle = 'rgba(230,238,255,0.9)';
        dctx.font = '11px ' + F;
        dctx.fillText(clsName(k), 462, ly);
        dctx.textAlign = 'right';
        dctx.fillStyle = 'rgba(160,180,220,0.85)';
        dctx.fillText((v / dmgTotal * 100).toFixed(1) + '%', 566, ly);
        dctx.fillStyle = 'rgba(120,140,180,0.75)';
        dctx.font = '10px ' + F;
        dctx.fillText(Math.round(v).toLocaleString(), 686, ly);
        dctx.textAlign = 'left';
        ly += 24;
      }
    }
    // 시너지 노드 그래프
    panel(728, 64, 256, 532, '시너지 노드');
    const cc = classCounts();
    const keys = Object.keys(CLASSES);
    const nx = 856, ny = 320, R2 = 128;
    // 중심 등불 노드
    // 엣지 먼저
    keys.forEach((k, i) => {
      const a = -Math.PI / 2 + i / keys.length * TAU;
      const x2 = nx + Math.cos(a) * R2, y2 = ny + Math.sin(a) * R2;
      const cnt = cc[k] || 0;
      if (cnt <= 0) return;
      const lv = synergyLevel(k);
      dctx.beginPath();
      dctx.moveTo(nx, ny); dctx.lineTo(x2, y2);
      dctx.strokeStyle = CLASSES[k].color;
      dctx.globalAlpha = 0.2 + lv * 0.3;
      dctx.lineWidth = 1 + lv * 2;
      dctx.stroke();
      dctx.globalAlpha = 1; dctx.lineWidth = 1;
    });
    keys.forEach((k, i) => {
      const a = -Math.PI / 2 + i / keys.length * TAU;
      const x2 = nx + Math.cos(a) * R2, y2 = ny + Math.sin(a) * R2;
      const cnt = cc[k] || 0;
      const lv = synergyLevel(k);
      dctx.beginPath(); dctx.arc(x2, y2, 17, 0, TAU);
      dctx.fillStyle = 'rgba(8,12,26,0.95)';
      dctx.fill();
      if (lv > 0){ dctx.shadowColor = CLASSES[k].color; dctx.shadowBlur = 8 + lv * 6; }
      dctx.strokeStyle = cnt > 0 ? CLASSES[k].color : 'rgba(90,110,150,0.45)';
      dctx.lineWidth = 1.2 + lv * 1.4;
      dctx.stroke();
      dctx.shadowBlur = 0; dctx.lineWidth = 1;
      dctx.fillStyle = cnt > 0 ? CLASSES[k].light : 'rgba(120,140,175,0.6)';
      dctx.font = 'bold 12px ' + F;
      dctx.textAlign = 'center';
      dctx.fillText(cnt > 0 ? String(cnt) : '·', x2, y2 + 4);
      // 이름 + 다음 단계 진행
      dctx.fillStyle = cnt > 0 ? 'rgba(220,230,250,0.9)' : 'rgba(120,140,175,0.55)';
      dctx.font = '10px ' + F;
      const label = CLASSES[k].name + (lv >= 2 ? ' MAX' : cnt > 0 ? ' ' + cnt + '/' + (cnt >= SYNERGY[k].tiers[0] ? SYNERGY[k].tiers[1] : SYNERGY[k].tiers[0]) : '');
      dctx.fillText(label, x2, y2 + 32);
    });
    // 중심 등불
    const lg = dctx.createRadialGradient(nx, ny, 4, nx, ny, 34);
    lg.addColorStop(0, 'rgba(255,220,140,0.9)');
    lg.addColorStop(1, 'rgba(255,180,74,0)');
    dctx.fillStyle = lg;
    dctx.fillRect(nx - 34, ny - 34, 68, 68);
    dctx.beginPath(); dctx.arc(nx, ny, 21, 0, TAU);
    dctx.fillStyle = 'rgba(20,26,48,0.95)';
    dctx.fill();
    dctx.strokeStyle = '#ffd24a';
    dctx.lineWidth = 2;
    dctx.stroke();
    dctx.lineWidth = 1;
    dctx.fillStyle = '#ffd88a';
    dctx.font = 'bold 11px ' + F;
    dctx.textAlign = 'center';
    dctx.fillText('등불', nx, ny + 4);
    dctx.fillStyle = 'rgba(140,160,200,0.6)';
    dctx.font = '10px ' + F;
    dctx.fillText('클래스 2/4기 달성 시', nx, 574);
    dctx.fillText('연결선이 밝아집니다', nx, 588);
  } else if (G.dash.tab === 1){
    // ---- 정산 타임라인 ----
    const log = G.waveLog;
    // 요약 칩
    const unitLossTotal = log.reduce((t, w2) => t + w2.unitLoss, 0);
    const chips = [
      ['도달 파도', Math.max(1, G.wave)], ['총 처치', G.stats.kills],
      ['획득 골드', G.stats.earned], ['유닛 손실', unitLossTotal],
    ];
    let chx = 40;
    dctx.font = 'bold 12px ' + F;
    for (const [label, val] of chips){
      const wch = dctx.measureText(label + ' ' + val).width + 34;
      dctx.beginPath(); dctx.roundRect(chx, 62, wch, 34, 8);
      dctx.fillStyle = 'rgba(20,30,58,0.85)';
      dctx.fill();
      dctx.strokeStyle = 'rgba(255,210,120,0.3)';
      dctx.stroke();
      dctx.textAlign = 'left';
      dctx.fillStyle = 'rgba(160,180,220,0.8)';
      dctx.fillText(label, chx + 12, 83);
      dctx.fillStyle = '#ffd88a';
      dctx.fillText(String(val), chx + 12 + dctx.measureText(label + ' ').width, 83);
      chx += wch + 12;
    }
    // 타임라인 패널
    panel(40, 112, 944, 344, '파도별 정산 타임라인');
    if (!log.length){ empty(40, 112, 944, 344, '아직 완료한 파도가 없습니다'); }
    else {
      const gx = 76, gy = 152, gw = 872, gh = 240;
      const n = log.length;
      const slot = gw / n;
      const bw = Math.min(26, slot * 0.62);
      const maxK = Math.max(4, ...log.map(w2 => w2.kills));
      const maxR = Math.max(10, ...log.map(w2 => Math.max(w2.coreDmg, w2.gold)));
      // 격자 + 축
      dctx.strokeStyle = 'rgba(90,120,180,0.18)';
      dctx.textAlign = 'right';
      dctx.font = '9px ' + F;
      for (let i = 0; i <= 4; i++){
        const yy = gy + gh * i / 4;
        dctx.beginPath(); dctx.moveTo(gx, yy); dctx.lineTo(gx + gw, yy); dctx.stroke();
        dctx.fillStyle = 'rgba(120,140,180,0.6)';
        dctx.fillText(Math.round(maxK * (1 - i / 4)), gx - 6, yy + 3);
        dctx.textAlign = 'left';
        dctx.fillText(Math.round(maxR * (1 - i / 4)), gx + gw + 6, yy + 3);
        dctx.textAlign = 'right';
      }
      // 막대: 처치
      log.forEach((w2, i) => {
        const bx = gx + slot * i + (slot - bw) / 2;
        const bh = (w2.kills / maxK) * gh;
        dctx.fillStyle = w2.partial ? 'rgba(127,212,138,0.4)' : 'rgba(127,212,138,0.85)';
        dctx.fillRect(bx, gy + gh - bh, bw, bh);
        if (w2.unitLoss > 0){ // 유닛 손실 마커
          dctx.fillStyle = 'rgba(255,110,120,0.9)';
          dctx.beginPath(); dctx.arc(bx + bw/2, gy + gh - bh - 7, 2.5, 0, TAU); dctx.fill();
        }
        // 파도 번호
        if (n <= 20 || i % 2 === 0){
          dctx.fillStyle = 'rgba(120,140,180,0.7)';
          dctx.font = '9px ' + F;
          dctx.textAlign = 'center';
          dctx.fillText(String(w2.wave), bx + bw/2, gy + gh + 14);
        }
      });
      // 선: 등불 피해 / 골드
      const plotLine = (vals, color) => {
        dctx.beginPath();
        vals.forEach((v, i) => {
          const px = gx + slot * i + slot / 2, py = gy + gh - (v / maxR) * gh;
          i === 0 ? dctx.moveTo(px, py) : dctx.lineTo(px, py);
        });
        dctx.strokeStyle = color;
        dctx.lineWidth = 2;
        dctx.stroke();
        dctx.lineWidth = 1;
      };
      plotLine(log.map(w2 => w2.coreDmg), '#ff6a7a');
      plotLine(log.map(w2 => w2.gold), '#ffd24a');
      // 범례
      const legend = [['처치', 'rgba(127,212,138,0.9)'], ['등불 피해', '#ff6a7a'], ['골드', '#ffd24a'], ['유닛 손실', 'rgba(255,110,120,0.9)']];
      let lx = gx + gw - 300;
      dctx.font = '10px ' + F;
      for (const [label, color] of legend){
        dctx.fillStyle = color;
        dctx.beginPath(); dctx.roundRect(lx, 132, 10, 10, 2); dctx.fill();
        dctx.fillStyle = 'rgba(200,214,240,0.85)';
        dctx.textAlign = 'left';
        dctx.fillText(label, lx + 14, 141);
        lx += 14 + dctx.measureText(label).width + 16;
      }
      dctx.fillStyle = 'rgba(120,140,180,0.6)';
      dctx.font = '9px ' + F;
      dctx.textAlign = 'center';
      dctx.fillText('(불완전 파도는 옅게 표시)', gx + gw/2, gy + gh + 30);
    }
    // 클래스별 피해량 가로 막대
    panel(40, 472, 944, 124, '클래스별 피해량 (이번 런)');
    if (dmgTotal <= 0){ empty(40, 472, 944, 124, '아직 가한 피해가 없습니다'); }
    else {
      const bx = 56, bw2 = 760, by = 512, bh2 = 26;
      let off = 0;
      for (const [k, v] of dmgEntries){
        const wseg = bw2 * (v / dmgTotal);
        dctx.fillStyle = clsColor(k);
        dctx.fillRect(bx + off, by, Math.max(1, wseg - 1), bh2);
        off += wseg;
      }
      dctx.strokeStyle = 'rgba(90,120,180,0.4)';
      dctx.strokeRect(bx, by, bw2, bh2);
      let lx2 = bx, ly2 = 562;
      dctx.font = '10px ' + F;
      dctx.textAlign = 'left';
      for (const [k, v] of dmgEntries.slice(0, 8)){
        const label = clsName(k) + ' ' + (v / dmgTotal * 100).toFixed(0) + '%';
        if (lx2 + dctx.measureText(label).width > bx + bw2 + 120){ lx2 = bx; ly2 += 16; }
        dctx.fillStyle = clsColor(k);
        dctx.beginPath(); dctx.roundRect(lx2, ly2 - 9, 9, 9, 2); dctx.fill();
        dctx.fillStyle = 'rgba(210,220,245,0.9)';
        dctx.fillText(label, lx2 + 13, ly2);
        lx2 += 13 + dctx.measureText(label).width + 18;
      }
      dctx.fillStyle = '#f0f5ff';
      dctx.font = 'bold 12px ' + F;
      dctx.textAlign = 'right';
      dctx.fillText('총 ' + Math.round(dmgTotal).toLocaleString(), 968, 530);
    }
  }
  else if (G.dash.tab === 2){
    // ---- R26: 누적 기록 ----
    const m = G.meta;
    const nUnitsM = Object.keys(m.codex.units || {}).length;
    const nEnemiesM = CODEX_ENEMIES.filter(c => m.codex.enemies[c.kind]).length;
    const nRelicsM = Object.keys(m.codex.relics || {}).length;
    const nAchM = Object.values(m.ach || {}).filter(s => s === 'unlocked' || s === 'claimed').length;

const ROSTER_SORT_BTN = { x: W - 176, y: 18, w: 108, h: 32 };

function setRoster(open){
  G.roster.open = open;
  G.roster.arm = -1;

  if (el && el.style) el.style.display = open ? 'block' : 'none';

function dismissRefund(u){ return Math.max(1, Math.floor(u.cost * Math.pow(2, u.star - 1) / 2)); }
function dismissUnit(idx){
  sfx('dismiss');
  const u = G.units[idx];
  if (!u || u.mote) return;
  const refund = dismissRefund(u);
  G.units.splice(idx, 1);
  G.gold += refund;
  G.roster.arm = -1;
  G.roster.notice = u.name + ' ★' + u.star + ' 해고 — 환급 +' + refund + 'G';
  saveRun();
  drawRoster();
}
function rosterView(){
  const v = [];
  for (let i = 0; i < G.units.length; i++) if (!G.units[i].mote) v.push(i);
  const clsOrd = Object.keys(CLASSES);
  const key = i => {
    const u = G.units[i];
    if (G.roster.sort === 'star') return [-u.star, -u.cost, clsOrd.indexOf(u.cls)];
    if (G.roster.sort === 'cost') return [-u.cost, -u.star, clsOrd.indexOf(u.cls)];
    return [clsOrd.indexOf(u.cls), u.cost, -u.star];
  };
  return v.sort((a, b) => {
    const ka = key(a), kb = key(b);
    for (let j = 0; j < ka.length; j++){ if (ka[j] !== kb[j]) return ka[j] < kb[j] ? -1 : 1; }
    return 0;
  });
}
function rosterRowRect(r){ return { x: 72, y: 72 + r * 35, w: W - 144, h: 30 }; }
function rosterFireRect(row){ return { x: W - 72 - 100, y: row.y + 3, w: 92, h: 24 }; }
function rosterIcon(c2, cls, x, y, r, rot){
  c2.save();
  c2.fillStyle = CLASSES[cls].color;
  c2.shadowColor = CLASSES[cls].color;
  c2.shadowBlur = 8;
  c2.beginPath();
  if (cls === 'cleric'){
    const w = r * 0.38;
    c2.moveTo(x - w, y - r); c2.lineTo(x + w, y - r); c2.lineTo(x + w, y - w);
    c2.lineTo(x + r, y - w); c2.lineTo(x + r, y + w); c2.lineTo(x + w, y + w);
    c2.lineTo(x + w, y + r); c2.lineTo(x - w, y + r); c2.lineTo(x - w, y + w);
    c2.lineTo(x - r, y + w); c2.lineTo(x - r, y - w); c2.lineTo(x - w, y - w);
  } else if (cls === 'assassin'){
    c2.moveTo(x + Math.cos(rot) * r * 1.4, y + Math.sin(rot) * r * 1.4);
    c2.lineTo(x + Math.cos(rot + Math.PI/2) * r * 0.5, y + Math.sin(rot + Math.PI/2) * r * 0.5);
    c2.lineTo(x + Math.cos(rot + Math.PI) * r * 0.85, y + Math.sin(rot + Math.PI) * r * 0.85);
    c2.lineTo(x + Math.cos(rot - Math.PI/2) * r * 0.5, y + Math.sin(rot - Math.PI/2) * r * 0.5);
  } else if (cls === 'summoner' || cls === 'sailor'){
    const pts = cls === 'summoner' ? 5 : 4;
    for (let i = 0; i < pts * 2; i++){
      const a = rot + i * Math.PI / pts, rr = i % 2 === 0 ? r : r * 0.48;
      i === 0 ? c2.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c2.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  } else {
    const sides = cls === 'sword' ? 4 : cls === 'archer' || cls === 'warlock' ? 3 : cls === 'cannon' ? 5 : 6;
    const base = cls === 'guardian' ? r * 1.2 : r;
    const rot2 = cls === 'warlock' ? rot + Math.PI : rot;
    for (let i = 0; i < sides; i++){
      const a = rot2 + i * TAU / sides;
      const rr = sides === 3 ? (i === 0 ? base * 1.15 : base * 0.85) : base;
      i === 0 ? c2.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c2.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  }
  c2.closePath(); c2.fill();
  c2.shadowBlur = 0;
  c2.strokeStyle = 'rgba(5,8,18,0.75)'; c2.lineWidth = 2; c2.stroke();
  c2.restore();
}

rosterCanvas.addEventListener('pointerdown', e => {
  const rect = rosterCanvas.getBoundingClientRect();
  const sc = rect.width / W;
  const p = { x: (e.clientX - rect.left) / sc, y: (e.clientY - rect.top) / sc };
  if (inRect(p, DASH_CLOSE)){ setRoster(false); return; }
  if (inRect(p, ROSTER_SORT_BTN)){
    const i = ROSTER_SORTS.findIndex(m => m.id === G.roster.sort);
    G.roster.sort = ROSTER_SORTS[(i + 1) % ROSTER_SORTS.length].id;
    G.roster.arm = -1;
    drawRoster();
    return;
  }
  const view = rosterView();
  for (let r = 0; r < view.length; r++){
    const idx = view[r], row = rosterRowRect(r), fire = rosterFireRect(row);
    if (inRect(p, fire)){
      if (G.roster.arm === idx) dismissUnit(idx);
      else { G.roster.arm = idx; drawRoster(); }
      return;
    }
    if (inRect(p, row)){
      if (G.roster.arm >= 0){ G.roster.arm = -1; drawRoster(); return; }
      const u = G.units[idx];
      const ai = UNIT_ACTS.findIndex(a => a.id === u.act);
      u.act = UNIT_ACTS[(ai + 1) % UNIT_ACTS.length].id;
      G.roster.notice = u.name + ' 행동: ' + UNIT_ACTS[(ai + 1) % UNIT_ACTS.length].name;
      saveRun();
      drawRoster();
      return;
    }
  }
  if (G.roster.arm >= 0){ G.roster.arm = -1; drawRoster(); }
});

function codexEnemyIcon(kind, x, y, color){
  cctx.save();
  cctx.fillStyle = color;
  cctx.strokeStyle = 'rgba(8,6,20,0.8)';
  cctx.shadowColor = color;
  cctx.shadowBlur = 8;
  if (kind === 'charger'){
    shapePathOn(cctx, x, y, 16, 0, 3);
    cctx.fill(); cctx.stroke();
  } else if (kind === 'spitter'){
    shapePathOn(cctx, x, y, 15, 0.5, 5);
    cctx.fill(); cctx.stroke();
    cctx.shadowBlur = 0;
    cctx.beginPath(); cctx.arc(x, y, 6, 0, TAU);
    cctx.fillStyle = '#0d3a30'; cctx.fill();
  } else if (kind === 'splitter'){
    for (let k = 0; k < 3; k++){
      const a = k / 3 * TAU;
      shapePathOn(cctx, x + Math.cos(a) * 6, y + Math.sin(a) * 6, 9, a, 4);
      cctx.fill(); cctx.stroke();
    }
  } else if (kind === 'shield'){
    shapePathOn(cctx, x, y, 15, 0, 6);
    cctx.fill(); cctx.stroke();
    cctx.shadowBlur = 0;
    cctx.beginPath(); cctx.arc(x, y, 20, -0.7, 0.7);
    cctx.strokeStyle = '#9ab8d8'; cctx.lineWidth = 4; cctx.stroke(); cctx.lineWidth = 1;
  } else if (kind === 'bomber'){
    cctx.beginPath();
    for (let k = 0; k < 16; k++){
      const a = k / 16 * TAU;
      const rr = k % 2 === 0 ? 17 : 10;
      k === 0 ? cctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : cctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cctx.closePath(); cctx.fill(); cctx.stroke();
    cctx.shadowBlur = 0;
    cctx.beginPath(); cctx.arc(x, y, 5, 0, TAU);
    cctx.fillStyle = '#ff5a3c'; cctx.fill();
  } else if (kind === 'cultist' || kind === 'summoner'){
    cctx.beginPath();
    for (let k = 0; k < 8; k++){
      const a = k * Math.PI / 4;
      const rr = k % 2 === 0 ? 17 : 7;
      k === 0 ? cctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : cctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cctx.closePath(); cctx.fill(); cctx.stroke();
  } else if (kind === 'fast' || kind === 'mini'){
    shapePathOn(cctx, x, y, kind === 'mini' ? 10 : 13, 0, 4);
    cctx.fill(); cctx.stroke();
  } else if (kind.indexOf('boss_') === 0){
    const bdef = BOSS_TYPES.find(b => 'boss_' + b.id === kind) || BOSS_TYPES[BOSS_TYPES.length - 1];
    cctx.fillStyle = bdef.dark; cctx.strokeStyle = bdef.color;
    cctx.shadowColor = bdef.color; cctx.shadowBlur = 8;
    if (bdef.pattern === 'ring'){
      shapePathOn(cctx, x, y, 17, 0, 6); cctx.fill(); cctx.stroke();
      cctx.shadowBlur = 0;
      cctx.beginPath(); cctx.arc(x, y, 9, 0, TAU); cctx.stroke();
      cctx.beginPath(); cctx.arc(x, y, 21, 0, TAU); cctx.stroke();
    } else if (bdef.pattern === 'root'){
      cctx.beginPath();
      for (let k = 0; k < 10; k++){
        const a = k / 10 * TAU;
        const rr = k % 2 === 0 ? 19 : 10;
        k === 0 ? cctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : cctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      cctx.closePath(); cctx.fill(); cctx.stroke();
    } else if (bdef.pattern === 'guard'){
      shapePathOn(cctx, x, y, 16, 0, 6); cctx.fill(); cctx.stroke();
      cctx.shadowBlur = 0;
      cctx.fillStyle = bdef.color;
      for (let k = 0; k < 4; k++){
        const a = k / 4 * TAU;
        cctx.fillRect(x + Math.cos(a) * 21 - 3, y + Math.sin(a) * 21 - 5, 6, 10);
      }
    } else if (bdef.pattern === 'charge'){
      shapePathOn(cctx, x, y, 17, 0, 4); cctx.fill(); cctx.stroke();
      cctx.shadowBlur = 0;
      cctx.fillStyle = bdef.color;
      for (let k = 0; k < 4; k++){
        const a = k / 4 * TAU + Math.PI / 4;
        cctx.beginPath();
        cctx.moveTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14);
        cctx.lineTo(x + Math.cos(a) * 24, y + Math.sin(a) * 24);
        cctx.lineTo(x + Math.cos(a + 0.3) * 14, y + Math.sin(a + 0.3) * 14);
        cctx.closePath(); cctx.fill();
      }
    } else {
      shapePathOn(cctx, x, y, 19, 0, 6); cctx.fill(); cctx.stroke();
      cctx.shadowBlur = 0;
      cctx.fillStyle = '#ffd24a';
      for (let k = -1; k <= 1; k++){
        cctx.beginPath();
        cctx.moveTo(x + k * 10 - 4, y - 20);
        cctx.lineTo(x + k * 10, y - 30);
        cctx.lineTo(x + k * 10 + 4, y - 20);
        cctx.closePath(); cctx.fill();
      }
    }
    cctx.shadowBlur = 0;
  } else if (kind === 'tank' || kind === 'boss'){
    shapePathOn(cctx, x, y, kind === 'boss' ? 19 : 16, 0, 6);
    cctx.fill(); cctx.stroke();
    if (kind === 'boss'){
      cctx.shadowBlur = 0;
      cctx.fillStyle = '#ffd24a';
      for (let k = -1; k <= 1; k++){
        cctx.beginPath();
        cctx.moveTo(x + k * 10 - 4, y - 20);
        cctx.lineTo(x + k * 10, y - 30);
        cctx.lineTo(x + k * 10 + 4, y - 20);
        cctx.closePath(); cctx.fill();
      }
    }
  } else {
    // mob 등
    cctx.beginPath(); cctx.roundRect(x - 12, y - 12, 24, 24, 5);
    cctx.fill(); cctx.stroke();
  }
  cctx.restore();
}

function setCodex(open, tab){
  G.codex.open = open;
  if (tab !== undefined) G.codex.tab = tab;
  const el = document.getElementById('codex');
  if (el && el.style) el.style.display = open ? 'block' : 'none';
  if (open){
    if (G.dash.open) setDash(false);
    if (G.roster.open) setRoster(false);
    drawCodex();
  }
}
function setDash(open, tab){
  G.dash.open = open;
  if (tab !== undefined) G.dash.tab = tab;
  const el = document.getElementById('dash');
  if (el && el.style) el.style.display = open ? 'block' : 'none';
  if (open){
    if (G.codex.open) setCodex(false);
    if (G.roster.open) setRoster(false);
    drawDash();
  }
}

function drawOver(){
  // 잔불이 꺼져가는 어둠
  ctx.fillStyle = 'rgba(2,3,10,0.82)';
  ctx.fillRect(-20, -20, W + 40, H + 40);
  const L = G.leader;
  const glowR = 90 + Math.sin(G.time * 2) * 10;
  const g = ctx.createRadialGradient(L.x, L.y, 10, L.x, L.y, glowR);
  g.addColorStop(0, 'rgba(255,180,74,0.28)');
  g.addColorStop(1, 'rgba(255,180,74,0)');
  ctx.fillStyle = g;
  ctx.fillRect(L.x - glowR, L.y - glowR, glowR * 2, glowR * 2);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb44a';
  ctx.font = 'bold 30px "Noto Sans KR",sans-serif';
  ctx.fillText('등불이 꺼졌습니다', W/2, 104);
  ctx.fillStyle = 'rgba(207,224,255,0.85)';
  ctx.font = '14px "Noto Sans KR",sans-serif';
  const _wvStr = '파도 ' + G.wave + (depthOf(G.wave) > 1 ? ' (심화 ' + depthOf(G.wave) + '단계)' : '') + ' · 처치 ' + G.stats.kills + ' · 횟수 ' + G.meta.totalRuns + '회';
  ctx.fillText(_wvStr, W/2, 134);
  if (G.newBest){ // R29: 신기록 배지
    const _wvW = ctx.measureText(_wvStr).width;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,210,74,' + (0.72 + 0.28 * Math.sin(G.time * 4)).toFixed(3) + ')';
    ctx.font = 'bold 14px "Noto Sans KR",sans-serif';
    ctx.fillText('  ✦ 새 기록!', W/2 + _wvW/2, 134);
    ctx.textAlign = 'center';
  }
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 16px "Noto Sans KR",sans-serif';
  ctx.fillText('잔광 +' + G.lastGain + '   (보유 잔광 ' + G.meta.glimmer + ')', W/2, 166);
  ctx.fillStyle = 'rgba(140,160,200,0.75)';
  ctx.font = '12px "Noto Sans KR",sans-serif';
  ctx.fillText('영구 강화 - 잔광으로 다음 점화를 밝히세요', W/2, 196);

  for (let i = 0; i < REBIRTH_UPGRADES.length; i++){
    const u = REBIRTH_UPGRADES[i], r = rbRect(i);
    const t = up(u.id);
    const maxed = t >= u.max;
    const cost = maxed ? 0 : u.costs[t];
    const afford = !maxed && G.meta.glimmer >= cost;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = maxed ? 'rgba(24,34,60,0.85)' : afford ? 'rgba(44,60,100,0.92)' : 'rgba(20,28,50,0.85)';
    ctx.fill();
    ctx.strokeStyle = maxed ? 'rgba(90,110,150,0.4)' : afford ? '#ffd24a' : 'rgba(90,110,150,0.5)';
    ctx.lineWidth = afford ? 1.8 : 1.1;
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? 'rgba(160,175,205,0.8)' : '#f0f5ff';
    ctx.font = 'bold 12px "Noto Sans KR",sans-serif';
    ctx.fillText(u.name, r.x + 10, r.y + 20);
    // 단계 핍
    ctx.textAlign = 'right';
    let pips = '';
    for (let k = 0; k < u.max; k++) pips += k < t ? '●' : '○';
    ctx.fillStyle = '#ffd24a';
    ctx.font = '10px "Noto Sans KR",sans-serif';
    ctx.fillText(pips, r.x + r.w - 10, r.y + 20);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(190,205,235,0.85)';
    ctx.font = '10px "Noto Sans KR",sans-serif';
    ctx.fillText(u.desc, r.x + 10, r.y + 38);
    ctx.fillStyle = maxed ? 'rgba(140,160,200,0.6)' : afford ? '#ffd24a' : 'rgba(255,120,120,0.85)';
    ctx.font = 'bold 11px "Noto Sans KR",sans-serif';
    ctx.fillText(maxed ? 'MAX' : '잔광 ' + cost, r.x + 10, r.y + 56);
  }

  if (G.msgT > 0){
    ctx.globalAlpha = clamp(G.msgT / 0.4, 0, 1);
    ctx.fillStyle = '#ffe9b0';
    ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(G.msg, W/2, 452);
    ctx.globalAlpha = 1;
  }
  drawButton(OVER_BTN, '다시 점화', true);
  ctx.beginPath();
  ctx.roundRect(DASH_OVER_BTN.x, DASH_OVER_BTN.y, DASH_OVER_BTN.w, DASH_OVER_BTN.h, 10);
  ctx.fillStyle = 'rgba(40,56,96,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,120,0.5)';
  ctx.stroke();
  ctx.fillStyle = '#ffd88a';
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('정산 보기', DASH_OVER_BTN.x + DASH_OVER_BTN.w/2, DASH_OVER_BTN.y + 31);
  ctx.beginPath();
  ctx.roundRect(CODEX_OVER_BTN.x, CODEX_OVER_BTN.y, CODEX_OVER_BTN.w, CODEX_OVER_BTN.h, 10);
  ctx.fillStyle = 'rgba(40,56,96,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,120,0.5)';
  ctx.stroke();
  ctx.fillStyle = '#ffd88a';
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('도감 · 업적', CODEX_OVER_BTN.x + CODEX_OVER_BTN.w/2, CODEX_OVER_BTN.y + 31);
  // 기록 초기화 (2단계 확인)
  ctx.beginPath();
  ctx.roundRect(RESET_BTN.x, RESET_BTN.y, RESET_BTN.w, RESET_BTN.h, 6);
  ctx.fillStyle = G.resetConfirmT > 0 ? 'rgba(160,40,40,0.55)' : 'rgba(30,40,70,0.6)';
  ctx.fill();
  ctx.fillStyle = G.resetConfirmT > 0 ? '#ffb0b0' : 'rgba(150,170,210,0.65)';
  ctx.font = '11px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(G.resetConfirmT > 0 ? '정말 초기화? 다시 클릭' : '기록 초기화', RESET_BTN.x + RESET_BTN.w/2, RESET_BTN.y + 18);
}

// ---------- 메인 루프 ----------
let lastT = performance.now();
let fpsWall = performance.now(), fpsFrames = 0;
function loop(now){
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  fpsFrames++;
  if (now - fpsWall >= 500){ G.fps = fpsFrames * 1000 / (now - fpsWall); fpsFrames = 0; fpsWall = now; }
  if (SPEED > 1) dt *= SPEED;
  if (G.hitstop > 0){ G.hitstop -= dt; draw(); requestAnimationFrame(loop); return; }
  if (G.slowmo > 0){ G.slowmo -= dt; G.abAmt = Math.max(G.abAmt, 0.7); dt *= 0.22; } // 슬로모션
  if (G.settingsOpen){ draw(); requestAnimationFrame(loop); return; } // 설정 열린 동안 일시정지
  G.abAmt = Math.max(0, G.abAmt - dt * 1.4);
  G.time += dt;
  updateEnv(dt);
  G.trauma = Math.max(0, G.trauma - dt * 1.6);
  if (G.msgT > 0) G.msgT -= dt;
  // R29: 등불 위기 - 심장박동 (체력 30% 이하 전투 중)
  if (G.phase === 'combat' && G.coreHp > 0 && G.coreHp / G.coreMax <= 0.3){
    G.dangerT -= dt;
    if (G.dangerT <= 0){
      G.dangerT = G.coreHp / G.coreMax <= 0.15 ? 0.85 : 1.15;
      sfx('heartbeat');
    }
  } else { G.dangerT = 0; }
  if (G.phase === 'combat' || G.phase === 'shop'){
    updateLeader(dt);
    updateUnits(dt);
  }
  if (G.phase === 'combat') updateCombat(dt);
  if (G.phase === 'combat' || G.phase === 'shop'){
    for (const sk of G.skills) if (sk.t > 0) sk.t = Math.max(0, sk.t - dt);
  }
  for (let i = G.slowFields.length - 1; i >= 0; i--){
    const f = G.slowFields[i]; f.life -= dt;
    if (f.life <= 0){ G.slowFields.splice(i, 1); continue; }
    if (G.settings.quality && G.particles.length < pCap() && Math.random() < 0.6){ // R19: 소용돌이 입자
      const sa = rand(0, TAU);
      G.particles.push(mkP(f.x + Math.cos(sa) * f.r * 0.92, f.y + Math.sin(sa) * f.r * 0.92,
        -Math.sin(sa) * 60, Math.cos(sa) * 60, rand(0.3, 0.55), '#8fe2ff', rand(1.6, 2.6)));
    }
  }
  for (let i = G.skillFx.length - 1; i >= 0; i--){
    const f = G.skillFx[i]; f.life -= dt;
    if (f.life <= 0) G.skillFx.splice(i, 1);
  }
  if (G.phase === 'shop' && G.autoTimer > 0){
    G.autoTimer -= dt;
    if (G.autoTimer <= 0) startWave();
  }
  if (G.resetConfirmT > 0) G.resetConfirmT -= dt;
  if (G.phase === 'combat'){
    G.dashT -= dt;
    if (G.dashT <= 0){
      G.dashT = 0.5;
      G.dpsHist.push(G.dmgAcc * 2); G.dmgAcc = 0;
      if (G.dpsHist.length > 120) G.dpsHist.shift();
      G.coreHist.push(G.coreHp);
      if (G.coreHist.length > 120) G.coreHist.shift();
    }
  }
  if (G.dash.open){
    G.dashDrawT -= dt;
    if (G.dashDrawT <= 0){ G.dashDrawT = 0.12; drawDash(); }
  } else if (G.codex.open){
    G.dashDrawT -= dt;
    if (G.dashDrawT <= 0){ G.dashDrawT = 0.4; drawCodex(); }
  }
  G.saveT += dt;
  if (G.saveT > 10){
    G.saveT = 0;
    saveRun();
    saveMeta();
  }
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.01, dt); p.vy *= Math.pow(0.01, dt);
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.dmgNums.length - 1; i >= 0; i--){
    const d = G.dmgNums[i];
    d.life -= dt; d.y -= 30 * dt;
    if (d.life <= 0) G.dmgNums.splice(i, 1);
  }
  for (let i = G.deathRings.length - 1; i >= 0; i--){
    const r = G.deathRings[i];
    r.life -= dt;
    if (r.life <= 0) G.deathRings.splice(i, 1);
  }
  for (let i = G.debris.length - 1; i >= 0; i--){
    const d = G.debris[i];
    d.life -= dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 340 * dt; // 중력
    d.vx *= Math.pow(0.2, dt);
    d.rot += d.vr * dt;
    if (d.life <= 0) G.debris.splice(i, 1);
  }
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('pagehide', () => { saveRun(); saveMeta(); });
loadSettings();
loadMeta();
G.savedRun = loadSavedRun();
requestAnimationFrame(loop);

// ---------- 자동 부팅 테스트 (?autotest=1) ----------
let SPEED = 1;
if (location.search.indexOf('autotest') >= 0){
  const m = location.search.match(/speed=(\d+)/);
  if (m) SPEED = Math.min(8, parseInt(m[1], 10) || 1);
  window.__G = G;
  setTimeout(() => {
    newRun();
    const wm = location.search.match(/wave=(\d+)/);
    if (wm){ G.wave = Math.max(0, parseInt(wm[1], 10) || 0); G.gold = 500; }
    let placed = 0;
    for (let guard = 0; guard < 12 && placed < 3; guard++){
      let bi = -1, bc = 99;
      for (let i = 0; i < 5; i++){ const t = G.shop[i]; if (t && t.cost < bc && t.cost <= G.gold){ bc = t.cost; bi = i; } }
      if (bi < 0) break;
      buyCard(bi);
      placed++;
    }
    startWave();
  }, 300);
}
