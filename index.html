// ---------- 심연 기록판 (R9 대시보드) ----------
function drawDash(){
  if (!G.dash.open) return;
  dctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  dctx.clearRect(0, 0, W, H);
  const F = '"Noto Sans KR",sans-serif';
  // 배경 + 프레임
  dctx.fillStyle = 'rgba(3,6,16,0.93)';
  dctx.fillRect(0, 0, W, H);
  const bg = dctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 640);
  bg.addColorStop(0, 'rgba(40,56,100,0.22)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = bg;
  dctx.fillRect(0, 0, W, H);
  dctx.strokeStyle = 'rgba(255,210,120,0.4)';
  dctx.lineWidth = 1.5;
  dctx.beginPath(); dctx.roundRect(18, 12, W - 36, H - 24, 14); dctx.stroke();
  dctx.lineWidth = 1;
  const panel = (x, y, w, h, title) => {
    dctx.fillStyle = 'rgba(10,16,34,0.88)';
    dctx.beginPath(); dctx.roundRect(x, y, w, h, 10); dctx.fill();
    dctx.strokeStyle = 'rgba(90,120,180,0.35)';
    dctx.stroke();
    dctx.fillStyle = 'rgba(165,185,225,0.85)';
    dctx.font = 'bold 12px ' + F;
    dctx.textAlign = 'left';
    dctx.fillText(title, x + 12, y + 20);
  };
  const empty = (x, y, w, h, msg) => {
    dctx.fillStyle = 'rgba(140,160,200,0.55)';
    dctx.font = '11px ' + F;
    dctx.textAlign = 'center';
    dctx.fillText(msg, x + w/2, y + h/2 + 4);
  };
  const lineGraph = (x, y, w, h, data, color, maxV) => {
    // 격자
    dctx.strokeStyle = 'rgba(90,120,180,0.18)';
    for (let i = 1; i <= 3; i++){
      dctx.beginPath(); dctx.moveTo(x, y + h * i / 4); dctx.lineTo(x + w, y + h * i / 4); dctx.stroke();
    }
    if (data.length < 2){ empty(x, y, w, h, '기록 수집 중…'); return; }
    const mx = maxV || Math.max(1, ...data);
    dctx.beginPath();
    for (let i = 0; i < data.length; i++){
      const px = x + w * i / (119), py = y + h - (data[i] / mx) * (h - 4) - 2;
      i === 0 ? dctx.moveTo(px, py) : dctx.lineTo(px, py);
    }
    dctx.strokeStyle = color;
    dctx.lineWidth = 2;
    dctx.stroke();
    dctx.lineWidth = 1;
    dctx.lineTo(x + w * (data.length - 1) / 119, y + h);
    dctx.lineTo(x, y + h);
    dctx.closePath();
    dctx.globalAlpha = 0.16;
    dctx.fillStyle = color;
    dctx.fill();
    dctx.globalAlpha = 1;
  };
  // 헤더: 탭 + 제목 + 닫기
  for (const [btn, label, idx] of [[DASH_TAB0, '실시간', 0], [DASH_TAB1, '정산', 1]]){
    const on = G.dash.tab === idx;
    dctx.beginPath(); dctx.roundRect(btn.x, btn.y, btn.w, btn.h, 8); 
    dctx.fillStyle = on ? 'rgba(255,210,120,0.22)' : 'rgba(30,42,74,0.7)';
    dctx.fill();
    dctx.strokeStyle = on ? '#ffd88a' : 'rgba(90,120,180,0.4)';
    dctx.stroke();
    dctx.fillStyle = on ? '#ffd88a' : 'rgba(160,180,220,0.75)';
    dctx.font = 'bold 13px ' + F;
    dctx.textAlign = 'center';
    dctx.fillText(label, btn.x + btn.w/2, btn.y + 21);
  }
  dctx.fillStyle = '#ffd88a';
  dctx.font = 'bold 20px ' + F;
  dctx.textAlign = 'left';
  dctx.fillText('심연 기록판', 240, 41);
  dctx.fillStyle = 'rgba(140,160,200,0.6)';
  dctx.font = '11px ' + F;
  dctx.fillText('파도 ' + Math.max(1, G.wave) + ' · 처치 ' + G.stats.kills, 380, 41);
  dctx.beginPath(); dctx.roundRect(DASH_CLOSE.x, DASH_CLOSE.y, DASH_CLOSE.w, DASH_CLOSE.h, 8);
  dctx.fillStyle = 'rgba(90,40,50,0.6)';
  dctx.fill();
  dctx.fillStyle = '#ffb0b0';
  dctx.font = 'bold 15px ' + F;
  dctx.textAlign = 'center';
  dctx.fillText('✕', DASH_CLOSE.x + 20, DASH_CLOSE.y + 22);

  const dmgEntries = Object.entries(G.dmgByCls).filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]);
  const dmgTotal = dmgEntries.reduce((t, [, v]) => t + v, 0);
  const clsName = k => k === 'skill' ? '스킬' : (CLASSES[k] ? CLASSES[k].name : k);
  const clsColor = k => k === 'skill' ? '#c9d6ff' : (CLASSES[k] ? CLASSES[k].color : '#888');

  if (G.dash.tab === 0){
    // ---- 실시간 ----
    // DPS 패널
    panel(40, 64, 360, 252, '초당 피해 (최근 60초)');
    const curDps = G.dpsHist.length ? G.dpsHist[G.dpsHist.length - 1] : 0;
    dctx.fillStyle = '#ffd24a';
    dctx.font = 'bold 34px ' + F;
    dctx.textAlign = 'left';
    dctx.fillText(Math.round(curDps).toLocaleString(), 56, 122);
    dctx.fillStyle = 'rgba(160,180,220,0.7)';
    dctx.font = '11px ' + F;
    dctx.fillText('DPS', 58 + dctx.measureText(Math.round(curDps).toLocaleString()).width + 8, 122);
    lineGraph(56, 140, 328, 156, G.dpsHist, '#ffd24a');
    // 등불 내구 패널
    panel(40, 332, 360, 264, '등불 내구 추이 (최근 60초)');
    dctx.fillStyle = G.coreHp / G.coreMax > 0.35 ? '#6ae28f' : '#ff7a6a';
    dctx.font = 'bold 26px ' + F;
    dctx.fillText(Math.ceil(G.coreHp) + ' / ' + G.coreMax, 56, 386);
    lineGraph(56, 404, 328, 172, G.coreHist, '#6ae28f', G.coreMax);
    // 클래스별 피해량 도넛
    panel(424, 64, 280, 532, '클래스별 피해량 (이번 런)');
    if (dmgTotal <= 0){ empty(424, 64, 280, 532, '아직 가한 피해가 없습니다'); }
    else {
      const cx = 564, cy = 224, R = 88, r2 = 54;
      let a0 = -Math.PI / 2;
      const shown = dmgEntries.slice(0, 6);
      const restV = dmgEntries.slice(6).reduce((t, [, v]) => t + v, 0);
      if (restV > 0) shown.push(['기타', restV]);
      for (const [k, v] of shown){
        const a1 = a0 + TAU * (v / dmgTotal);
        dctx.beginPath();
        dctx.arc(cx, cy, R, a0 + 0.02, a1 - 0.02);
        dctx.arc(cx, cy, r2, a1 - 0.02, a0 + 0.02, true);
        dctx.closePath();
        dctx.fillStyle = k === '기타' ? 'rgba(120,135,165,0.7)' : clsColor(k);
        dctx.fill();
        a0 = a1;
      }
      dctx.fillStyle = '#f0f5ff';
      dctx.font = 'bold 15px ' + F;
      dctx.textAlign = 'center';
      dctx.fillText(Math.round(dmgTotal).toLocaleString(), cx, cy - 2);
      dctx.fillStyle = 'rgba(160,180,220,0.7)';
      dctx.font = '10px ' + F;
      dctx.fillText('총 피해', cx, cy + 14);
      let ly = 348;
      dctx.textAlign = 'left';
      for (const [k, v] of shown){
        dctx.fillStyle = k === '기타' ? 'rgba(120,135,165,0.9)' : clsColor(k);
        dctx.beginPath(); dctx.roundRect(446, ly - 9, 10, 10, 2); dctx.fill();
        dctx.fillStyle = 'rgba(230,238,255,0.9)';
        dctx.font = '11px ' + F;
        dctx.fillText(clsName(k), 462, ly);
        dctx.textAlign = 'right';
        dctx.fillStyle = 'rgba(160,180,220,0.85)';
        dctx.fillText((v / dmgTotal * 100).toFixed(1) + '%', 566, ly);
        dctx.fillStyle = 'rgba(120,140,180,0.75)';
        dctx.font = '10px ' + F;
        dctx.fillText(Math.round(v).toLocaleString(), 686, ly);
        dctx.textAlign = 'left';
        ly += 24;
      }
    }
    // 시너지 노드 그래프
    panel(728, 64, 256, 532, '시너지 노드');
    const cc = classCounts();
    const keys = Object.keys(CLASSES);
    const nx = 856, ny = 320, R2 = 128;
    // 중심 등불 노드
    // 엣지 먼저
    keys.forEach((k, i) => {
      const a = -Math.PI / 2 + i / keys.length * TAU;
      const x2 = nx + Math.cos(a) * R2, y2 = ny + Math.sin(a) * R2;
      const cnt = cc[k] || 0;
      if (cnt <= 0) return;
      const lv = synergyLevel(k);
      dctx.beginPath();
      dctx.moveTo(nx, ny); dctx.lineTo(x2, y2);
      dctx.strokeStyle = CLASSES[k].color;
      dctx.globalAlpha = 0.2 + lv * 0.3;
      dctx.lineWidth = 1 + lv * 2;
      dctx.stroke();
      dctx.globalAlpha = 1; dctx.lineWidth = 1;
    });
    keys.forEach((k, i) => {
      const a = -Math.PI / 2 + i / keys.length * TAU;
      const x2 = nx + Math.cos(a) * R2, y2 = ny + Math.sin(a) * R2;
      const cnt = cc[k] || 0;
      const lv = synergyLevel(k);
      dctx.beginPath(); dctx.arc(x2, y2, 17, 0, TAU);
      dctx.fillStyle = 'rgba(8,12,26,0.95)';
      dctx.fill();
      if (lv > 0){ dctx.shadowColor = CLASSES[k].color; dctx.shadowBlur = 8 + lv * 6; }
      dctx.strokeStyle = cnt > 0 ? CLASSES[k].color : 'rgba(90,110,150,0.45)';
      dctx.lineWidth = 1.2 + lv * 1.4;
      dctx.stroke();
      dctx.shadowBlur = 0; dctx.lineWidth = 1;
      dctx.fillStyle = cnt > 0 ? CLASSES[k].light : 'rgba(120,140,175,0.6)';
      dctx.font = 'bold 12px ' + F;
      dctx.textAlign = 'center';
      dctx.fillText(cnt > 0 ? String(cnt) : '·', x2, y2 + 4);
      // 이름 + 다음 단계 진행
      dctx.fillStyle = cnt > 0 ? 'rgba(220,230,250,0.9)' : 'rgba(120,140,175,0.55)';
      dctx.font = '10px ' + F;
      const label = CLASSES[k].name + (lv >= 2 ? ' MAX' : cnt > 0 ? ' ' + cnt + '/' + (cnt >= SYNERGY[k].tiers[0] ? SYNERGY[k].tiers[1] : SYNERGY[k].tiers[0]) : '');
      dctx.fillText(label, x2, y2 + 32);
    });
    // 중심 등불
    const lg = dctx.createRadialGradient(nx, ny, 4, nx, ny, 34);
    lg.addColorStop(0, 'rgba(255,220,140,0.9)');
    lg.addColorStop(1, 'rgba(255,180,74,0)');
    dctx.fillStyle = lg;
    dctx.fillRect(nx - 34, ny - 34, 68, 68);
    dctx.beginPath(); dctx.arc(nx, ny, 21, 0, TAU);
    dctx.fillStyle = 'rgba(20,26,48,0.95)';
    dctx.fill();
    dctx.strokeStyle = '#ffd24a';
    dctx.lineWidth = 2;
    dctx.stroke();
    dctx.lineWidth = 1;
    dctx.fillStyle = '#ffd88a';
    dctx.font = 'bold 11px ' + F;
    dctx.textAlign = 'center';
    dctx.fillText('등불', nx, ny + 4);
    dctx.fillStyle = 'rgba(140,160,200,0.6)';
    dctx.font = '10px ' + F;
    dctx.fillText('클래스 2/4기 달성 시', nx, 574);
    dctx.fillText('연결선이 밝아집니다', nx, 588);
  } else {
    // ---- 정산 타임라인 ----
    const log = G.waveLog;
    // 요약 칩
    const unitLossTotal = log.reduce((t, w2) => t + w2.unitLoss, 0);
    const chips = [
      ['도달 파도', Math.max(1, G.wave)], ['총 처치', G.stats.kills],
      ['획득 골드', G.stats.earned], ['유닛 손실', unitLossTotal],
    ];
    let chx = 40;
    dctx.font = 'bold 12px ' + F;
    for (const [label, val] of chips){
      const wch = dctx.measureText(label + ' ' + val).width + 34;
      dctx.beginPath(); dctx.roundRect(chx, 62, wch, 34, 8);
      dctx.fillStyle = 'rgba(20,30,58,0.85)';
      dctx.fill();
      dctx.strokeStyle = 'rgba(255,210,120,0.3)';
      dctx.stroke();
      dctx.textAlign = 'left';
      dctx.fillStyle = 'rgba(160,180,220,0.8)';
      dctx.fillText(label, chx + 12, 83);
      dctx.fillStyle = '#ffd88a';
      dctx.fillText(String(val), chx + 12 + dctx.measureText(label + ' ').width, 83);
      chx += wch + 12;
    }
    // 타임라인 패널
    panel(40, 112, 944, 344, '파도별 정산 타임라인');
    if (!log.length){ empty(40, 112, 944, 344, '아직 완료한 파도가 없습니다'); }
    else {
      const gx = 76, gy = 152, gw = 872, gh = 240;
      const n = log.length;
      const slot = gw / n;
      const bw = Math.min(26, slot * 0.62);
      const maxK = Math.max(4, ...log.map(w2 => w2.kills));
      const maxR = Math.max(10, ...log.map(w2 => Math.max(w2.coreDmg, w2.gold)));
      // 격자 + 축
      dctx.strokeStyle = 'rgba(90,120,180,0.18)';
      dctx.textAlign = 'right';
      dctx.font = '9px ' + F;
      for (let i = 0; i <= 4; i++){
        const yy = gy + gh * i / 4;
        dctx.beginPath(); dctx.moveTo(gx, yy); dctx.lineTo(gx + gw, yy); dctx.stroke();
        dctx.fillStyle = 'rgba(120,140,180,0.6)';
        dctx.fillText(Math.round(maxK * (1 - i / 4)), gx - 6, yy + 3);
        dctx.textAlign = 'left';
        dctx.fillText(Math.round(maxR * (1 - i / 4)), gx + gw + 6, yy + 3);
        dctx.textAlign = 'right';
      }
      // 막대: 처치
      log.forEach((w2, i) => {
        const bx = gx + slot * i + (slot - bw) / 2;
        const bh = (w2.kills / maxK) * gh;
        dctx.fillStyle = w2.partial ? 'rgba(127,212,138,0.4)' : 'rgba(127,212,138,0.85)';
        dctx.fillRect(bx, gy + gh - bh, bw, bh);
        if (w2.unitLoss > 0){ // 유닛 손실 마커
          dctx.fillStyle = 'rgba(255,110,120,0.9)';
          dctx.beginPath(); dctx.arc(bx + bw/2, gy + gh - bh - 7, 2.5, 0, TAU); dctx.fill();
        }
        // 파도 번호
        if (n <= 20 || i % 2 === 0){
          dctx.fillStyle = 'rgba(120,140,180,0.7)';
          dctx.font = '9px ' + F;
          dctx.textAlign = 'center';
          dctx.fillText(String(w2.wave), bx + bw/2, gy + gh + 14);
        }
      });
      // 선: 등불 피해 / 골드
      const plotLine = (vals, color) => {
        dctx.beginPath();
        vals.forEach((v, i) => {
          const px = gx + slot * i + slot / 2, py = gy + gh - (v / maxR) * gh;
          i === 0 ? dctx.moveTo(px, py) : dctx.lineTo(px, py);
        });
        dctx.strokeStyle = color;
        dctx.lineWidth = 2;
        dctx.stroke();
        dctx.lineWidth = 1;
      };
      plotLine(log.map(w2 => w2.coreDmg), '#ff6a7a');
      plotLine(log.map(w2 => w2.gold), '#ffd24a');
      // 범례
      const legend = [['처치', 'rgba(127,212,138,0.9)'], ['등불 피해', '#ff6a7a'], ['골드', '#ffd24a'], ['유닛 손실', 'rgba(255,110,120,0.9)']];
      let lx = gx + gw - 300;
      dctx.font = '10px ' + F;
      for (const [label, color] of legend){
        dctx.fillStyle = color;
        dctx.beginPath(); dctx.roundRect(lx, 132, 10, 10, 2); dctx.fill();
        dctx.fillStyle = 'rgba(200,214,240,0.85)';
        dctx.textAlign = 'left';
        dctx.fillText(label, lx + 14, 141);
        lx += 14 + dctx.measureText(label).width + 16;
      }
      dctx.fillStyle = 'rgba(120,140,180,0.6)';
      dctx.font = '9px ' + F;
      dctx.textAlign = 'center';
      dctx.fillText('(불완전 파도는 옅게 표시)', gx + gw/2, gy + gh + 30);
    }
    // 클래스별 피해량 가로 막대
    panel(40, 472, 944, 124, '클래스별 피해량 (이번 런)');
    if (dmgTotal <= 0){ empty(40, 472, 944, 124, '아직 가한 피해가 없습니다'); }
    else {
      const bx = 56, bw2 = 760, by = 512, bh2 = 26;
      let off = 0;
      for (const [k, v] of dmgEntries){
        const wseg = bw2 * (v / dmgTotal);
        dctx.fillStyle = clsColor(k);
        dctx.fillRect(bx + off, by, Math.max(1, wseg - 1), bh2);
        off += wseg;
      }
      dctx.strokeStyle = 'rgba(90,120,180,0.4)';
      dctx.strokeRect(bx, by, bw2, bh2);
      let lx2 = bx, ly2 = 562;
      dctx.font = '10px ' + F;
      dctx.textAlign = 'left';
      for (const [k, v] of dmgEntries.slice(0, 8)){
        const label = clsName(k) + ' ' + (v / dmgTotal * 100).toFixed(0) + '%';
        if (lx2 + dctx.measureText(label).width > bx + bw2 + 120){ lx2 = bx; ly2 += 16; }
        dctx.fillStyle = clsColor(k);
        dctx.beginPath(); dctx.roundRect(lx2, ly2 - 9, 9, 9, 2); dctx.fill();
        dctx.fillStyle = 'rgba(210,220,245,0.9)';
        dctx.fillText(label, lx2 + 13, ly2);
        lx2 += 13 + dctx.measureText(label).width + 18;
      }
      dctx.fillStyle = '#f0f5ff';
      dctx.font = 'bold 12px ' + F;
      dctx.textAlign = 'right';
      dctx.fillText('총 ' + Math.round(dmgTotal).toLocaleString(), 968, 530);
    }
  }
  // 하단 힌트
  dctx.fillStyle = 'rgba(120,140,180,0.55)';
  dctx.font = '10px ' + F;
  dctx.textAlign = 'center';
  dctx.fillText('T 키 또는 상단 버튼으로 닫기 · 게임은 계속 진행됩니다', W/2, H - 24);
}

// ---------- 심연 도감 (R10) ----------
function drawCodex(){
  if (!G.codex.open) return;
  cctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  cctx.clearRect(0, 0, W, H);
  const F = '"Noto Sans KR",sans-serif';
  G.codexRects = [];
  // 배경 + 프레임
  cctx.fillStyle = 'rgba(3,6,16,0.985)';
  cctx.fillRect(0, 0, W, H);
  const bg = cctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 640);
  bg.addColorStop(0, 'rgba(40,56,100,0.2)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  cctx.fillStyle = bg;
  cctx.fillRect(0, 0, W, H);
  cctx.strokeStyle = 'rgba(255,210,120,0.4)';
  cctx.lineWidth = 1.5;
  cctx.beginPath(); cctx.roundRect(18, 12, W - 36, H - 24, 14); cctx.stroke();
  cctx.lineWidth = 1;
  const fit = (t, mw) => {
    if (cctx.measureText(t).width <= mw) return t;
    while (t.length > 1 && cctx.measureText(t + '…').width > mw) t = t.slice(0, -1);
    return t + '…';
  };
  // 탭
  const tabNames = ['영웅', '적', '업적'];
  for (let i = 0; i < 3; i++){
    const btn = CODEX_TABS[i], on = G.codex.tab === i;
    cctx.beginPath(); cctx.roundRect(btn.x, btn.y, btn.w, btn.h, 8);
    cctx.fillStyle = on ? 'rgba(255,210,120,0.22)' : 'rgba(30,42,74,0.7)';
    cctx.fill();
    cctx.strokeStyle = on ? '#ffd88a' : 'rgba(90,120,180,0.4)';
    cctx.stroke();
    cctx.fillStyle = on ? '#ffd88a' : 'rgba(160,180,220,0.75)';
    cctx.font = 'bold 13px ' + F;
    cctx.textAlign = 'center';
    cctx.fillText(tabNames[i], btn.x + btn.w/2, btn.y + 21);
  }
  cctx.fillStyle = '#ffd88a';
  cctx.font = 'bold 20px ' + F;
  cctx.textAlign = 'left';
  cctx.fillText('심연 도감', 330, 41);
  const nUnits = Object.keys(G.meta.codex.units).length;
  const nEnemies = Object.keys(G.meta.codex.enemies).length;
  cctx.fillStyle = 'rgba(140,160,200,0.65)';
  cctx.font = '11px ' + F;
  cctx.fillText('영웅 ' + nUnits + '/' + UNIT_TYPES.length + ' · 적 ' + nEnemies + '/' + CODEX_ENEMIES.length, 470, 41);
  cctx.beginPath(); cctx.roundRect(DASH_CLOSE.x, DASH_CLOSE.y, DASH_CLOSE.w, DASH_CLOSE.h, 8);
  cctx.fillStyle = 'rgba(90,40,50,0.6)';
  cctx.fill();
  cctx.fillStyle = '#ffb0b0';
  cctx.font = 'bold 15px ' + F;
  cctx.textAlign = 'center';
  cctx.fillText('✕', DASH_CLOSE.x + 20, DASH_CLOSE.y + 22);

  if (G.codex.tab === 0){
    // ---- 영웅 도감: 클래스별 행 ----
    const clsKeys = Object.keys(CLASSES);
    clsKeys.forEach((ck, ri) => {
      const y0 = 66 + ri * 51;
      const col = CLASSES[ck].color;
      // 클래스 셀
      cctx.fillStyle = 'rgba(12,18,38,0.85)';
      cctx.beginPath(); cctx.roundRect(40, y0, 156, 44, 8); cctx.fill();
      cctx.strokeStyle = 'rgba(90,120,180,0.3)';
      cctx.stroke();
      const sides = ck === 'sword' ? 4 : ck === 'archer' || ck === 'warlock' ? 3 : ck === 'cannon' ? 5 : ck === 'summoner' || ck === 'sailor' ? 5 : 6;
      cctx.beginPath();
      shapePath(58, y0 + 22, 9, 0, sides);
      cctx.fillStyle = col;
      cctx.fill();
      cctx.fillStyle = col;
      cctx.font = 'bold 12px ' + F;
      cctx.textAlign = 'left';
      cctx.fillText(CLASSES[ck].name, 74, y0 + 20);
      cctx.fillStyle = 'rgba(140,160,200,0.65)';
      cctx.font = '9px ' + F;
      cctx.fillText(SYNERGY[ck].tiers[0] + '/' + SYNERGY[ck].tiers[1] + '기 시너지', 74, y0 + 35);
      // 영웅 카드
      const heroes = UNIT_TYPES.filter(t => t.cls === ck);
      heroes.forEach((t, hi) => {
        const x0 = 204 + hi * 258;
        const found = !!G.meta.codex.units[t.id];
        cctx.fillStyle = found ? 'rgba(16,24,48,0.9)' : 'rgba(10,14,28,0.8)';
        cctx.beginPath(); cctx.roundRect(x0, y0, 250, 44, 8); cctx.fill();
        cctx.strokeStyle = found ? col : 'rgba(70,85,120,0.35)';
        cctx.globalAlpha = found ? 1 : 0.6;
        cctx.stroke();
        cctx.globalAlpha = 1;
        // 좌측 컬러 바
        cctx.fillStyle = found ? col : 'rgba(70,85,120,0.5)';
        cctx.fillRect(x0, y0 + 6, 3, 32);
        if (found){
          cctx.fillStyle = '#f0f5ff';
          cctx.font = 'bold 11px ' + F;
          cctx.textAlign = 'left';
          cctx.fillText(t.name, x0 + 12, y0 + 18);
          cctx.fillStyle = '#ffd24a';
          cctx.font = 'bold 10px ' + F;
          cctx.textAlign = 'right';
          cctx.fillText(t.cost + 'G', x0 + 240, y0 + 18);
          cctx.fillStyle = 'rgba(160,180,220,0.8)';
          cctx.font = '9px ' + F;
          cctx.textAlign = 'left';
          cctx.fillText(fit(t.desc + ' · 피해 ' + t.dmg + ' / ' + t.cd.toFixed(2) + '초', 228), x0 + 12, y0 + 34);
        } else {
          cctx.fillStyle = 'rgba(90,110,150,0.7)';
          cctx.font = 'bold 11px ' + F;
          cctx.textAlign = 'left';
          cctx.fillText('? ? ?', x0 + 12, y0 + 18);
          cctx.fillStyle = 'rgba(90,110,150,0.5)';
          cctx.font = '9px ' + F;
          cctx.fillText('미발견 - 상점에서 영입하면 기록됩니다', x0 + 12, y0 + 34);
        }
      });
    });
  } else if (G.codex.tab === 1){
    // ---- 적 도감 ----
    CODEX_ENEMIES.forEach((c, i) => {
      const cx = 40 + (i % 4) * 238, cy = 66 + Math.floor(i / 4) * 140;
      const base = ENEMY_TYPES[c.kind];
      const found = !!G.meta.codex.enemies[c.kind];
      cctx.fillStyle = found ? 'rgba(14,20,42,0.9)' : 'rgba(10,14,28,0.8)';
      cctx.beginPath(); cctx.roundRect(cx, cy, 224, 128, 10); cctx.fill();
      cctx.strokeStyle = found ? 'rgba(255,210,120,0.35)' : 'rgba(70,85,120,0.3)';
      cctx.stroke();
      if (found){
        codexEnemyIcon(c.kind, cx + 34, cy + 40, base.color);
        cctx.fillStyle = '#f0f5ff';
        cctx.font = 'bold 12px ' + F;
        cctx.textAlign = 'left';
        cctx.fillText(base.name, cx + 62, cy + 34);
        cctx.fillStyle = 'rgba(160,180,220,0.75)';
        cctx.font = '9px ' + F;
        cctx.fillText('체력 ' + base.hp + ' · 피해 ' + base.dmg + ' · 골드 ' + base.gold, cx + 62, cy + 50);
        cctx.fillStyle = 'rgba(190,205,235,0.85)';
        cctx.font = '10px ' + F;
        const d1 = fit(c.desc, 198);
        cctx.fillText(d1, cx + 13, cy + 92);
        if (d1 !== c.desc){}
      } else {
        cctx.fillStyle = 'rgba(60,75,110,0.6)';
        cctx.beginPath(); cctx.arc(cx + 34, cy + 40, 16, 0, TAU); cctx.fill();
        cctx.fillStyle = 'rgba(90,110,150,0.8)';
        cctx.font = 'bold 13px ' + F;
        cctx.textAlign = 'center';
        cctx.fillText('?', cx + 34, cy + 45);
        cctx.textAlign = 'left';
        cctx.font = 'bold 12px ' + F;
        cctx.fillText('? ? ?', cx + 62, cy + 34);
        cctx.fillStyle = 'rgba(90,110,150,0.55)';
        cctx.font = '10px ' + F;
        cctx.fillText('아직 조우하지 못한 어둠', cx + 13, cy + 92);
      }
    });
  } else {
    // ---- 업적 ----
    ACHIEVEMENTS.forEach((a, i) => {
      const y0 = 66 + i * 47;
      const st = G.meta.ach[a.id];
      cctx.fillStyle = 'rgba(14,20,42,0.9)';
      cctx.beginPath(); cctx.roundRect(40, y0, 700, 40, 8); cctx.fill();
      cctx.strokeStyle = st === 'claimed' ? 'rgba(106,226,143,0.4)' : st === 'unlocked' ? 'rgba(255,210,120,0.55)' : 'rgba(70,85,120,0.3)';
      cctx.stroke();
      // 상태 아이콘
      cctx.beginPath(); cctx.arc(62, y0 + 20, 9, 0, TAU);
      if (st === 'claimed'){ cctx.fillStyle = 'rgba(106,226,143,0.25)'; cctx.fill(); }
      else if (st === 'unlocked'){ cctx.fillStyle = 'rgba(255,210,74,' + (0.3 + Math.sin(G.time * 5) * 0.15) + ')'; cctx.fill(); }
      cctx.strokeStyle = st === 'claimed' ? '#6ae28f' : st === 'unlocked' ? '#ffd24a' : 'rgba(90,110,150,0.6)';
      cctx.stroke();
      cctx.fillStyle = st === 'claimed' ? '#6ae28f' : st === 'unlocked' ? '#ffd24a' : 'rgba(90,110,150,0.7)';
      cctx.font = 'bold 10px ' + F;
      cctx.textAlign = 'center';
      cctx.fillText(st === 'claimed' ? '✓' : st === 'unlocked' ? '!' ? '!' : '!' : '·', 62, y0 + 24);
      cctx.textAlign = 'left';
      cctx.fillStyle = st ? '#f0f5ff' : 'rgba(150,165,200,0.75)';
      cctx.font = 'bold 12px ' + F;
      cctx.fillText(a.name, 82, y0 + 17);
      cctx.fillStyle = 'rgba(150,170,210,0.75)';
      cctx.font = '10px ' + F;
      cctx.fillText(a.desc, 82, y0 + 33);
      cctx.textAlign = 'right';
      cctx.fillStyle = '#ffd24a';
      cctx.font = 'bold 11px ' + F;
      cctx.fillText('잔광 +' + a.reward, 724, y0 + 17);
      if (st === 'unlocked'){
        const br = { x: 756, y: y0 + 5, w: 96, h: 30, achId: a.id };
        G.codexRects.push(br);
        cctx.beginPath(); cctx.roundRect(br.x, br.y, br.w, br.h, 8);
        cctx.fillStyle = 'rgba(255,210,74,0.28)';
        cctx.fill();
        cctx.strokeStyle = '#ffd24a';
        cctx.stroke();
        cctx.fillStyle = '#ffe9b0';
        cctx.font = 'bold 12px ' + F;
        cctx.textAlign = 'center';
        cctx.fillText('보상 수령', br.x + br.w/2, br.y + 20);
      } else {
        cctx.fillStyle = st === 'claimed' ? 'rgba(106,226,143,0.7)' : 'rgba(90,110,150,0.5)';
        cctx.font = '10px ' + F;
        cctx.textAlign = 'left';
        cctx.fillText(st === 'claimed' ? '수령 완료' : '미달성', 762, y0 + 24);
      }
    });
  }
  cctx.fillStyle = 'rgba(120,140,180,0.55)';
  cctx.font = '10px ' + F;
  cctx.textAlign = 'center';
  cctx.fillText('도감과 업적은 모든 런에 걸쳐 보존됩니다', W/2, H - 24);
}

function codexEnemyIcon(kind, x, y, color){
  cctx.save();
  cctx.fillStyle = color;
  cctx.strokeStyle = 'rgba(8,6,20,0.8)';
  cctx.shadowColor = color;
  cctx.shadowBlur = 8;
  if (kind === 'charger'){
    shapePath(x, y, 16, 0, 3);
    cctx.fill(); cctx.stroke();
  } else if (kind === 'spitter'){
    shapePath(x, y, 15, 0.5, 5);
    cctx.fill(); cctx.stroke();
    cctx.shadowBlur = 0;
    cctx.beginPath(); cctx.arc(x, y, 6, 0, TAU);
    cctx.fillStyle = '#0d3a30'; cctx.fill();
  } else if (kind === 'splitter'){
    for (let k = 0; k < 3; k++){
      const a = k / 3 * TAU;
      shapePath(x + Math.cos(a) * 6, y + Math.sin(a) * 6, 9, a, 4);
      cctx.fill(); cctx.stroke();
    }
  } else if (kind === 'shield'){
    shapePath(x, y, 15, 0, 6);
    cctx.fill(); cctx.stroke();
    cctx.shadowBlur = 0;
    cctx.beginPath(); cctx.arc(x, y, 20, -0.7, 0.7);
    cctx.strokeStyle = '#9ab8d8'; cctx.lineWidth = 4; cctx.stroke(); cctx.lineWidth = 1;
  } else if (kind === 'bomber'){
    cctx.beginPath();
    for (let k = 0; k < 16; k++){
      const a = k / 16 * TAU;
      const rr = k % 2 === 0 ? 17 : 10;
      k === 0 ? cctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : cctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cctx.closePath(); cctx.fill(); cctx.stroke();
    cctx.shadowBlur = 0;
    cctx.beginPath(); cctx.arc(x, y, 5, 0, TAU);
    cctx.fillStyle = '#ff5a3c'; cctx.fill();
  } else if (kind === 'cultist' || kind === 'summoner'){
    cctx.beginPath();
    for (let k = 0; k < 8; k++){
      const a = k * Math.PI / 4;
      const rr = k % 2 === 0 ? 17 : 7;
      k === 0 ? cctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : cctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cctx.closePath(); cctx.fill(); cctx.stroke();
  } else if (kind === 'fast' || kind === 'mini'){
    shapePath(x, y, kind === 'mini' ? 10 : 13, 0, 4);
    cctx.fill(); cctx.stroke();
  } else if (kind === 'tank' || kind === 'boss'){
    shapePath(x, y, kind === 'boss' ? 19 : 16, 0, 6);
    cctx.fill(); cctx.stroke();
    if (kind === 'boss'){
      cctx.shadowBlur = 0;
      cctx.fillStyle = '#ffd24a';
      for (let k = -1; k <= 1; k++){
        cctx.beginPath();
        cctx.moveTo(x + k * 10 - 4, y - 20);
        cctx.lineTo(x + k * 10, y - 30);
        cctx.lineTo(x + k * 10 + 4, y - 20);
        cctx.closePath(); cctx.fill();
      }
    }
  } else {
    // mob 등
    cctx.beginPath(); cctx.roundRect(x - 12, y - 12, 24, 24, 5);
    cctx.fill(); cctx.stroke();
  }
  cctx.restore();
}

function setCodex(open, tab){
  G.codex.open = open;
  if (tab !== undefined) G.codex.tab = tab;
  const el = document.getElementById('codex');
  if (el && el.style) el.style.display = open ? 'block' : 'none';
  if (open){
    if (G.dash.open) setDash(false);
    drawCodex();
  }
}
function setDash(open, tab){
  G.dash.open = open;
  if (tab !== undefined) G.dash.tab = tab;
  const el = document.getElementById('dash');
  if (el && el.style) el.style.display = open ? 'block' : 'none';
  if (open){
    if (G.codex.open) setCodex(false);
    drawDash();
  }
}

function drawOver(){
  // 잔불이 꺼져가는 어둠
  ctx.fillStyle = 'rgba(2,3,10,0.82)';
  ctx.fillRect(-20, -20, W + 40, H + 40);
  const L = G.leader;
  const glowR = 90 + Math.sin(G.time * 2) * 10;
  const g = ctx.createRadialGradient(L.x, L.y, 10, L.x, L.y, glowR);
  g.addColorStop(0, 'rgba(255,180,74,0.28)');
  g.addColorStop(1, 'rgba(255,180,74,0)');
  ctx.fillStyle = g;
  ctx.fillRect(L.x - glowR, L.y - glowR, glowR * 2, glowR * 2);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb44a';
  ctx.font = 'bold 30px "Noto Sans KR",sans-serif';
  ctx.fillText('등불이 꺼졌습니다', W/2, 104);
  ctx.fillStyle = 'rgba(207,224,255,0.85)';
  ctx.font = '14px "Noto Sans KR",sans-serif';
  ctx.fillText('파도 ' + G.wave + ' · 처치 ' + G.stats.kills + ' · 횟수 ' + G.meta.totalRuns + '회', W/2, 134);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 16px "Noto Sans KR",sans-serif';
  ctx.fillText('잔광 +' + G.lastGain + '   (보유 잔광 ' + G.meta.glimmer + ')', W/2, 166);
  ctx.fillStyle = 'rgba(140,160,200,0.75)';
  ctx.font = '12px "Noto Sans KR",sans-serif';
  ctx.fillText('영구 강화 - 잔광으로 다음 점화를 밝히세요', W/2, 196);

  for (let i = 0; i < REBIRTH_UPGRADES.length; i++){
    const u = REBIRTH_UPGRADES[i], r = rbRect(i);
    const t = up(u.id);
    const maxed = t >= u.max;
    const cost = maxed ? 0 : u.costs[t];
    const afford = !maxed && G.meta.glimmer >= cost;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = maxed ? 'rgba(24,34,60,0.85)' : afford ? 'rgba(44,60,100,0.92)' : 'rgba(20,28,50,0.85)';
    ctx.fill();
    ctx.strokeStyle = maxed ? 'rgba(90,110,150,0.4)' : afford ? '#ffd24a' : 'rgba(90,110,150,0.5)';
    ctx.lineWidth = afford ? 1.8 : 1.1;
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? 'rgba(160,175,205,0.8)' : '#f0f5ff';
    ctx.font = 'bold 12px "Noto Sans KR",sans-serif';
    ctx.fillText(u.name, r.x + 10, r.y + 20);
    // 단계 핍
    ctx.textAlign = 'right';
    let pips = '';
    for (let k = 0; k < u.max; k++) pips += k < t ? '●' : '○';
    ctx.fillStyle = '#ffd24a';
    ctx.font = '10px "Noto Sans KR",sans-serif';
    ctx.fillText(pips, r.x + r.w - 10, r.y + 20);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(190,205,235,0.85)';
    ctx.font = '10px "Noto Sans KR",sans-serif';
    ctx.fillText(u.desc, r.x + 10, r.y + 38);
    ctx.fillStyle = maxed ? 'rgba(140,160,200,0.6)' : afford ? '#ffd24a' : 'rgba(255,120,120,0.85)';
    ctx.font = 'bold 11px "Noto Sans KR",sans-serif';
    ctx.fillText(maxed ? 'MAX' : '잔광 ' + cost, r.x + 10, r.y + 56);
  }

  if (G.msgT > 0){
    ctx.globalAlpha = clamp(G.msgT / 0.4, 0, 1);
    ctx.fillStyle = '#ffe9b0';
    ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(G.msg, W/2, 452);
    ctx.globalAlpha = 1;
  }
  drawButton(OVER_BTN, '다시 점화', true);
  ctx.beginPath();
  ctx.roundRect(DASH_OVER_BTN.x, DASH_OVER_BTN.y, DASH_OVER_BTN.w, DASH_OVER_BTN.h, 10);
  ctx.fillStyle = 'rgba(40,56,96,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,120,0.5)';
  ctx.stroke();
  ctx.fillStyle = '#ffd88a';
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('정산 보기', DASH_OVER_BTN.x + DASH_OVER_BTN.w/2, DASH_OVER_BTN.y + 31);
  ctx.beginPath();
  ctx.roundRect(CODEX_OVER_BTN.x, CODEX_OVER_BTN.y, CODEX_OVER_BTN.w, CODEX_OVER_BTN.h, 10);
  ctx.fillStyle = 'rgba(40,56,96,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,120,0.5)';
  ctx.stroke();
  ctx.fillStyle = '#ffd88a';
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('도감 · 업적', CODEX_OVER_BTN.x + CODEX_OVER_BTN.w/2, CODEX_OVER_BTN.y + 31);
  // 기록 초기화 (2단계 확인)
  ctx.beginPath();
  ctx.roundRect(RESET_BTN.x, RESET_BTN.y, RESET_BTN.w, RESET_BTN.h, 6);
  ctx.fillStyle = G.resetConfirmT > 0 ? 'rgba(160,40,40,0.55)' : 'rgba(30,40,70,0.6)';
  ctx.fill();
  ctx.fillStyle = G.resetConfirmT > 0 ? '#ffb0b0' : 'rgba(150,170,210,0.65)';
  ctx.font = '11px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(G.resetConfirmT > 0 ? '정말 초기화? 다시 클릭' : '기록 초기화', RESET_BTN.x + RESET_BTN.w/2, RESET_BTN.y + 18);
}

// ---------- 메인 루프 ----------
let lastT = performance.now();
let fpsWall = performance.now(), fpsFrames = 0;
function loop(now){
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  fpsFrames++;
  if (now - fpsWall >= 500){ G.fps = fpsFrames * 1000 / (now - fpsWall); fpsFrames = 0; fpsWall = now; }
  if (SPEED > 1) dt *= SPEED;
  if (G.hitstop > 0){ G.hitstop -= dt; draw(); requestAnimationFrame(loop); return; }
  if (G.slowmo > 0){ G.slowmo -= dt; G.abAmt = Math.max(G.abAmt, 0.7); dt *= 0.22; } // 슬로모션
  if (G.settingsOpen){ draw(); requestAnimationFrame(loop); return; } // 설정 열린 동안 일시정지
  G.abAmt = Math.max(0, G.abAmt - dt * 1.4);
  G.time += dt;
  G.trauma = Math.max(0, G.trauma - dt * 1.6);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.phase === 'combat' || G.phase === 'shop'){
    updateLeader(dt);
    updateUnits(dt);
  }
  if (G.phase === 'combat') updateCombat(dt);
  if (G.phase === 'combat' || G.phase === 'shop'){
    for (const sk of G.skills) if (sk.t > 0) sk.t = Math.max(0, sk.t - dt);
  }
  for (let i = G.slowFields.length - 1; i >= 0; i--){
    const f = G.slowFields[i]; f.life -= dt;
    if (f.life <= 0) G.slowFields.splice(i, 1);
  }
  for (let i = G.skillFx.length - 1; i >= 0; i--){
    const f = G.skillFx[i]; f.life -= dt;
    if (f.life <= 0) G.skillFx.splice(i, 1);
  }
  if (G.phase === 'shop' && G.autoTimer > 0){
    G.autoTimer -= dt;
    if (G.autoTimer <= 0) startWave();
  }
  if (G.resetConfirmT > 0) G.resetConfirmT -= dt;
  if (G.phase === 'combat'){
    G.dashT -= dt;
    if (G.dashT <= 0){
      G.dashT = 0.5;
      G.dpsHist.push(G.dmgAcc * 2); G.dmgAcc = 0;
      if (G.dpsHist.length > 120) G.dpsHist.shift();
      G.coreHist.push(G.coreHp);
      if (G.coreHist.length > 120) G.coreHist.shift();
    }
  }
  if (G.dash.open){
    G.dashDrawT -= dt;
    if (G.dashDrawT <= 0){ G.dashDrawT = 0.12; drawDash(); }
  } else if (G.codex.open){
    G.dashDrawT -= dt;
    if (G.dashDrawT <= 0){ G.dashDrawT = 0.4; drawCodex(); }
  }
  G.saveT += dt;
  if (G.saveT > 10){
    G.saveT = 0;
    saveRun();
    saveMeta();
  }
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.01, dt); p.vy *= Math.pow(0.01, dt);
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.dmgNums.length - 1; i >= 0; i--){
    const d = G.dmgNums[i];
    d.life -= dt; d.y -= 30 * dt;
    if (d.life <= 0) G.dmgNums.splice(i, 1);
  }
  for (let i = G.deathRings.length - 1; i >= 0; i--){
    const r = G.deathRings[i];
    r.life -= dt;
    if (r.life <= 0) G.deathRings.splice(i, 1);
  }
  for (let i = G.debris.length - 1; i >= 0; i--){
    const d = G.debris[i];
    d.life -= dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 340 * dt; // 중력
    d.vx *= Math.pow(0.2, dt);
    d.rot += d.vr * dt;
    if (d.life <= 0) G.debris.splice(i, 1);
  }
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('pagehide', () => { saveRun(); saveMeta(); });
loadSettings();
loadMeta();
G.savedRun = loadSavedRun();
requestAnimationFrame(loop);

// ---------- 자동 부팅 테스트 (?autotest=1) ----------
let SPEED = 1;
if (location.search.indexOf('autotest') >= 0){
  const m = location.search.match(/speed=(\d+)/);
  if (m) SPEED = Math.min(8, parseInt(m[1], 10) || 1);
  window.__G = G;
  setTimeout(() => {
    newRun();
    const wm = location.search.match(/wave=(\d+)/);
    if (wm){ G.wave = Math.max(0, parseInt(wm[1], 10) || 0); G.gold = 500; }
    let placed = 0;
    for (let guard = 0; guard < 12 && placed < 3; guard++){
      let bi = -1, bc = 99;
      for (let i = 0; i < 5; i++){ const t = G.shop[i]; if (t && t.cost < bc && t.cost <= G.gold){ bc = t.cost; bi = i; } }
      if (bi < 0) break;
      buyCard(bi);
      placed++;
    }
    startWave();
  }, 300);
}
