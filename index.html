let viewScale = 1, viewOX = 0, viewOY = 0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / W, wh / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  canvas.width  = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  viewScale = s * dpr;
  const rect = canvas.getBoundingClientRect();
  viewOX = rect.left; viewOY = rect.top;
}
let rhDismissed = false;
function updateRotateHint(){
  const rh = document.getElementById('rotateHint');
  if (!rh || !rh.style) return;
  const show = COARSE && !rhDismissed && window.innerHeight > window.innerWidth && window.innerWidth < 520;
  rh.style.display = show ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
resize();
updateRotateHint();
const _rh = document.getElementById('rotateHintSkip');
if (_rh && _rh.addEventListener) _rh.addEventListener('click', () => { rhDismissed = true; updateRotateHint(); });

const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function angLerp(a, b, t){
  let d = b - a;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d * t;
}

  const c = {};
  for (const k in CLASSES) c[k] = 0;
  for (const u of G.units){ if (!u.mote) c[u.cls]++; }
  return c;
}
function synergyLevel(cls){
  const n = classCounts()[cls];
  const t = SYNERGY[cls].tiers;
  if (n >= t[1]) return 2;
  if (n >= t[0]) return 1;
  return 0;
}
function unitDmg(u){
  let d = u.dmg * Math.pow(2, u.star - 1);
  if (u.cls === 'sword'){ const l = synergyLevel('sword'); d *= l === 2 ? 1.5 : l === 1 ? 1.2 : 1; }
  if (u.aoe > 0){ const l = synergyLevel('cannon'); d *= l === 2 ? 1.6 : l === 1 ? 1.25 : 1; }
  const cr = [0, 0.12, 0.3][synergyLevel('assassin')];
  if (cr > 0 && Math.random() < cr) d *= 2; // 치명타
  d *= 1 + 0.08 * up('discipline'); // 수호단 규율
  return d;
}

  if (u.cls === 'archer'){ const l = synergyLevel('archer'); c /= l === 2 ? 1.6 : l === 1 ? 1.25 : 1; }
  c /= 1 + 0.06 * up('swift'); // 신속한 항해
  return c;
}

  return a;
}

// ---------- 진형 오프셋 ----------
function formationOffsets(){
  const n = G.units.length;
  const offs = new Array(n);
  const order = G.units.map((u, i) => i).sort((a, b) => (G.units[a].melee === G.units[b].melee) ? a - b : (G.units[a].melee ? -1 : 1));
  if (G.formation === 'circle'){
    order.forEach((ui, k) => {
      const ring = Math.floor(k / 6), j = k % 6;
      const a = j / 6 * TAU + ring * 0.5;
      offs[ui] = { x: Math.cos(a) * (50 + 40 * ring), y: Math.sin(a) * (50 + 40 * ring) };
    });
  } else if (G.formation === 'line'){
    const meleeIdx = order.filter(ui => G.units[ui].melee);
    const rangedIdx = order.filter(ui => !G.units[ui].melee);
    meleeIdx.forEach((ui, k) => { offs[ui] = { x: (k - (meleeIdx.length - 1) / 2) * 38, y: -56 }; });
    rangedIdx.forEach((ui, k) => { offs[ui] = { x: (k - (rangedIdx.length - 1) / 2) * 36, y: -14 + Math.floor(k / 5) * 34 }; });
  } else if (G.formation === 'wedge'){
    order.forEach((ui, k) => {
      const row = Math.floor((Math.sqrt(8 * k + 1) - 1) / 2);
      const j = k - row * (row + 1) / 2;
      offs[ui] = { x: (j - row / 2) * 36, y: -row * 38 - 10 };
    });
  } else {
    order.forEach((ui, k) => {
      const cols = 3, r = Math.floor(k / cols), c = k % cols;
      offs[ui] = { x: (c - 1) * 62 + ((r % 2) ? 31 : 0), y: (r - 1) * 62 };
    });
  }
  return offs;
}

function rollShop(){
  G.shop = [];
  for (let i = 0; i < 5; i++){
    const pool = [];
    for (const t of UNIT_TYPES){
      const w = t.cost === 1 ? 5 : t.cost === 2 ? 3 : 2;
      for (let k = 0; k < w; k++) pool.push(t);
    }
    G.shop.push(pool[Math.floor(Math.random() * pool.length)]);
  }
}
function addUnit(t){
  const a = rand(0, TAU);
  const u = { ...t, star: 1, cool: rand(0, 0.3),
    x: G.leader.x + Math.cos(a) * 10, y: G.leader.y + Math.sin(a) * 10,
    vx: 0, vy: 0, rot: rand(0, TAU), sx: 1, sxV: 0, act: 'form', trail: [] };
  G.units.push(u);
  burst(u.x, u.y, CLASSES[t.cls].color, 16, 2.5);
  addDmgNum(u.x, u.y - 20, t.name, '#ffe9b0', 1.0);
}
function buyCard(i){
  const t = G.shop[i];
  if (!t) return;
  if (G.gold < t.cost){ flashMsg('골드가 부족합니다'); return; }
  // 합체: 같은 타입+등급 2기 보유 시 즉시 합체
  let mergeStar = 0;
  for (const st of [1, 2]){
    if (G.units.filter(u => u.id === t.id && u.star === st).length >= 2){ mergeStar = st; break; }
  }
  if (mergeStar === 0 && rosterSize() >= unitCap()){
    flashMsg('수호단이 가득 찼습니다 (' + rosterSize() + '/' + unitCap() + ') - 합체나 보스 처치로 여유를 만드세요');
    return;
  }
  G.gold -= t.cost;
  G.shop[i] = null;
  if (mergeStar > 0){
    const same = G.units.filter(u => u.id === t.id && u.star === mergeStar);
    const keep = same[0];
    G.units.splice(G.units.indexOf(same[1]), 1);
    keep.star = Math.min(3, keep.star + 1);
    keep.sx = 1.6;
    burst(keep.x, keep.y, '#ffd27a', 26, 3);
    addDmgNum(keep.x, keep.y - 24, '★' + keep.star + ' 합체!', '#ffd27a', 1.4);
    saveRun();
    return;
  }
  addUnit(t);
  saveRun();
}

// ---------- 웨이브 ----------
function startWave(){
  G.wave++;
  const n = G.wave;
  const q = [];
  const isBoss = n % 10 === 0;
  const total = isBoss ? 4 + Math.ceil(n * 0.8) : 3 + Math.ceil(n * 2.2);
  for (let i = 0; i < total; i++){
    let kind = 'mob';
    if (n >= 3 && Math.random() < 0.25) kind = 'fast';
    if (n >= 4 && i === total - 1 && n % 4 === 0) kind = 'tank';
    if (n >= 6 && Math.random() < 0.12) kind = 'tank';
    q.push(kind);
  }
  if (isBoss){
    G.bossSpawnT = 2.2;
    G.bossWarnT = 2.2;
    G.trauma = Math.min(G.trauma + 0.35, 1);
    flashMsg('심연 군주가 다가옵니다…');
    G.msgT = 3.2;
  }
  G.spawnQueue = q;
  G.spawnTimer = 0.5;
  G.waveActive = true;
  G.phase = 'combat';
  G.autoTimer = 0;
  saveRun();
}
function enemyScale(){
  const n = G.wave - 1;
  return (1 + 0.24 * n + 0.06 * Math.pow(Math.max(0, n - 7), 1.6)) * Math.pow(1.08, Math.max(0, n - 9)); // 8파 가속 + 10파 이후 지수
}
function spawnEnemy(kind){
  const base = ENEMY_TYPES[kind];
  const scale = enemyScale();
  const L = G.leader;
  const a = rand(0, TAU), d = rand(430, 560);
  const x = clamp(L.x + Math.cos(a) * d, -30, W + 30);
  const y = clamp(L.y + Math.sin(a) * d, -30, H + 30);
  G.enemies.push({
    kind, x, y, rot: rand(0, TAU), spin: rand(-1.5, 1.5),
    hp: base.hp * scale, maxhp: base.hp * scale,
    spd: base.spd * rand(0.9, 1.1), dmg: base.dmg * (1 + 0.12 * (G.wave - 1)),
    r: base.r, gold: base.gold, color: base.color,
    atkT: 0, flash: 0, kbx: 0, kby: 0, sx: 0.01, sxV: 0,
  });
}
function spawnBoss(){
  const base = ENEMY_TYPES.boss;
  const scale = enemyScale();
  const b = {
    kind: 'boss', boss: true, x: W/2, y: 60, rot: 0, spin: 0.35,
    hp: base.hp * scale, maxhp: base.hp * scale,
    spd: base.spd, dmg: base.dmg * (1 + 0.12 * (G.wave - 1)),
    r: base.r, gold: base.gold, color: base.color,
    atkT: 0, atkCd: 3.4, flash: 0, kbx: 0, kby: 0, sx: 0.01, sxV: 0,
  };
  G.enemies.push(b);
  G.boss = b;
  G.slowmo = Math.max(G.slowmo, 0.5);
  G.abAmt = 1;
  G.trauma = 1;
  G.hitstop = Math.max(G.hitstop, 0.08);
  ringFx(b.x, b.y, 150, '#b45aff');
  burst(b.x, b.y, '#b45aff', 40, 3);
  flashMsg('심연 군주 등장!');
}
function endWave(){
  G.waveActive = false;
  G.units = G.units.filter(u => !u.mote); // 소환수 소멸
  const interest = Math.min(Math.floor(G.gold / 10), 5);
  const bonus = 3 + interest;
  G.gold += bonus;
  G.stats.earned += bonus;
  G.phase = 'shop';
  G.aiming = -1;
  G.autoTimer = G.autoNext ? 10 : 0;
  rollShop();
  flashMsg('파도 ' + G.wave + ' 클리어! +' + bonus + '골드 (이자 +' + interest + ')');
  saveRun();
}
function gameOver(){
  G.phase = 'over';
  G.aiming = -1;
  const gain = Math.round((G.wave * 10 + Math.floor(G.stats.kills / 2)) * (1 + 0.15 * up('eternal')));
  G.lastGain = gain;
  G.meta.glimmer += gain;
  G.meta.totalRuns++;
  if (G.wave > G.meta.best) G.meta.best = G.wave;
  G.best = G.meta.best;
  saveMeta();
  clearRun(); // 런 종료 - 이어하기 삭제
  G.trauma = 1;
  G.hitstop = Math.max(G.hitstop, 0.15);
  burst(G.leader.x, G.leader.y, '#ffd27a', 60, 4);
  for (let i = 0; i < 40; i++)
    G.particles.push(mkP(G.leader.x + rand(-24, 24), G.leader.y + rand(-24, 24),
      rand(-30, 30), rand(-90, -30), rand(1.2, 2.6), i % 2 ? '#ff9a5a' : '#ffd24a', rand(2, 4)));
}

// ---------- 이동/조종 ----------
function nearestEnemy(x, y, maxD){
  let t = null, best = maxD || 1e9;
  for (const e of G.enemies){
    const d = dist(x, y, e.x, e.y);
    if (d < best){ best = d; t = e; }
  }
  return t;
}
function nearestOrb(){
  let t = null, best = 1e9;
  for (const o of G.orbs){
    const d = dist(G.leader.x, G.leader.y, o.x, o.y);
    if (d < best){ best = d; t = o; }
  }
  return t;
}
function updateLeader(dt){
  const L = G.leader;
  let tx = 0, ty = 0; // 목표 속도
  if (G.control === 'manual'){
    const k = G.keys;
    let dx = (k['d'] || k['arrowright'] ? 1 : 0) - (k['a'] || k['arrowleft'] ? 1 : 0);
    let dy = (k['s'] || k['arrowdown'] ? 1 : 0) - (k['w'] || k['arrowup'] ? 1 : 0);
    if (dx || dy){
      const m = Math.hypot(dx, dy);
      tx = dx / m * 175; ty = dy / m * 175;
      G.lastManual = G.time;
    } else if (G.mouse.down){
      const d = dist(L.x, L.y, G.mouse.x, G.mouse.y);
      if (d > 8){
        tx = (G.mouse.x - L.x) / d * 175;
        ty = (G.mouse.y - L.y) / d * 175;
        G.lastManual = G.time;
      }
    }
    if (G.time - G.lastManual > 2.5){
      G.control = 'delegate';
      flashMsg('위임 모드로 복귀 (' + BEHAVIORS.find(b => b.id === G.behavior).name + ')');
    }
  }
  if (G.control === 'delegate' && G.phase === 'combat'){
    const e = nearestEnemy(L.x, L.y);
    if (G.behavior === 'attack'){
      if (e && dist(L.x, L.y, e.x, e.y) > 130){
        const a = Math.atan2(e.y - L.y, e.x - L.x);
        tx = Math.cos(a) * 130; ty = Math.sin(a) * 130;
      }
    } else if (G.behavior === 'defend'){
      const d = dist(L.x, L.y, W/2, 300);
      if (d > 24){ tx = (W/2 - L.x) / d * 120; ty = (300 - L.y) / d * 120; }
    } else if (G.behavior === 'kite'){
      if (e && dist(L.x, L.y, e.x, e.y) < 230){
        const a = Math.atan2(L.y - e.y, L.x - e.x);
        tx = Math.cos(a) * 150; ty = Math.sin(a) * 150;
      }
    } else if (G.behavior === 'gather'){
      const o = nearestOrb();
      if (o){
        const d = dist(L.x, L.y, o.x, o.y);
        if (d > 10){ tx = (o.x - L.x) / d * 160; ty = (o.y - L.y) / d * 160; }
      } else if (e && dist(L.x, L.y, e.x, e.y) < 200){
        const a = Math.atan2(L.y - e.y, L.x - e.x);
        tx = Math.cos(a) * 120; ty = Math.sin(a) * 120;
      }
    }
  }
  // 부드러운 가감속
  const acc = 7;
  L.vx = lerp(L.vx, tx, Math.min(1, acc * dt));
  L.vy = lerp(L.vy, ty, Math.min(1, acc * dt));
  L.x = clamp(L.x + L.vx * dt, 40, W - 40);
  L.y = clamp(L.y + L.vy * dt, 50, H - 60);
  const spd = Math.hypot(L.vx, L.vy);
  if (spd > 20) L.rot = angLerp(L.rot, Math.atan2(L.vy, L.vx), 0.12);
  // 잔상
  if (spd > 60){
    L.trail.push({ x: L.x, y: L.y, rot: L.rot, life: 0.35 });
    if (L.trail.length > 10) L.trail.shift();
  }
  for (let i = L.trail.length - 1; i >= 0; i--){
    L.trail[i].life -= dt;
    if (L.trail[i].life <= 0) L.trail.splice(i, 1);
  }
}

function updateUnits(dt){
  const offs = formationOffsets();
  // 진형 방향: 가장 가까운 적, 없으면 리더 이동 방향
  const e0 = nearestEnemy(G.leader.x, G.leader.y);
  if (e0) G.facing = angLerp(G.facing, Math.atan2(e0.y - G.leader.y, e0.x - G.leader.x), 0.05);
  else if (Math.hypot(G.leader.vx, G.leader.vy) > 30) G.facing = angLerp(G.facing, G.leader.rot, 0.05);
  const cf = Math.cos(G.facing + Math.PI/2), sf = Math.sin(G.facing + Math.PI/2);
  for (let i = 0; i < G.units.length; i++){
    const u = G.units[i];
    if (u.mote){
      u.life -= dt;
      if (u.life <= 0){ burst(u.x, u.y, '#06d6a0', 6, 1.5); G.units.splice(i, 1); i--; continue; }
    }
    let ax = G.leader.x + offs[i].x * cf - offs[i].y * sf;
    let ay = G.leader.y + offs[i].x * sf + offs[i].y * cf;
    // 돌격/근접 접근
    const leash = u.act === 'charge' ? 420 : u.melee && u.act !== 'hold' ? 170 : 0;
    if (leash > 0 && G.phase === 'combat'){
      const e = nearestEnemy(ax, ay, leash);
      if (e){ ax = e.x; ay = e.y; }
    }
    const k = 9, damp = Math.pow(0.0025, dt);
    u.vx = (u.vx + (ax - u.x) * k * dt) * damp;
    u.vy = (u.vy + (ay - u.y) * k * dt) * damp;
    u.x += u.vx * dt; u.y += u.vy * dt;
    const uspd = Math.hypot(u.vx, u.vy);
    if (uspd > 24) u.rot = angLerp(u.rot, Math.atan2(u.vy, u.vx), 0.15);
    else u.rot += Math.sin(G.time * 2.5 + i * 1.7) * 0.003; // 대기 시 미세한 흔들림
    // 잔상
    if (uspd > 90){
      u.trail.push({ x: u.x, y: u.y, rot: u.rot, life: 0.28 });
      if (u.trail.length > 7) u.trail.shift();
    }
    for (let j = u.trail.length - 1; j >= 0; j--){
      u.trail[j].life -= dt;
      if (u.trail[j].life <= 0) u.trail.splice(j, 1);
    }
    // 스쿼시 스프링 복원
    u.sxV += (1 - u.sx) * 180 * dt;
    u.sxV *= Math.pow(0.0001, dt);
    u.sx += u.sxV * dt;
  }
}

// ---------- 전투 ----------
function updateCombat(dt){
  if (G.bossSpawnT > 0){
    G.bossSpawnT -= dt;
    if (G.bossSpawnT <= 0){ G.bossSpawnT = -1; spawnBoss(); }
  }
  if (G.bossWarnT > 0) G.bossWarnT -= dt;
  if (G.spawnQueue.length > 0){
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0){
      spawnEnemy(G.spawnQueue.shift());
      G.spawnTimer = clamp(1.1 - G.wave * 0.04, 0.35, 1.1);
    }
  } else if (G.enemies.length === 0 && G.waveActive){
    endWave();
    return;
  }
  const L = G.leader;

  // 성직자 시너지: 등불 재생
  const regen = clericRegen();
  if (regen > 0 && G.coreHp < G.coreMax) G.coreHp = Math.min(G.coreMax, G.coreHp + regen * dt);

  // 위임 모드: 액티브 스킬 자동 발동
  if (G.control === 'delegate') autoCast();

  // 유닛 공격
  for (const u of G.units){
    u.cool -= dt;
    if (u.cool > 0) continue;
    const tgt = nearestEnemy(u.x, u.y, u.rng);
    if (!tgt) continue;
    u.cool = unitCd(u);
    u.sx = 1.35; u.sxV = -2; // 발사 스쿼시
    if (u.melee){
      let hitAny = false;
      for (const e of G.enemies){
        if (dist(u.x, u.y, e.x, e.y) <= u.rng + e.r){
          hurtEnemy(e, unitDmg(u), u.x, u.y);
          hitAny = true;
        }
      }
      if (hitAny){
        slashFx(u.x, u.y, Math.atan2(tgt.y - u.y, tgt.x - u.x), CLASSES[u.cls].color);
        G.trauma = Math.min(G.trauma + 0.06, 0.5);
      }
    } else {
      const a = Math.atan2(tgt.y - u.y, tgt.x - u.x);
      u.rot = a;
      const spd = 430;
      G.projectiles.push({
        x: u.x, y: u.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        tgt, dmg: unitDmg(u), aoe: unitAoe(u),
        color: CLASSES[u.cls].light,
        mage: (u.aoe || 0) > 0, life: 2.2,
      });
    }
    // 성직자: 공격 시 등불 회복
    if (u.heal){
      G.coreHp = Math.min(G.coreMax, G.coreHp + u.heal * u.star);
      burst(L.x + rand(-10, 10), L.y - rand(10, 24), '#f5f0e1', 4, 1.2);
    }
  }

  // 소환사: 소환수 생성
  for (const u of G.units){
    if (!u.summon || u.mote) continue;
    if (u.summonT == null) u.summonT = rand(2, u.summon.cd);
    u.summonT -= dt;
    if (u.summonT <= 0){
      const sm = summonMul();
      u.summonT = u.summon.cd * sm.cd;
      const mote = { ...MOTE, star: 1, dmg: Math.round(u.summon.dmg * sm.dmg * u.star), cool: 0,
        x: u.x + rand(-24, 24), y: u.y + rand(-24, 24), vx: 0, vy: 0, rot: rand(0, TAU),
        sx: 1, sxV: 0, act: 'charge', trail: [], life: u.summon.life };
      G.units.push(mote);
      burst(mote.x, mote.y, '#06d6a0', 12, 2);
    }
  }

  // 투사체
  for (let i = G.projectiles.length - 1; i >= 0; i--){
    const p = G.projectiles[i];
    p.life -= dt;
    if (p.tgt && p.tgt.hp > 0){
      const a = Math.atan2(p.tgt.y - p.y, p.tgt.x - p.x);
      p.vx = p.vx * 0.85 + Math.cos(a) * 430 * 0.15;
      p.vy = p.vy * 0.85 + Math.sin(a) * 430 * 0.15;
    }
    const px = p.x, py = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (Math.random() < 0.5) G.particles.push(mkP(p.x, p.y, 0, 0, 0.18, p.color, 2));
    let hit = null;
    for (const e of G.enemies){
      const dx = p.x - px, dy = p.y - py;
      const len2 = dx*dx + dy*dy || 1e-9;
      let t = ((e.x - px) * dx + (e.y - py) * dy) / len2;
      t = clamp(t, 0, 1);
      if (dist(px + dx * t, py + dy * t, e.x, e.y) < e.r + 4){ hit = e; break; }
    }
    if (hit || p.life <= 0){
      if (hit){
        if (p.aoe > 0){
          burst(p.x, p.y, '#ff9a5a', 18, 2.2);
          ringFx(p.x, p.y, p.aoe, '#ff9a5a');
          for (const e of G.enemies){
            if (dist(p.x, p.y, e.x, e.y) <= p.aoe + e.r) hurtEnemy(e, p.dmg, p.x, p.y);
          }
          G.trauma = Math.min(G.trauma + 0.12, 0.6);
        } else {
          hurtEnemy(hit, p.dmg, p.x, p.y);
        }
      }
      G.projectiles.splice(i, 1);
    }
  }

  // 적
  for (let i = G.enemies.length - 1; i >= 0; i--){
    const e = G.enemies[i];
    if (e.flash > 0) e.flash -= dt;
    e.rot += e.spin * dt;
    e.x += e.kbx * dt * 8; e.y += e.kby * dt * 8;
    e.kbx *= Math.pow(0.001, dt); e.kby *= Math.pow(0.001, dt);
    e.sxV += (1 - e.sx) * 160 * dt;
    e.sxV *= Math.pow(0.0001, dt);
    e.sx += e.sxV * dt;
    const d = dist(e.x, e.y, L.x, L.y);
    if (e.boss){
      // 보스: 느리게 접근, 쿨다운 강타(전조 후 발동)
      const spMul = 1 - warlockSlow();
      if (d > 70 + e.r){
        const a = Math.atan2(L.y - e.y, L.x - e.x);
        e.x += Math.cos(a) * e.spd * spMul * dt;
        e.y += Math.sin(a) * e.spd * spMul * dt;
      } else {
        e.atkT -= dt;
        if (e.atkT <= 0){
          e.atkT = e.atkCd;
          e.sx = 1.5; e.sxV = -3;
          G.coreHp -= e.dmg * (1 - guardianReduce());
          G.coreFlash = 0.3;
          G.trauma = 1;
          G.abAmt = 1;
          G.hitstop = Math.max(G.hitstop, 0.06);
          ringFx(L.x, L.y, 110, '#ff4a6a');
          burst(L.x, L.y, '#ff5a5a', 22, 2.6);
          addDmgNum(L.x, L.y - 40, '-' + Math.round(e.dmg), '#ff4a5a', 1.6);
          for (const u of G.units){ // 수호단 밀려남
            const a2 = Math.atan2(u.y - L.y, u.x - L.x);
            u.vx += Math.cos(a2) * 190; u.vy += Math.sin(a2) * 190;
          }
          if (G.coreHp <= 0){ G.coreHp = 0; gameOver(); return; }
        }
      }
    } else if (d > 26 + e.r + 4){
      let spMul = 1 - warlockSlow();
      for (const f of G.slowFields){ if (dist(e.x, e.y, f.x, f.y) < f.r + e.r){ spMul *= 0.45; break; } }
      const a = Math.atan2(L.y - e.y, L.x - e.x);
      e.x += Math.cos(a) * e.spd * spMul * dt;
      e.y += Math.sin(a) * e.spd * spMul * dt;
    } else {
      e.atkT -= dt;
      if (e.atkT <= 0){
        e.atkT = 1.0;
        G.coreHp -= e.dmg * (1 - guardianReduce());
        G.coreFlash = 0.25;
        G.trauma = Math.min(G.trauma + 0.25, 1);
        burst(L.x + rand(-14, 14), L.y + rand(-14, 14), '#ff5a5a', 8, 2);
        addDmgNum(L.x, L.y - 34, '-' + Math.round(e.dmg), '#ff6a6a', 1.1);
        if (G.coreHp <= 0){ G.coreHp = 0; gameOver(); return; }
      }
    }
    if (e.hp <= 0) killEnemy(i);
  }

  // 골드 오브
  for (let i = G.orbs.length - 1; i >= 0; i--){
    const o = G.orbs[i];
    o.life -= dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    o.vx *= Math.pow(0.01, dt); o.vy *= Math.pow(0.01, dt);
    const d = dist(o.x, o.y, L.x, L.y);
    if (d < 90){
      const a = Math.atan2(L.y - o.y, L.x - o.x);
      o.vx += Math.cos(a) * 700 * dt;
      o.vy += Math.sin(a) * 700 * dt;
    }
    if (d < 24){
      let v = o.value;
      if (Math.random() < sailorLuck()){ v += 1; addDmgNum(o.x, o.y - 10, '+1', '#48cae4', 0.9); }
      G.gold += v;
      G.stats.earned += v;
      burst(o.x, o.y, '#ffd24a', 6, 1.5);
      G.orbs.splice(i, 1);
      continue;
    }
    if (o.life <= 0) G.orbs.splice(i, 1);
  }
}
function hurtEnemy(e, dmg, sx, sy){
  e.hp -= dmg;
  e.flash = e.boss ? 0.13 : 0.16; // 피격 흰색 플래시 강화
  e.sx = e.boss ? 0.85 : 0.68; e.sxV = 2.5; // 피격 스쿼시
  const a = Math.atan2(e.y - sy, e.x - sx);
  const kb = e.boss ? 0.5 : 4; // 보스 넉백 저항
  e.kbx += Math.cos(a) * kb; e.kby += Math.sin(a) * kb;
  burst(e.x, e.y, '#ffe9a8', e.boss ? 5 : 4, 1.8);       // 충돌 스파크
  addDmgNum(e.x + rand(-6, 6), e.y - e.r - 4, Math.round(dmg), dmg >= 20 ? '#ffd24a' : '#ffffff', dmg >= 20 ? 1.3 : 0.9);
}
function killEnemy(i){
  const e = G.enemies[i];
  G.enemies.splice(i, 1);
  G.stats.kills++;
  const big = e.kind === 'tank' || e.boss;
  burst(e.x, e.y, e.color, e.boss ? 70 : big ? 26 : 12, e.boss ? 4 : big ? 3 : 2);
  // 사망 확장 링 + 파편
  G.deathRings.push({ x: e.x, y: e.y, r: e.r * 0.8, r1: e.boss ? 260 : e.r * 5, life: e.boss ? 0.7 : 0.4, maxlife: e.boss ? 0.7 : 0.4, color: e.color });
  const nDeb = e.boss ? 16 : big ? 8 : G.settings.quality ? 5 : 2;
  for (let k = 0; k < nDeb; k++){
    const a = rand(0, TAU), v = rand(60, e.boss ? 320 : 200);
    G.debris.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40,
      rot: rand(0, TAU), vr: rand(-9, 9), life: rand(0.4, e.boss ? 1.1 : 0.7), maxlife: 1,
      size: rand(2.5, e.boss ? 8 : 5.5), color: e.color });
  }
  if (e.boss){
    G.boss = null;
    G.slowmo = Math.max(G.slowmo, 1.3); // 보스 처치 슬로모션
    G.abAmt = 1;
    G.trauma = 1;
    G.hitstop = Math.max(G.hitstop, 0.12);
    G.gold += 10; G.stats.earned += 10;
    addDmgNum(e.x, e.y - 50, '+10G 처치 보너스', '#ffd24a', 1.6);
    flashMsg('심연 군주를 물리쳤습니다!');
  } else if (big){ G.trauma = Math.min(G.trauma + 0.3, 1); G.hitstop = Math.max(G.hitstop, 0.05); }
  // 골드 오브 드롭
  for (let k = 0; k < e.gold; k++){
    const a = rand(0, TAU);
    G.orbs.push({ x: e.x, y: e.y, vx: Math.cos(a) * rand(30, 90), vy: Math.sin(a) * rand(30, 90), value: 1, life: 12 });
  }
}

// ---------- 이펙트 ----------
function mkP(x, y, vx, vy, life, color, size){
  return { x, y, vx, vy, life, maxlife: life, color, size };
}
function burst(x, y, color, n, spd){
  if (!G.settings.quality) n = Math.ceil(n * 0.4);
  for (let i = 0; i < n; i++){
    if (G.particles.length > pCap()) break;
    const a = rand(0, TAU), v = rand(20, 60) * spd;
    G.particles.push(mkP(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.25, 0.6), color, rand(1.5, 3.5)));
  }
}
function ringFx(x, y, r, color){
  if (G.particles.length > pCap()) return;
  for (let i = 0; i < 14; i++){
    const a = i / 14 * TAU;
    G.particles.push(mkP(x, y, Math.cos(a) * r * 2.2, Math.sin(a) * r * 2.2, 0.3, color, 2));
  }
}
function slashFx(x, y, ang, color){
  for (let i = 0; i < 8; i++){
    const a = ang + rand(-0.7, 0.7), v = rand(80, 160);
    G.particles.push(mkP(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.12, 0.25), color, rand(2, 4)));
  }
}
function addDmgNum(x, y, val, color, scale){
  G.dmgNums.push({ x, y, val: String(val), color, scale, life: 0.8 });
}
function flashMsg(m){ G.msg = m; G.msgT = 2.2; }

// ---------- 메타 저장 (환생/잔광) ----------
function saveMeta(){
  G.meta.lastSeen = Date.now();
  localStorage.setItem('abyss_lantern_meta', JSON.stringify(G.meta));
}
function loadMeta(){
  try {
    const m = JSON.parse(localStorage.getItem('abyss_lantern_meta') || 'null');
    if (m){ G.meta = { glimmer: 0, best: 0, totalRuns: 0, upgrades: {}, lastSeen: 0, ...m }; }
  } catch (e){}
  const legacyBest = parseInt(localStorage.getItem('abyss_lantern_best') || '0', 10);
  if (legacyBest > G.meta.best) G.meta.best = legacyBest;
  G.best = G.meta.best;
  // 오프라인 정산 (최대 8시간)
  const nowMs = Date.now();
  if (G.meta.lastSeen && nowMs - G.meta.lastSeen > 5 * 60 * 1000){
    const hours = Math.min((nowMs - G.meta.lastSeen) / 3600000, 8);
    const rate = Math.max(1, Math.floor(G.meta.best / 3));
    const gain = Math.floor(hours * rate * (1 + 0.15 * up('eternal')));
    if (gain > 0){ G.meta.glimmer += gain; G.offlineGain = gain; }
  }
  saveMeta();
}

// ---------- 런 저장/이어하기 ----------
function saveRun(){
  if (G.phase !== 'shop' && G.phase !== 'combat') return;
  const run = {
    v: 5, gold: G.gold, wave: G.wave, coreHp: Math.round(G.coreHp),
    units: G.units.filter(u => !u.mote).map(u => ({ id: u.id, star: u.star, act: u.act })),
    formation: G.formation, behavior: G.behavior, stats: G.stats, savedAt: Date.now(),
  };
  localStorage.setItem('abyss_lantern_run', JSON.stringify(run));
}
function loadSavedRun(){
  try {
    const r = JSON.parse(localStorage.getItem('abyss_lantern_run') || 'null');
    return r && r.v === 5 && r.units ? r : null;
  } catch (e){ return null; }
}
function clearRun(){ localStorage.removeItem('abyss_lantern_run'); }
function restoreRun(r){
  newRun();
  G.gold = r.gold; G.wave = r.wave;
  G.coreHp = Math.min(r.coreHp, G.coreMax);
  G.units = [];
  for (const su of r.units){
    const t = UNIT_TYPES.find(x => x.id === su.id);
    if (!t) continue;
    G.units.push({ ...t, star: su.star, cool: 0,
      x: G.leader.x + rand(-30, 30), y: G.leader.y + rand(-30, 30),
      vx: 0, vy: 0, rot: rand(0, TAU), sx: 1, sxV: 0, act: su.act || 'form', trail: [] });
  }
  G.formation = r.formation || 'circle';
  G.behavior = r.behavior || 'attack';
  G.stats = r.stats || { kills: 0, earned: 0 };
  flashMsg('파도 ' + G.wave + ' - 잔불에서 다시 점화합니다');
}
function buyUpgrade(i){
  const u = REBIRTH_UPGRADES[i];
  const t = up(u.id);
  if (t >= u.max){ flashMsg('최대 단계입니다'); return; }
  const c = u.costs[t];
  if (G.meta.glimmer < c){ flashMsg('잔광이 부족합니다'); return; }
  G.meta.glimmer -= c;
  G.meta.upgrades[u.id] = t + 1;
  saveMeta();
  G.trauma = Math.min(G.trauma + 0.2, 0.6);
  flashMsg(u.name + ' ' + (t + 1) + '단계 - ' + u.desc);
}

// ---------- 액티브 스킬 ----------
function castSkill(i, tx, ty){
  const s = G.skills[i];
  if (!s || s.t > 0 || G.phase !== 'combat') return false;
  tx = clamp(tx, 10, W - 10); ty = clamp(ty, 46, SHOP_Y - 40);
  s.t = s.cd;
  const L = G.leader;
  if (s.id === 'nova'){
    const R = s.radius, dmg = 45 + G.wave * 6;
    burst(tx, ty, '#ff9a5a', 42, 3.6);
    burst(tx, ty, '#ffd24a', 18, 2.2);
    ringFx(tx, ty, R, '#ff9a5a');
    ringFx(tx, ty, R * 0.55, '#ffe9a8');
    for (const e of G.enemies){
      if (dist(tx, ty, e.x, e.y) <= R + e.r){
        hurtEnemy(e, dmg, tx, ty);
        e.kbx *= 3; e.kby *= 3; // 폭발 넉백 강화
      }
    }
    G.skillFx.push({ kind: 'ring', x: tx, y: ty, r: R, color: '#ff9a5a', life: 0.35, maxlife: 0.35 });
    G.trauma = Math.min(G.trauma + 0.55, 1);
    G.hitstop = Math.max(G.hitstop, 0.09);
  } else if (s.id === 'beam'){
    const dmg = 70 + G.wave * 8, LEN = 760, HALF_W = 24;
    const a = Math.atan2(ty - L.y, tx - L.x);
    const x2 = L.x + Math.cos(a) * LEN, y2 = L.y + Math.sin(a) * LEN;
    for (const e of G.enemies){
      const dx = x2 - L.x, dy = y2 - L.y, len2 = dx * dx + dy * dy;
      let tt = ((e.x - L.x) * dx + (e.y - L.y) * dy) / len2;
      tt = clamp(tt, 0, 1);
      if (dist(L.x + dx * tt, L.y + dy * tt, e.x, e.y) < e.r + HALF_W) hurtEnemy(e, dmg, L.x, L.y);
    }
    for (let k = 0; k < 26; k++){
      const d = rand(40, LEN * 0.9);
      G.particles.push(mkP(L.x + Math.cos(a) * d + rand(-10, 10), L.y + Math.sin(a) * d + rand(-10, 10),
        Math.cos(a + Math.PI/2) * rand(-70, 70), Math.sin(a + Math.PI/2) * rand(-70, 70), rand(0.2, 0.45), '#ffe9a8', rand(2, 4)));
    }
    G.skillFx.push({ kind: 'beam', x1: L.x, y1: L.y, x2, y2, life: 0.3, maxlife: 0.3 });
    G.trauma = Math.min(G.trauma + 0.6, 1);
    G.hitstop = Math.max(G.hitstop, 0.1);
  } else if (s.id === 'slow'){
    const R = s.radius;
    G.slowFields.push({ x: tx, y: ty, r: R, life: 5, maxlife: 5 });
    ringFx(tx, ty, R, '#8fe2ff');
    burst(tx, ty, '#8fe2ff', 24, 1.8);
    G.trauma = Math.min(G.trauma + 0.3, 1);
    G.hitstop = Math.max(G.hitstop, 0.06);
  }
  burst(L.x, L.y, s.color, 8, 1.6); // 등불 발화 스파크
  return true;
}
function bestCluster(){
  let best = null, bestN = 0;
  for (const e of G.enemies){
    if (e.hp <= 0) continue;
    let n = 0, cx = 0, cy = 0;
    for (const o of G.enemies){
      if (o.hp > 0 && dist(e.x, e.y, o.x, o.y) < 120){ n++; cx += o.x; cy += o.y; }
    }
    if (n > bestN){ bestN = n; best = { x: cx / n, y: cy / n }; }
  }
  return best ? { x: best.x, y: best.y, n: bestN } : null;
}
function autoCast(){
  if (G.enemies.length < 2) return;
  const c = bestCluster();
  if (!c) return;
  if (G.skills[0].t <= 0 && c.n >= 2) castSkill(0, c.x, c.y);
  else if (G.skills[1].t <= 0 && c.n >= 3) castSkill(1, c.x, c.y);
  else if (G.skills[2].t <= 0 && c.n >= 4) castSkill(2, c.x, c.y);
}
function tryAim(i){
  const s = G.skills[i];
  if (G.aiming === i){ G.aiming = -1; return; }
  if (s.t > 0){ flashMsg(s.name + ' 쿨다운 ' + Math.ceil(s.t) + '초'); return; }
  G.aiming = i;
  flashMsg(s.name + ' 조준 - 클릭/탭으로 발동, ESC 취소');
}

// ---------- UI 레이아웃 ----------
const SHOP_Y = 516, CARD_W = 122, CARD_H = 106, CARD_X0 = 18, CARD_GAP = 10;
function cardRect(i){ return { x: CARD_X0 + i * (CARD_W + CARD_GAP), y: SHOP_Y + 8, w: CARD_W, h: CARD_H }; }
const REROLL_BTN = { x: 686, y: SHOP_Y + 40, w: 92, h: 40 };
const START_BTN  = { x: 788, y: SHOP_Y + 40, w: 104, h: 40 };
const AUTO_BTN   = { x: 900, y: SHOP_Y + 40, w: 106, h: 40 };
const SKILL_BTNS = SKILLS.map((sk, i) => COARSE
  ? { x: W/2 - 134 + i * 92, y: H - 68, w: 84, h: 58 }
  : { x: W/2 - 111 + i * 76, y: H - 58, w: 70, h: 50 });
const BEHAVE_BTNS = BEHAVIORS.map((b, i) => ({ x: 638 + i * 96, y: 44, w: 90, h: 26, id: b.id, name: b.name }));
const FORM_BTNS = FORMATIONS.map((f, i) => ({ x: 18 + i * 88, y: SHOP_Y - 36, w: 80, h: 28, id: f.id, name: f.name }));
function rosterRects(){
  return G.units.map((u, i) => ({ x: 10, y: 56 + i * 26, w: 158, h: 23, i }));
}
const GEAR_BTN = COARSE ? { x: W - 54, y: 42, w: 42, h: 32 } : { x: W - 46, y: 44, w: 34, h: 26 };
const SET_PANEL = { x: W/2 - 170, y: 120, w: 340, h: 210 };
const SET_SHAKE_BTNS = [0, 1, 2].map(v => ({ x: W/2 - 150 + v * 100, y: 186, w: 92, h: 30, v }));
const SET_QUAL_BTNS = [1, 0].map((v, i) => ({ x: W/2 - 150 + i * 100, y: 244, w: 92, h: 30, v }));
const SET_CLOSE_BTN = { x: W/2 - 50, y: 290, w: 100, h: 28 };
const SHAKE_NAMES = ['끔', '약함', '강함'];
const QUAL_NAMES = ['낮음', '높음'];
const TITLE_BTN = { x: W/2 - 90, y: 420, w: 180, h: 52 };
const TITLE_NEW_BTN = { x: W/2 - 90, y: 484, w: 180, h: 40 };
const OVER_BTN  = { x: W/2 - 90, y: 474, w: 180, h: 52 };
const RESET_BTN = { x: W/2 - 70, y: 546, w: 140, h: 28 };
const RB_W = 210, RB_H = 66, RB_GAP = 14;
function rbRect(i){
  const col = i % 3, row = Math.floor(i / 3);
  const x0 = W/2 - (3 * RB_W + 2 * RB_GAP) / 2;
  return { x: x0 + col * (RB_W + RB_GAP), y: 218 + row * (RB_H + RB_GAP), w: RB_W, h: RB_H };
}
function inRect(p, r){ return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

// ---------- 입력 ----------
function pointerPos(e){
  const rect = canvas.getBoundingClientRect();
  const s = rect.width / W;
  return { x: (e.clientX - rect.left) / s, y: (e.clientY - rect.top) / s };
}
canvas.addEventListener('pointermove', e => {
  const p = pointerPos(e);
  G.mouse.x = p.x; G.mouse.y = p.y;
  G.hoverCard = -1;
  if (G.phase === 'shop'){
    for (let i = 0; i < 5; i++) if (inRect(p, cardRect(i))){ G.hoverCard = i; break; }
  }
});
canvas.addEventListener('pointerdown', e => {
  const p = pointerPos(e);
  // 설정 패널
  if (G.settingsOpen){
    if (inRect(p, SET_CLOSE_BTN) || !inRect(p, SET_PANEL)){ G.settingsOpen = false; return; }
    for (const b of SET_SHAKE_BTNS){
      if (inRect(p, b)){ G.settings.shake = b.v; saveSettings(); G.trauma = 0.7; flashMsg('화면 흔들림: ' + SHAKE_NAMES[b.v]); return; }
    }
    for (const b of SET_QUAL_BTNS){
      if (inRect(p, b)){ G.settings.quality = b.v; saveSettings(); flashMsg('품질: ' + QUAL_NAMES[b.v]); return; }
    }
    return;
  }
  if (G.phase !== 'title' && inRect(p, GEAR_BTN)){ G.settingsOpen = true; return; }
  if (G.phase === 'title'){
    if (G.savedRun){
      if (inRect(p, TITLE_BTN)){ restoreRun(G.savedRun); return; }
      if (inRect(p, TITLE_NEW_BTN)){ newRun(); return; }
      return;
    }
    if (inRect(p, TITLE_BTN)) newRun();
    return;
  }
  if (G.phase === 'over'){
    for (let i = 0; i < REBIRTH_UPGRADES.length; i++){
      if (inRect(p, rbRect(i))){ buyUpgrade(i); return; }
    }
    if (inRect(p, OVER_BTN)){ newRun(); return; }
    if (inRect(p, RESET_BTN)){
      if (G.resetConfirmT > 0){
        // pagehide의 재저장을 막기 위해 메모리 상태부터 초기화
        G.meta = { glimmer: 0, best: 0, totalRuns: 0, upgrades: {}, lastSeen: 0 };
        G.savedRun = null;
        G.phase = 'title';
        localStorage.removeItem('abyss_lantern_meta');
        localStorage.removeItem('abyss_lantern_run');
        localStorage.removeItem('abyss_lantern_best');
        location.reload();
      } else {
        G.resetConfirmT = 3;
        flashMsg('정말 모든 기록을 초기화할까요? 버튼을 다시 누르세요');
      }
      return;
    }
    return;
  }
  // 위임 모드 버튼 (상시)
  for (const b of BEHAVE_BTNS){
    if (inRect(p, b)){
      G.behavior = b.id;
      flashMsg('위임 모드: ' + b.name);
      return;
    }
  }
  if (G.phase === 'shop'){
    if (inRect(p, REROLL_BTN)){
      if (G.gold >= 2){ G.gold -= 2; rollShop(); } else flashMsg('골드가 부족합니다');
      return;
    }
    if (inRect(p, START_BTN)){ startWave(); return; }
    if (inRect(p, AUTO_BTN)){
      G.autoNext = !G.autoNext;
      localStorage.setItem('abyss_lantern_autonext', G.autoNext ? '1' : '0');
      G.autoTimer = (G.autoNext && G.phase === 'shop') ? 10 : 0;
      flashMsg(G.autoNext ? '자동 진행 켜짐 - 파도가 자동으로 시작됩니다' : '자동 진행 꺼짐 - 버튼/스페이스로 시작');
      return;
    }
    for (const f of FORM_BTNS){
      if (inRect(p, f)){ G.formation = f.id; flashMsg('진형: ' + f.name); return; }
    }
    for (let i = 0; i < 5; i++){
      if (inRect(p, cardRect(i))){ buyCard(i); return; }
    }
    // 유닛 명단: 클릭으로 개별 행동 순환
    for (const r of rosterRects()){
      if (inRect(p, r)){
        const u = G.units[r.i];
        const idx = UNIT_ACTS.findIndex(a => a.id === u.act);
        u.act = UNIT_ACTS[(idx + 1) % UNIT_ACTS.length].id;
        flashMsg(u.name + ' 행동: ' + UNIT_ACTS[(idx + 1) % UNIT_ACTS.length].name);
        return;
      }
    }
    return;
  }
  if (G.phase === 'combat'){
    // 스킬 버튼 (모바일 탭 지원)
    for (let i = 0; i < 3; i++){
      if (inRect(p, SKILL_BTNS[i])){ tryAim(i); return; }
    }
    // 조준 중 클릭/탭 = 발동
    if (G.aiming >= 0){
      castSkill(G.aiming, p.x, p.y);
      G.aiming = -1;
      return;
    }
    // 아레나 클릭/드래그 = 수동 조종
    if (p.y < SHOP_Y - 30){
      G.mouse.down = true;
      G.control = 'manual';
      G.lastManual = G.time;
    }
  }
});
canvas.addEventListener('pointerup', () => { G.mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  G.keys[k] = true;
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k) && G.phase === 'combat'){
    G.control = 'manual';
    G.lastManual = G.time;
  }
  if (G.phase === 'combat' && ['1', '2', '3'].includes(k)) tryAim(parseInt(k, 10) - 1);
  if (k === 'escape') G.aiming = -1;
  if (e.key === ' '){
    e.preventDefault();
    if (G.phase === 'shop') startWave();
    else if (G.phase === 'combat'){
      if (G.control === 'manual'){ G.control = 'delegate'; flashMsg('위임 모드 (' + BEHAVIORS.find(b => b.id === G.behavior).name + ')'); }
      else { G.control = 'manual'; G.lastManual = G.time; flashMsg('수동 조종 (마우스/WASD)'); }
    }
  }
});
window.addEventListener('keyup', e => { G.keys[e.key.toLowerCase()] = false; });

function drawBoss(e){
  const L = G.leader;
  // 강타 전조 라인 (쿨다운 막바지 1초)
  const inRange = dist(e.x, e.y, L.x, L.y) <= 70 + e.r;
  if (inRange && e.atkT < 1.0){
    const a = 1 - e.atkT;
    ctx.globalAlpha = 0.25 + a * 0.6;
    ctx.strokeStyle = '#ff4a5a';
    ctx.lineWidth = 2 + a * 4;
    ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(L.x, L.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(L.x, L.y, 40 + Math.sin(G.time * 12) * 6, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  // 쿨다운 아크 (보스 머리 위)
  if (inRange){
    const cdr = clamp(1 - e.atkT / e.atkCd, 0, 1);
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = cdr > 0.7 ? '#ff4a5a' : 'rgba(255,154,90,0.8)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(e.x, e.y - e.r - 14, 9, -Math.PI/2, -Math.PI/2 + cdr * TAU); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.sx, 2 - e.sx > 0.7 ? 2 - e.sx : 1);
  ctx.translate(-e.x, -e.y);
  // 회전 파편 고리
  for (let k = 0; k < 8; k++){
    const a = G.time * 1.2 + k / 8 * TAU;
    const px = e.x + Math.cos(a) * (e.r + 12), py = e.y + Math.sin(a) * (e.r + 12);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a + G.time * 3);
    ctx.fillStyle = e.flash > 0 ? '#fff' : '#5a1fa0';
    ctx.fillRect(-4, -4, 8, 8);
    ctx.restore();
  }
  // 본체
  shapePath(e.x, e.y, e.r * 1.15, e.rot, 6);
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#3d1470';
  ctx.shadowColor = '#8a2be2';
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = e.flash > 0 ? '#fff' : '#b45aff';
  ctx.lineWidth = 3;
  ctx.stroke();
  shapePath(e.x, e.y, e.r * 0.62, -e.rot * 1.4, 6);
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#24084a';
  ctx.fill();
  // 눈 3개
  ctx.fillStyle = e.flash > 0 ? '#222' : '#ff2a5a';
  ctx.shadowColor = '#ff2a5a'; ctx.shadowBlur = 10;
  for (const off of [-0.38, 0, 0.38]){
    ctx.beginPath();
    ctx.arc(e.x + off * e.r, e.y - e.r * 0.12 + Math.sin(G.time * 3 + off * 8) * 2, 3.6, 0, TAU);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ---------- 도형 그리기 ----------
function shapePath(x, y, r, rot, sides){
  ctx.beginPath();
  if (sides === 4){ // 다이아
    ctx.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r);
    ctx.lineTo(x + Math.cos(rot + Math.PI/2) * r * 0.8, y + Math.sin(rot + Math.PI/2) * r * 0.8);
    ctx.lineTo(x + Math.cos(rot + Math.PI) * r, y + Math.sin(rot + Math.PI) * r);
    ctx.lineTo(x + Math.cos(rot - Math.PI/2) * r * 0.8, y + Math.sin(rot - Math.PI/2) * r * 0.8);
  } else if (sides === 3){
    for (let i = 0; i < 3; i++){
      const a = rot + i * TAU / 3;
      const rr = i === 0 ? r * 1.15 : r * 0.85;
      i === 0 ? ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  } else {
    for (let i = 0; i < 6; i++){
      const a = rot + i * TAU / 6;
      i === 0 ? ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
  }
  ctx.closePath();
}
function unitShapePath(x, y, r, rot, cls){
  ctx.beginPath();
  if (cls === 'cleric'){ // 십자
    const w = r * 0.38;
    ctx.moveTo(x - w, y - r); ctx.lineTo(x + w, y - r); ctx.lineTo(x + w, y - w);
    ctx.lineTo(x + r, y - w); ctx.lineTo(x + r, y + w); ctx.lineTo(x + w, y + w);
    ctx.lineTo(x + w, y + r); ctx.lineTo(x - w, y + r); ctx.lineTo(x - w, y + w);
    ctx.lineTo(x - r, y + w); ctx.lineTo(x - r, y - w); ctx.lineTo(x - w, y - w);
  } else if (cls === 'assassin'){ // 길쭉한 연꼴
    ctx.moveTo(x + Math.cos(rot) * r * 1.4, y + Math.sin(rot) * r * 1.4);
    ctx.lineTo(x + Math.cos(rot + Math.PI/2) * r * 0.5, y + Math.sin(rot + Math.PI/2) * r * 0.5);
    ctx.lineTo(x + Math.cos(rot + Math.PI) * r * 0.85, y + Math.sin(rot + Math.PI) * r * 0.85);
    ctx.lineTo(x + Math.cos(rot - Math.PI/2) * r * 0.5, y + Math.sin(rot - Math.PI/2) * r * 0.5);
  } else if (cls === 'summoner' || cls === 'sailor'){ // 별 (5각/4각)
    const pts = cls === 'summoner' ? 5 : 4;
    for (let i = 0; i < pts * 2; i++){
      const a = rot + i * Math.PI / pts;
      const rr = i % 2 === 0 ? r : r * 0.48;
      i === 0 ? ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  } else {
    const sides = cls === 'sword' ? 4 : cls === 'archer' || cls === 'warlock' ? 3 : cls === 'cannon' ? 5 : 6;
    const base = cls === 'guardian' ? r * 1.2 : r;
    const rot2 = cls === 'warlock' ? rot + Math.PI : rot;
    for (let i = 0; i < sides; i++){
      const a = rot2 + i * TAU / sides;
      const rr = sides === 3 ? (i === 0 ? base * 1.15 : base * 0.85) : base;
      i === 0 ? ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  }
  ctx.closePath();
}
function drawUnitShape(u, x, y, rot, sx, alpha){
  const col = CLASSES[u.cls].color;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sx, 2 - sx > 0.7 ? 2 - sx : 1); // 스쿼시&스트레치
  ctx.translate(-x, -y);
  ctx.globalAlpha = alpha;
  ctx.shadowColor = col;
  ctx.shadowBlur = 12;
  unitShapePath(x, y, 12, rot, u.cls);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(5,8,18,0.75)';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // 내부 하이라이트
  unitShapePath(x, y, 5.5, rot, u.cls);
  ctx.fillStyle = CLASSES[u.cls].light;
  ctx.globalAlpha = alpha * 0.9;
  ctx.fill();
  ctx.globalAlpha = alpha;
  ctx.restore();
}
function drawStarPips(x, y, star){
  ctx.fillStyle = '#ffd24a';
  for (let i = 0; i < star; i++){
    ctx.beginPath();
    ctx.arc(x + (i - (star - 1) / 2) * 9, y, 2.5, 0, TAU);
    ctx.fill();
  }
}

// ---------- 렌더 ----------
function draw(){
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  const sh = G.trauma * G.trauma * 14 * shakeMul();
  ctx.translate(rand(-sh, sh), rand(-sh, sh));

  drawBackground();
  if (G.phase === 'title'){ drawTitle(); return; }
  drawBeams();
  drawOrbs();
  drawEnemies();
  drawUnits();
  drawLantern();
  drawProjectiles();
  drawSkillFx();
  drawDeathFx();
  drawParticles();
  drawDmgNums();
  drawVignette();
  drawPost();
  if (G.phase === 'combat'){ drawAim(); drawSkillBar(); }
  drawBossBar();
  drawHUD();
  if (G.phase === 'shop') drawShop();
  if (G.phase === 'over') drawOver();
  if (G.settingsOpen) drawSettings();
}

// ---------- 사망 링/파편 ----------
function drawDeathFx(){
  for (const r of G.deathRings){
    const a = clamp(r.life / r.maxlife, 0, 1);
    const rr = lerp(r.r1, r.r, a); // 감속하며 확장
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 1 + a * 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a * 0.35;
    ctx.beginPath(); ctx.arc(r.x, r.y, rr * 0.6, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 1;
  for (const d of G.debris){
    const a = clamp(d.life / 0.5, 0, 1);
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size * 0.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- 후처리 (품질 높음) ----------
function drawPost(){
  if (!G.settings.quality) return;
  // 색수차 가장자리 프린지
  if (G.abAmt > 0.02){
    const a = G.abAmt;
    const w = 26 + a * 60;
    let g = ctx.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, 'rgba(255,40,70,' + (0.22 * a) + ')');
    g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, w, H + 40);
    g = ctx.createLinearGradient(W, 0, W - w, 0);
    g.addColorStop(0, 'rgba(60,200,255,' + (0.22 * a) + ')');
    g.addColorStop(1, 'rgba(60,200,255,0)');
    ctx.fillStyle = g; ctx.fillRect(W - w, -20, w + 20, H + 40);
  }
  // 보스 경고: 화면 암전 펄스
  if (G.bossWarnT > 0){
    const a = Math.min(0.4, G.bossWarnT * 0.3) * (0.7 + 0.3 * Math.sin(G.time * 9));
    ctx.fillStyle = 'rgba(40,4,60,' + a + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  // 등불 위기: 붉은 맥동 비네트
  if ((G.phase === 'combat' || G.phase === 'shop') && G.coreHp / G.coreMax < 0.3){
    const a = (0.3 - G.coreHp / G.coreMax) * (0.55 + 0.45 * Math.sin(G.time * 5));
    const g = ctx.createRadialGradient(W/2, H/2, 220, W/2, H/2, 640);
    g.addColorStop(0, 'rgba(255,30,40,0)');
    g.addColorStop(1, 'rgba(255,30,40,' + (a * 0.5) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
}

// ---------- 보스 HP/쿨다운 바 ----------
function drawBossBar(){
  const b = G.boss;
  if (!b) return;
  const bw = 460, bx = W/2 - bw/2, by = 90;
  ctx.fillStyle = 'rgba(4,8,18,0.8)';
  ctx.beginPath(); ctx.roundRect(bx - 10, by - 24, bw + 20, 52, 8); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#d9a8ff';
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.fillText('심연 군주', W/2, by - 8);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx, by, bw, 10);
  const hpr = clamp(b.hp / b.maxhp, 0, 1);
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#b45aff'); g.addColorStop(1, '#ff4a9a');
  ctx.fillStyle = g;
  ctx.fillRect(bx, by, bw * hpr, 10);
  // 공격 쿨다운 라인
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx, by + 13, bw, 4);
  const inRange = dist(b.x, b.y, G.leader.x, G.leader.y) <= 70 + b.r;
  const cdr = inRange ? clamp(1 - b.atkT / b.atkCd, 0, 1) : 0;
  ctx.fillStyle = cdr > 0.7 ? '#ff4a5a' : '#ff9a5a';
  ctx.fillRect(bx, by + 13, bw * cdr, 4);
  ctx.fillStyle = 'rgba(220,190,255,0.75)';
  ctx.font = '9px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(inRange ? (cdr >= 1 ? '강타!' : '강타 대기') : '접근 중', bx + bw + 8, by + 17);
}

function drawBackground(){
  const g = ctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 620);
  g.addColorStop(0, '#0a1024');
  g.addColorStop(1, '#02030a');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.strokeStyle = 'rgba(60,90,160,0.07)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++){
    ctx.beginPath();
    ctx.arc(G.leader.x, G.leader.y, 120 + i * 90 + Math.sin(G.time * 0.5 + i) * 6, 0, TAU);
    ctx.stroke();
  }
}

function drawBeams(){
  const L = G.leader;
  G.beamAngle += 0.003;
  ctx.save();
  ctx.translate(L.x, L.y);
  for (const off of [0, Math.PI]){
    const a = G.beamAngle + off;
    const grad = ctx.createLinearGradient(0, 0, Math.cos(a) * 430, Math.sin(a) * 430);
    grad.addColorStop(0, 'rgba(255,214,140,0.09)');
    grad.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 430, a - 0.15, a + 0.15);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawLantern(){
  const L = G.leader;
  // 잔상
  for (const t of L.trail){
    ctx.globalAlpha = t.life / 0.35 * 0.25;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 20, 0, TAU);
    ctx.fillStyle = '#ffd27a';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const pulse = 1 + Math.sin(G.time * 2.4) * 0.06;
  const g = ctx.createRadialGradient(L.x, L.y, 4, L.x, L.y, 85 * pulse);
  g.addColorStop(0, 'rgba(255,214,140,0.45)');
  g.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(L.x, L.y, 85 * pulse, 0, TAU);
  ctx.fill();
  // 등불 본체: 다이아 프레임 + 코어
  shapePath(L.x, L.y, 24, Math.PI/4, 4);
  ctx.strokeStyle = G.coreFlash > 0 ? '#fff' : 'rgba(255,220,150,0.85)';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(L.x, L.y, 14 * (G.coreFlash > 0 ? 1.2 : 1), 0, TAU);
  ctx.fillStyle = G.coreFlash > 0 ? '#fff2d8' : '#ffd27a';
  ctx.shadowColor = '#ffd27a';
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.shadowBlur = 0;
  if (G.coreFlash > 0) G.coreFlash -= 0.016;
}

function drawUnits(){
  for (const u of G.units){
    for (const t of u.trail) drawUnitShape(u, t.x, t.y, t.rot, 0.9, t.life / 0.28 * 0.3);
  }
  for (const u of G.units){
    drawUnitShape(u, u.x, u.y, u.rot, u.sx, 1);
    drawStarPips(u.x, u.y - 21, u.star);
    // 행동 표시 (기본 진형 외)
    if (u.act !== 'form'){
      ctx.fillStyle = 'rgba(200,220,255,0.75)';
      ctx.font = '9px "Noto Sans KR",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(u.act === 'charge' ? '돌격' : '고정', u.x, u.y + 26);
    }
  }
}

function drawEnemies(){
  for (const e of G.enemies){
    if (e.boss){ drawBoss(e); continue; }
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(e.sx, 2 - e.sx > 0.7 ? 2 - e.sx : 1);
    ctx.rotate(e.rot);
    ctx.translate(-e.x, -e.y);
    const w = e.r * 1.7;
    ctx.beginPath();
    ctx.roundRect(e.x - w/2, e.y - w/2, w, w, 4);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = e.kind === 'tank' ? 14 : 7;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(8,6,20,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 눈
    ctx.fillStyle = e.flash > 0 ? '#222' : '#ff4a6a';
    ctx.shadowColor = '#ff4a6a';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(e.x - e.r * 0.32, e.y - e.r * 0.18, 2, 0, TAU);
    ctx.arc(e.x + e.r * 0.32, e.y - e.r * 0.18, 2, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    if (e.hp < e.maxhp){
      const w2 = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - w2/2, e.y - e.r - 9, w2, 3);
      ctx.fillStyle = '#ff5a6a';
      ctx.fillRect(e.x - w2/2, e.y - e.r - 9, w2 * (e.hp / e.maxhp), 3);
    }
  }
}

function drawOrbs(){
  for (const o of G.orbs){
    const blink = o.life < 3 ? (Math.sin(G.time * 14) > 0 ? 1 : 0.35) : 1;
    ctx.globalAlpha = blink;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 5, 0, TAU);
    ctx.fillStyle = '#ffd24a';
    ctx.shadowColor = '#ffd24a';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 2, 0, TAU);
    ctx.fillStyle = '#fff2c8';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawProjectiles(){
  for (const p of G.projectiles){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.mage ? 5 : 3, 0, TAU);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawParticles(){
  for (const p of G.particles){
    ctx.globalAlpha = clamp(p.life / p.maxlife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawDmgNums(){
  ctx.textAlign = 'center';
  for (const d of G.dmgNums){
    ctx.globalAlpha = clamp(d.life / 0.8, 0, 1);
    ctx.fillStyle = d.color;
    ctx.font = 'bold ' + Math.round(13 * d.scale) + 'px "Noto Sans KR",sans-serif';
    ctx.fillText(d.val, d.x, d.y);
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  // 등불 중심 조명 + 가장자리 어둠 (가벼운 후처리)
  const L = G.leader;
  const g = ctx.createRadialGradient(L.x, L.y, 180, L.x, L.y, 640);
  g.addColorStop(0, 'rgba(2,3,10,0)');
  g.addColorStop(1, 'rgba(2,3,10,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
}

function drawSkillFx(){
  for (const f of G.skillFx){
    const a = clamp(f.life / f.maxlife, 0, 1);
    if (f.kind === 'beam'){
      ctx.globalAlpha = a * 0.35;
      ctx.strokeStyle = '#ffb44a';
      ctx.lineWidth = 30;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = '#fff6da';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } else if (f.kind === 'ring'){
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.15 - a * 0.15), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
  }
  for (const f of G.slowFields){
    const a = clamp(f.life / f.maxlife, 0, 1);
    ctx.globalAlpha = 0.14 * a + 0.05;
    ctx.fillStyle = '#8fe2ff';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.6 * a;
    ctx.strokeStyle = '#8fe2ff';
    ctx.setLineDash([8, 8]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, G.time * 0.8, G.time * 0.8 + TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
}
function drawAim(){
  if (G.aiming < 0) return;
  const s = G.skills[G.aiming];
  const m = G.mouse, L = G.leader;
  ctx.fillStyle = 'rgba(2,4,12,0.35)';
  ctx.fillRect(0, 40, W, SHOP_Y - 70);
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  if (s.id === 'beam'){
    const a = Math.atan2(m.y - L.y, m.x - L.x);
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(L.x + Math.cos(a) * 760, L.y + Math.sin(a) * 760); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1; ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.15;
    ctx.beginPath(); ctx.arc(m.x, m.y, s.radius, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(m.x, m.y, s.radius, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1; ctx.globalAlpha = 1;
  }
  ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(s.name + ' - 클릭/탭으로 발동 (ESC 취소)', W/2, SHOP_Y - 46);
}
function drawSkillBar(){
  for (let i = 0; i < 3; i++){
    const r = SKILL_BTNS[i], s = G.skills[i];
    const ready = s.t <= 0, aiming = G.aiming === i;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = aiming ? 'rgba(255,210,74,0.3)' : ready ? 'rgba(40,56,96,0.75)' : 'rgba(20,28,50,0.75)';
    ctx.fill();
    ctx.strokeStyle = aiming ? '#ffd24a' : ready ? s.color : 'rgba(90,110,150,0.5)';
    ctx.lineWidth = aiming ? 2 : 1.2;
    ctx.stroke();
    ctx.lineWidth = 1;
    // 아이콘
    ctx.fillStyle = ready || aiming ? s.color : 'rgba(110,125,155,0.7)';
    const cx = r.x + r.w/2, cy = r.y + r.h * 0.34;
    if (s.id === 'nova'){ ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy, 11, 0, TAU); ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); }
    else if (s.id === 'beam'){ ctx.fillRect(cx - 10, cy - 2.5, 20, 5); }
    else { ctx.beginPath(); ctx.arc(cx, cy, 8, 0, TAU); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2.5; ctx.stroke(); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill(); }
    // 이름 + 키
    ctx.font = (COARSE ? 11 : 10) + 'px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(200,214,240,0.9)';
    ctx.fillText('[' + s.key + '] ' + s.name, cx, r.y + r.h * 0.78);
    // 쿨다운 오버레이
    if (!ready){
      const ratio = s.t / s.cd;
      ctx.fillStyle = 'rgba(4,8,18,0.72)';
      ctx.beginPath();
      ctx.roundRect(r.x, r.y, r.w, r.h * ratio, 8);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px "Noto Sans KR",sans-serif';
      ctx.fillText(Math.ceil(s.t) + '', cx, r.y + r.h * 0.48);
    }
  }
}

function drawOver(){

  ctx.fillRect(-20, -20, W + 40, H + 40);

  g.addColorStop(0, 'rgba(255,180,74,0.28)');
  g.addColorStop(1, 'rgba(255,180,74,0)');
  ctx.fillStyle = g;
  ctx.fillRect(L.x - glowR, L.y - glowR, glowR * 2, glowR * 2);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb44a';
  ctx.font = 'bold 30px "Noto Sans KR",sans-serif';
  ctx.fillText('등불이 꺼졌습니다', W/2, 104);

  ctx.font = '14px "Noto Sans KR",sans-serif';
  ctx.fillText('파도 ' + G.wave + ' · 처치 ' + G.stats.kills + ' · 횟수 ' + G.meta.totalRuns + '회', W/2, 134);

  ctx.font = 'bold 16px "Noto Sans KR",sans-serif';

  ctx.fillStyle = 'rgba(140,160,200,0.75)';
  ctx.font = '12px "Noto Sans KR",sans-serif';
  ctx.fillText('영구 강화 - 잔광으로 다음 점화를 밝히세요', W/2, 196);

  for (let i = 0; i < REBIRTH_UPGRADES.length; i++){
    const u = REBIRTH_UPGRADES[i], r = rbRect(i);
    const t = up(u.id);
    const maxed = t >= u.max;
    const cost = maxed ? 0 : u.costs[t];
    const afford = !maxed && G.meta.glimmer >= cost;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = maxed ? 'rgba(24,34,60,0.85)' : afford ? 'rgba(44,60,100,0.92)' : 'rgba(20,28,50,0.85)';
    ctx.fill();
    ctx.strokeStyle = maxed ? 'rgba(90,110,150,0.4)' : afford ? '#ffd24a' : 'rgba(90,110,150,0.5)';
    ctx.lineWidth = afford ? 1.8 : 1.1;
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? 'rgba(160,175,205,0.8)' : '#f0f5ff';
    ctx.font = 'bold 12px "Noto Sans KR",sans-serif';
    ctx.fillText(u.name, r.x + 10, r.y + 20);
    // 단계 핍
    ctx.textAlign = 'right';
    let pips = '';
    for (let k = 0; k < u.max; k++) pips += k < t ? '●' : '○';
    ctx.fillStyle = '#ffd24a';
    ctx.font = '10px "Noto Sans KR",sans-serif';
    ctx.fillText(pips, r.x + r.w - 10, r.y + 20);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(190,205,235,0.85)';
    ctx.font = '10px "Noto Sans KR",sans-serif';
    ctx.fillText(u.desc, r.x + 10, r.y + 38);
    ctx.fillStyle = maxed ? 'rgba(140,160,200,0.6)' : afford ? '#ffd24a' : 'rgba(255,120,120,0.85)';
    ctx.font = 'bold 11px "Noto Sans KR",sans-serif';
    ctx.fillText(maxed ? 'MAX' : '잔광 ' + cost, r.x + 10, r.y + 56);
  }

  if (G.msgT > 0){
    ctx.globalAlpha = clamp(G.msgT / 0.4, 0, 1);
    ctx.fillStyle = '#ffe9b0';
    ctx.font = 'bold 13px "Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(G.msg, W/2, 452);
    ctx.globalAlpha = 1;
  }
  drawButton(OVER_BTN, '다시 점화', true);
  // 기록 초기화 (2단계 확인)
  ctx.beginPath();
  ctx.roundRect(RESET_BTN.x, RESET_BTN.y, RESET_BTN.w, RESET_BTN.h, 6);
  ctx.fillStyle = G.resetConfirmT > 0 ? 'rgba(160,40,40,0.55)' : 'rgba(30,40,70,0.6)';
  ctx.fill();
  ctx.fillStyle = G.resetConfirmT > 0 ? '#ffb0b0' : 'rgba(150,170,210,0.65)';
  ctx.font = '11px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(G.resetConfirmT > 0 ? '정말 초기화? 다시 클릭' : '기록 초기화', RESET_BTN.x + RESET_BTN.w/2, RESET_BTN.y + 18);
}

// ---------- 메인 루프 ----------
let lastT = performance.now();
let fpsWall = performance.now(), fpsFrames = 0;
function loop(now){
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  fpsFrames++;
  if (now - fpsWall >= 500){ G.fps = fpsFrames * 1000 / (now - fpsWall); fpsFrames = 0; fpsWall = now; }
  if (SPEED > 1) dt *= SPEED;
  if (G.hitstop > 0){ G.hitstop -= dt; draw(); requestAnimationFrame(loop); return; }
  if (G.slowmo > 0){ G.slowmo -= dt; G.abAmt = Math.max(G.abAmt, 0.7); dt *= 0.22; } // 슬로모션
  if (G.settingsOpen){ draw(); requestAnimationFrame(loop); return; } // 설정 열린 동안 일시정지
  G.abAmt = Math.max(0, G.abAmt - dt * 1.4);
  G.time += dt;
  G.trauma = Math.max(0, G.trauma - dt * 1.6);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.phase === 'combat' || G.phase === 'shop'){
    updateLeader(dt);
    updateUnits(dt);
  }
  if (G.phase === 'combat') updateCombat(dt);
  if (G.phase === 'combat' || G.phase === 'shop'){
    for (const sk of G.skills) if (sk.t > 0) sk.t = Math.max(0, sk.t - dt);
  }
  for (let i = G.slowFields.length - 1; i >= 0; i--){
    const f = G.slowFields[i]; f.life -= dt;
    if (f.life <= 0) G.slowFields.splice(i, 1);
  }
  for (let i = G.skillFx.length - 1; i >= 0; i--){
    const f = G.skillFx[i]; f.life -= dt;
    if (f.life <= 0) G.skillFx.splice(i, 1);
  }
  if (G.phase === 'shop' && G.autoTimer > 0){
    G.autoTimer -= dt;
    if (G.autoTimer <= 0) startWave();
  }
  if (G.resetConfirmT > 0) G.resetConfirmT -= dt;
  G.saveT += dt;
  if (G.saveT > 10){
    G.saveT = 0;
    saveRun();
    saveMeta();
  }
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.01, dt); p.vy *= Math.pow(0.01, dt);
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.dmgNums.length - 1; i >= 0; i--){
    const d = G.dmgNums[i];
    d.life -= dt; d.y -= 30 * dt;
    if (d.life <= 0) G.dmgNums.splice(i, 1);
  }
  for (let i = G.deathRings.length - 1; i >= 0; i--){
    const r = G.deathRings[i];
    r.life -= dt;
    if (r.life <= 0) G.deathRings.splice(i, 1);
  }
  for (let i = G.debris.length - 1; i >= 0; i--){
    const d = G.debris[i];
    d.life -= dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 340 * dt; // 중력
    d.vx *= Math.pow(0.2, dt);
    d.rot += d.vr * dt;
    if (d.life <= 0) G.debris.splice(i, 1);
  }
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('pagehide', () => { saveRun(); saveMeta(); });
loadSettings();
loadMeta();
G.savedRun = loadSavedRun();
requestAnimationFrame(loop);

// ---------- 자동 부팅 테스트 (?autotest=1) ----------
let SPEED = 1;
if (location.search.indexOf('autotest') >= 0){
  const m = location.search.match(/speed=(\d+)/);
  if (m) SPEED = Math.min(8, parseInt(m[1], 10) || 1);
  window.__G = G;
  setTimeout(() => {
    newRun();
    const wm = location.search.match(/wave=(\d+)/);
    if (wm){ G.wave = Math.max(0, parseInt(wm[1], 10) || 0); G.gold = 500; }
    let placed = 0;
    for (let guard = 0; guard < 12 && placed < 3; guard++){
      let bi = -1, bc = 99;
      for (let i = 0; i < 5; i++){ const t = G.shop[i]; if (t && t.cost < bc && t.cost <= G.gold){ bc = t.cost; bi = i; } }
      if (bi < 0) break;
      buyCard(bi);
      placed++;
    }
    startWave();
  }, 300);
}
